ห้ระบบของหน่วยงานภายนอกส่งคำขอออก VC โดยใช้ทางเข้าและ flow เดียวกับคำขอที่มาจาก Portal (ISSUANCE-02) ไม่แยกเป็นโค้ดคนละชุด\n2. ยืนยันตัวตนของระบบที่เรียกเข้ามาด้วย API Key และตรวจ scope ว่ามีสิทธิ์ออก VC ประเภทนั้นในนามองค์กรนั้นจริง (INTEGRATION-01, IDENTITY-03)\n3. รองรับคำขอเป็นชุด (batch) โดยแต่ละรายการมีผลสำเร็จหรือล้มเหลวแยกกัน และรายงานผลรายรายการกลับไป\n4. รองรับ idempotency ด้วย reference ของระบบต้นทาง ส่งคำขอเดิมซ้ำต้องไม่ได้ VC ซ้ำ\n5. แจ้งสถานะกลับผ่าน webhook เมื่อ offer ถูกรับ หมดอายุ หรือถูกยกเลิก (INTEGRATION-01)\n6. จำกัดอัตราการเรียก (rate limit) ต่อ API Key และบันทึกทุกคำขอลง audit log พร้อมระบุที่มา (AUDIT-01)", "ac": "1. ระบบภายนอกส่งคำขอออก VC ผ่าน API ด้วย API Key ที่มี scope ถูกต้อง แล้วได้ credential offer กลับ\n2. API Key ที่ไม่มี scope หรือเรียกข้ามองค์กร ถูกปฏิเสธพร้อมเหตุผล\n3. ส่งคำขอเป็นชุดแล้วได้ผลรายรายการครบ โดยรายการที่ล้มเหลวไม่ทำให้รายการอื่นล้มตาม\n4. ส่งคำขอเดิมซ้ำด้วย reference เดิม ไม่เกิด VC ซ้ำ\n5. เมื่อผู้ถือรับ offer สำเร็จ ระบบต้นทางได้รับ webhook แจ้งสถานะ\n6. ทุกคำขอปรากฏใน audit log พร้อมระบุว่ามาจาก API Key ดอกใด", "sx": "งานหลักของระบบ as a backend engineer of an external agency system, i want to ส่งคำขอออก vc เข้ามาที่ vcvp core ผ่าน api ได้ทั้งรายการเดียวและเป็นชุด, so that หน่วยงานออก vc จากระบบทะเบียนของตัวเองได้โดยไม่ต้องให้เจ้าหน้าที่กดทีละใบจากหน้าจอ"}, "ISSUANCE-03": {"id": "ISSUANCE-03", "what": "รับคำขอแบบ self-service แล้วผูกคำขอกับ VC ที่ออกให้", "out": "ประชาชนยื่นขอเองแล้วได้ offer กลับโดยไม่ต้องติดต่อเจ้าหน้าที่", "comp": "Issuance Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Credential Request & Linking Workflow", "pri": "Medium", "pts": 5, "dep": "ISSUANCE-02, IDENTITY-06", "sprint": 6, "status": "Backlog", "ws": "Issuance Service", "phase": "เฟส 3 · 3.1 Final test", "scope": "1. รับคำขอ self-service (เลขบัตร ปชช./เลขใบอนุญาต) จาก Wallet\n2. ตรวจ/ส่งต่อให้ Issuer และสร้าง credential offer ผ่าน flow ออก VC\n3. link คำขอกับ credentialId เมื่อออกสำเร็จ และแสดงสถานะ", "ac": "1. รับคำขอ self-service และสร้าง offer ตอบกลับได้\n2. เชื่อมคำขอกับ credentialId ถูกต้อง\n3. แสดงสถานะคำขอย้อนหลังได้", "sx": "งานหลักของระบบ as a backend engineer, i want to ให้ vcvp core รองรับคำขอรับ vc แบบ self-service และเชื่อมโยงคำขอ, so that ผู้ถือเริ่มขอรับ vc เองได้และระบบเชื่อมกับการออกจริง"}, "VERIFICATION-02": {"id": "VERIFICATION-02", "what": "ตรวจสถานะเพิกถอนจาก status list พร้อม policy เมื่อดึงไม่ได้", "out": "VC ที่ถูกเพิกถอนถูกปฏิเสธทันทีตอนตรวจ", "comp": "Verification Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Revocation Status Check", "pri": "High", "pts": 8, "dep": "REVOCATION-01, ADAPTER-02", "sprint": 3, "status": "Backlog", "ws": "Verification Service", "phase": "เฟส 2 · 2.1 Issuer core", "scope": "1. ใช้ engine ผ่าน interface กลาง ตรวจสถานะ revocation จาก Bitstring Status List อัตโนมัติ\n2. เรียกผ่าน VCVP Core ตอน verify VP\n3. แยกผล revoked/suspended/active และ cache\n4. กำหนด policy เมื่อดึง status list ไม่ได้ (fail-closed หรือ fail-open) และแจ้งเหตุผลให้ผู้ตรวจทราบ\n5. กำหนดมาตรการสำหรับการดึง status list จาก domain ภายนอกที่เราไม่ได้เป็นเจ้าของ: timeout, จำกัดขนาดข้อมูลที่รับ, ตรวจ certificate ของปลายทาง และกันการเรียกเข้าเครือข่ายภายใน (SSRF) ด้วยกฎที่กำหนด\n6. ตรวจลายเซ็นของ status list ว่าลงนามโดยผู้ออกของ VC ใบนั้นจริง (status list เป็น VC ที่มีลายเซ็นตามมาตรฐาน W3C Bitstring Status List) ถ้าลายเซ็นไม่ผ่านให้ถือว่าดึงสถานะไม่ได้ แล้วทำตาม policy ในข้อ 4", "ac": "1. VC ที่ถูก revoke ในรายการ status list ถูกปฏิเสธ\n2. VC ที่ยัง active ผ่านการตรวจสอบ\n3. แยกผลลัพธ์ระหว่างสถานะ revoked, suspended และ active ได้\n4. VC ที่ status list ชี้ไปยังที่อยู่ภายในเครือข่ายหรือปลายทางที่ไม่อนุญาต ถูกปฏิเสธและบันทึกไว้\n5. เมื่อดึง status list ไม่ได้ ระบบทำตาม policy ที่กำหนดไว้ (fail-closed หรือ fail-open) และแจ้งเหตุผลให้ผู้ตรวจทราบทุกครั้ง\n6. status list ที่ลายเซ็นไม่ถูกต้องหรือไม่ได้ลงนามโดยผู้ออกของ VC ใบนั้น ถูกปฏิเสธและบันทึกไว้", "sx": "งานหลักของระบบ as a verifier developer, i want to ตรวจสอบสถานะของ vc กรณี vc ถูกเพิกถอน จาก bitstring status list ของ issuer อัตโนมัติ, so that ปฏิเสธ vc ที่ถูกเพิกถอนได้"}, "VERIFICATION-03": {"id": "VERIFICATION-03", "what": "ตรวจ holder binding, ช่วงเวลา และบังคับ trust policy", "out": "ผ่านเฉพาะหลักฐานที่ถูกต้องครบทุกเงื่อนไขที่กำหนดไว้", "comp": "Verification Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "VP Validation & Trust Policy", "pri": "Medium", "pts": 8, "dep": "ADAPTER-02, VERIFICATION-02", "sprint": 3, "status": "Backlog", "ws": "Verification Service", "phase": "เฟส 2 · 2.1 Issuer core", "scope": "1. ใช้ engine ผ่าน interface กลาง ตรวจ VP (ลายเซ็น/holder binding/ช่วงเวลา validFrom-validUntil)\n2. บังคับ trust policy (trusted issuers / required claims) ในชั้น VCVP Core\n3. เปิดการตั้งค่า trust policy เป็น API ของ VCVP Core ให้ Verifier Portal เรียกใช้ได้ (VERIFIER-01)\n4. ใน sprint นี้ใช้ trust list จาก config ก่อน ส่วนหน้าจอบริหารจัดการและ endpoint สาธารณะอยู่ที่ TRUST-03 โดยขั้นตอนตรวจต้องอ่าน trust list ผ่านช่องทางเดียวเสมอ ไม่ว่าข้อมูลจะมาจากแหล่งใด\n5. กำหนด policy เมื่อดึง trust list ไม่ได้ (fail-closed หรือ fail-open) และแจ้งเหตุผลให้ผู้ตรวจทราบ พร้อมมาตรการสำหรับการดึงจาก domain ภายนอก: timeout, จำกัดขนาดข้อมูลที่รับ, ตรวจ certificate ของปลายทาง และกันการเรียกเข้าเครือข่ายภายใน (SSRF) แบบเดียวกับที่ VERIFICATION-02 ใช้กับ status list", "ac": "1. ปฏิเสธ VP จาก issuer นอก trust list\n2. ปฏิเสธ VP ที่ขาด required claim ตาม policy\n3. ตรวจ holder binding ยืนยันผู้ยื่นเป็นเจ้าของ VC\n4. เมื่อดึง trust list ไม่ได้ ระบบทำตาม policy ที่กำหนดไว้ และแจ้งเหตุผลให้ผู้ตรวจทราบทุกครั้ง", "sx": "งานหลักของระบบ as a verifier operator, i want to กำหนดนโยบายความน่าเชื่อถือ (trusted issuers / required claims), so that ยอมรับเฉพาะ vp ที่ตรงตามเงื่อนไขทางธุรกิจ"}, "VERIFICATION-01": {"id": "VERIFICATION-01", "what": "คุม session การตรวจ VP และรวบรวมผลจากทุกชั้น", "out": "เปิดจุดตรวจแล้วได้ผลผ่าน/ไม่ผ่านทันทีพร้อมเหตุผล", "comp": "Verification Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Verification Workflow Orchestration", "pri": "Highest", "pts": 13, "dep": "IDENTITY-04, PROTOCOL-02", "sprint": 4, "status": "Backlog", "ws": "Verification Service", "phase": "เฟส 2 · 2.2 VC และ VP ครบวงจร", "scope": "1. รับ proof request ผ่านทางเข้าเดียวกัน ไม่ว่าจะมาจาก Verifier Portal ของเราหรือจากระบบภายนอกที่เรียกผ่าน API แล้วเรียก engine ผ่าน interface กลาง (OpenID4VP) เปิด verification session (sprint นี้เปิดใช้ช่องทาง Portal ก่อน ส่วนการออก API key ให้ระบบภายนอกอยู่ที่ INTEGRATION-01)\n2. สร้าง QR/deeplink และจัดการ nonce/audience\n3. รับ vp_token/ผล verify จาก engine แล้วบันทึก verification record\n4. return ผล verified/failed แบบ real-time\n5. ก่อนเปิด verification session ตรวจว่าผู้ขอตรวจอยู่ในทะเบียน verifier ที่ได้รับการรับรองและยังไม่ถูกถอน ถ้าไม่ผ่านให้ปฏิเสธพร้อมเหตุผล (ใน sprint นี้ใช้รายชื่อจาก config ก่อน ส่วนหน้าจอบริหารจัดการและ endpoint สาธารณะอยู่ที่ TRUST-03)", "ac": "1. เปิด verification session ผ่าน VCVP Core และได้ QR/deeplink\n2. รับผล verified/failed พร้อมเหตุผล และบันทึกประวัติ\n3. กัน replay ผ่าน nonce/audience\n4. ผู้ขอตรวจที่ไม่อยู่ในทะเบียนหรือถูกถอนแล้ว เปิด session ไม่ได้ และได้รับเหตุผลที่ระบุสาเหตุชัดเจน\n5. เปิด session ด้วยข้อมูลชุดเดียวกันจากคนละช่องทาง ได้ผลลัพธ์และ QR ที่ใช้งานได้เหมือนกัน", "sx": "งานหลักของระบบ as a backend engineer, i want to ให้ vcvp core orchestrate การตรวจ vp ผ่าน one-core, so that ผู้ขอตรวจที่ได้รับอนุญาต เปิด session ตรวจสอบได้โดยมี vcvp core จัดการ flow และผลลัพธ์"}, "REVOCATION-01": {"id": "REVOCATION-01", "what": "เปิดใช้ Bitstring Status List และบริหาร index/หลาย list", "out": "VC ทุกใบมีสถานะที่ตรวจสอบได้จากภายนอก", "comp": "Revocation Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Revocation Provider (W3C Bitstring Status List)", "pri": "High", "pts": 5, "dep": "ENGINE-02", "sprint": 2, "status": "Backlog", "ws": "Revocation Service", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. ตั้งค่า revocation ใน one-core โดยเปิด W3C Bitstring Status List และปิดตัวที่ไม่ได้ใช้\n2. orchestrate revoke/suspend ผ่าน VCVP Core (REVOCATION-02)\n3. เผยแพร่ status list และ ทดสอบสถานะ โดย status list เป็นเอกสารรับรองที่ลงนามด้วยกุญแจ assertionMethod ของหน่วยงานผู้ออกเอง (one-core ลงนามให้อัตโนมัติทุกครั้งที่สร้างหรืออัปเดตรายการ) เพื่อให้ผู้ตรวจยืนยันที่มาของรายการได้ (VERIFICATION-02) (ใน sprint นี้ทดสอบผลการตรวจสถานะผ่าน engine โดยตรง ส่วนการตรวจผ่าน VCVP Core แบบครบวงจรพิสูจน์ที่ VERIFICATION-02)\n4. จัดสรร index และบริหารหลาย status list โดยกำหนดขนาดของแต่ละ list ให้ใหญ่พอที่ index ของใบใดใบหนึ่งจะไม่ถูกใช้ระบุตัวตนได้ ไม่ใช่กำหนดจากขนาดไฟล์อย่างเดียว พร้อมรับประกันว่า publish สำเร็จจริง", "ac": "1. ออก VC ใหม่แล้ว VC มีข้อมูลสถานะฝังอยู่ (ชี้ไปยัง status list และตำแหน่งของใบนั้น) และ verifier สามารถตรวจสถานะของ VC ใบนั้นได้\n2. สั่งเพิกถอน (revoke) VC ใบหนึ่ง แล้ว verifier ตรวจ VC ใบนั้นได้ผลเป็น \"ถูกเพิกถอน\" ส่วน VC ใบอื่นยังตรวจได้ผล \"ใช้งานได้\" ตามปกติ\n3. สั่งระงับ (suspend) แล้ว verifier ได้ผล \"ถูกระงับ\" และถ้าปลดระงับ (un-suspend) แล้ว verifier ได้ผลกลับมา \"ใช้งานได้\"\n4. ขนาดของ status list แต่ละชุดเป็นไปตามค่าที่กำหนดไว้ และตรวจสอบได้", "sx": "งานหลักของระบบ as an issuer operator, i want to สั่งระงับ/เพิกถอนใบรับรองผ่าน revocation provider ตาม w3c bitstring status list v1.0, so that vc ที่ถูกเพิกถอนถูกตรวจจับได้ทันที"}, "REVOCATION-02": {"id": "REVOCATION-02", "what": "orchestrate การเพิกถอน/ระงับ/ปลดระงับ พร้อมบันทึกเหตุผล", "out": "สั่งเพิกถอนแล้วมีผลจริงต่อการตรวจสอบทันที", "comp": "Revocation Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Revocation Workflow", "pri": "High", "pts": 8, "dep": "ISSUANCE-02, REVOCATION-01", "sprint": 3, "status": "Backlog", "ws": "Revocation Service", "phase": "เฟส 2 · 2.1 Issuer core", "scope": "1. orchestrate revoke/suspend/unsuspend ผ่าน interface กลางของ engine (Bitstring Status List)\n2. sync สถานะ revocation กับ engine และบันทึก audit พร้อมเหตุผล", "ac": "1. revoke ผ่าน VCVP Core แล้ว engine อัปเดต status list จริง\n2. บันทึกเหตุผลและข้อมูลผู้ดำเนินการทุกครั้ง", "sx": "งานหลักของระบบ as a backend engineer, i want to ให้ vcvp core จัดการ workflow การเพิกถอน, so that สั่ง revoke/suspend ผ่าน one-core ได้อย่างเป็นระบบ"}, "SCHEMA-01": {"id": "SCHEMA-01", "what": "sync credential schema และรองรับ versioning", "out": "Portal ใช้ schema ที่ตรงกันทั้งระบบ โดยแก้ schema ไม่กระทบ VC ที่ออกไปแล้ว", "comp": "Schema Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Schema Sync", "pri": "Medium", "pts": 5, "dep": "ADAPTER-01, IDENTITY-02", "sprint": 1, "status": "Backlog", "ws": "Schema Service", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. sync credential schema ผ่าน interface กลาง (ADAPTER-01) แล้วรวมเป็นทะเบียน schema ของระบบ ส่วน type metadata (vct) เป็นงานมีเงื่อนไข ทำเมื่อเปิดใช้รูปแบบ SD_JWT_VC เพิ่มเท่านั้น เพราะรูปแบบ SD_JWT ที่ใช้จริงไม่มี vct (ดู ENGINE-02)\n2. ออกแบบทะเบียนให้รับ schema จาก adapter ได้หลายตัวโดยไม่ต้องแก้โครงสร้าง เพื่อรองรับหน่วยงานภายนอกในอนาคต (เฟสนี้ยังไม่เชื่อมจริง)\n3. เก็บความสัมพันธ์ระหว่างเวอร์ชันของ schema ว่าเวอร์ชันใดเป็น schema ตัวเดียวกัน (engine เก็บแต่ละเวอร์ชันเป็นคนละก้อน ไม่ได้เก็บความสัมพันธ์นี้ให้)\n4. schema ที่เผยแพร่แล้วต้องเห็นได้ข้ามองค์กร เพื่อให้ verifier ต่างหน่วยงานสร้าง proof request ได้ (ข้อยกเว้นของ IDENTITY-02)\n5. ให้ Portal เลือก/ใช้ schema ได้ (รองรับ versioning)", "ac": "1. ดึง schema ผ่าน interface กลางได้ และ Portal เลือกใช้ได้\n2. schema versioning: แก้ schema ใหม่ไม่กระทบ VC ที่ออกไปแล้ว และดูได้ว่าเวอร์ชันใดเป็น schema ตัวเดียวกัน\n3. verifier ขององค์กรอื่นเห็นและเลือกใช้ schema ที่เผยแพร่แล้วได้\n4. โค้ดของ Schema Service ไม่มีการอ้างถึงชื่อ/โครงสร้างเฉพาะของ engine ตัวใดตัวหนึ่ง (ตรวจได้จาก review)", "sx": "งานหลักของระบบ as a backend engineer, i want to ให้ vcvp core sync schema จาก one-core, so that portal ใช้ schema ที่สอดคล้องกันทั้งระบบ"}, "CONSENT-02": {"id": "CONSENT-02", "what": "รับคำขอถอนความยินยอมและแจ้งผู้รับข้อมูลผ่าน webhook", "out": "คำขอถอนถูกส่งถึงผู้รับข้อมูลและติดตามสถานะได้", "comp": "Consent Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Consent Withdrawal Orchestration & Webhook", "pri": "Medium", "pts": 5, "dep": "VERIFICATION-01", "sprint": 6, "status": "Backlog", "ws": "Consent Service", "phase": "เฟส 3 · 3.1 Final test", "scope": "1. รับคำขอถอนความยินยอมจาก Wallet และ บันทึกอ้างอิง presentation\n2. แจ้ง verifier ปลายทางผ่าน webhook (HMAC) และ retry\n3. track สถานะการดำเนินการ", "ac": "1. รับคำขอถอนและบันทึกได้\n2. ส่ง webhook พร้อมลายเซ็น และ retry เมื่อล้มเหลว\n3. แสดงข้อมูลสถานะและติดตามสถานะการแจ้งได้", "sx": "งานหลักของระบบ as a backend engineer, i want to ให้ vcvp core รับและจัดการคำขอถอนความยินยอม, so that ปฏิบัติตาม pdpa และแจ้ง verifier ได้อัตโนมัติ"}, "CONSENT-01": {"id": "CONSENT-01", "what": "หน้าจอฝั่ง verifier สำหรับรับและตอบรับคำขอถอน", "out": "ผู้รับข้อมูลตอบรับและหยุดใช้ข้อมูลตามคำขอได้", "comp": "Consent Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Consent Withdrawal Management", "pri": "Medium", "pts": 5, "dep": "WALLET-08, VERIFIER-02, INTEGRATION-01", "sprint": 7, "status": "Backlog", "ws": "Consent Service", "phase": "เฟส 3 · 3.2 เตรียมเปิดบริการ", "scope": "1. หน้าจอ ฝั่ง verifier สำหรับ ดูรายการคำขอถอนความยินยอมที่เข้ามา \n2. ดำเนินการ acknowledge ในการ หยุดหรือลบการใช้ข้อมูลตามคำขอ และอัปเดตสถานะกลับ\n3. การรับคำขอและส่ง webhook จัดการที่ VCVP Core (CONSENT-02)", "ac": "1. verifier เห็นรายการคำขอถอนพร้อมรายละเอียด\n2. ดำเนินการ acknowledge ในการ หยุดใช้ข้อมูลตามคำขอ และอัปเดตสถานะได้\n3. สถานะ sync กับ VCVP Core (CONSENT-02)", "sx": "งานหลักของระบบ as a verifier operator, i want to รับและจัดการคำขอถอนความยินยอมจากผู้ถือ, so that ปฏิบัติตามสิทธิ์ pdpa และหยุดใช้ข้อมูลตามที่ผู้ใช้ร้องขอ"}, "KEY-02": {"id": "KEY-02", "what": "ใช้ key reference แทนการดึง raw key ออกมาใช้", "out": "ลงนาม VC ได้โดยไม่ต้องดึง key ออกจากที่เก็บ", "comp": "Key & DID Service", "group": "ความปลอดภัยและการกำกับดูแล (key และ audit log)", "color": "#ba7517", "feature": "Key Storage Provider (Issuer)", "pri": "High", "pts": 5, "dep": "ENGINE-03", "sprint": 0, "status": "Backlog", "ws": "Key & DID Service", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. ตั้งค่า key storage ใน one-core ผ่าน config โดยเปิด INTERNAL (encrypted DB) สำหรับ dev/POC และ production ใช้ KMS ที่พัฒนาเพิ่ม (AWS/GCP ดู KEY-03) และปิดตัวที่ไม่ได้ใช้\n2. ใช้ key reference แทน raw key (private key ไม่ออกนอก storage)\n3. เปิดการใช้งาน key ผ่าน key reference เป็น API ของ VCVP Core (การ rotate key ดู KEY-04)", "ac": "1. private key เข้ารหัส at-rest (INTERNAL) หรืออยู่ใน KMS โดยไม่ออกนอก และไม่ถูก log\n2. ลงนาม VC อ้างอิงผ่าน key reference ไม่ดึง raw key ออกนอกระบบ\n3. สลับ key storage backend ผ่าน config ได้โดยไม่แก้โค้ด", "sx": "ความปลอดภัยและการกำกับดูแล as a security engineer, i want to จัดเก็บกุญแจของผู้ออกใบรับรองอย่างปลอดภัยผ่าน key storage provider, so that private key ไม่รั่วไหลและรองรับการ rotate"}, "KEY-01": {"id": "KEY-01", "what": "เปิดใช้ did:key / did:web / did:jwk และตั้ง resolver", "out": "สร้างและ resolve DID ขององค์กรได้", "comp": "Key & DID Service", "group": "ความปลอดภัยและการกำกับดูแล (key และ audit log)", "color": "#ba7517", "feature": "DID Method Provider", "pri": "Highest", "pts": 5, "dep": "PLATFORM-02, EDGE-01, ENGINE-01", "sprint": 1, "status": "Backlog", "ws": "Key & DID Service", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. ตั้งค่า DID method ใน one-core ผ่าน config (ENGINE-01) โดยเปิด did:key/web/jwk และปิดตัวที่ไม่ได้ใช้\n2. ตั้งค่า DID resolver และผูกกับ did:web hosting (EDGE-01)\n3. integrate ให้เรียก/ใช้งานผ่าน PostMan\n4. ทดสอบสร้างและ resolve DID ครบทุก method ที่เปิดใช้", "ac": "1. สร้าง DID ครบ 3 method ผ่าน one-core และ resolve ได้ถูกต้อง\n2. did:web ดึงจาก /.well-known/did.json สำเร็จ\n3. ทดสอบผ่าน Postman (dev) และสร้าง/resolve DID ผ่าน API ของ VCVP Core ได้ (integration)", "sx": "ความปลอดภัยและการกำกับดูแล as a system architect, i want to เปิดใช้งาน did method provider สำหรับ did:key, did:web และ did:jwk, so that ระบบสร้างและ resolve did ได้ตามบริบทการใช้งานที่แตกต่างกัน"}, "KEY-03": {"id": "KEY-03", "what": "พัฒนา provider เก็บ key ใน KMS/HSM", "out": "key ของหน่วยงานไม่ออกนอก KMS ตลอดอายุการใช้งาน", "comp": "Key & DID Service", "group": "ความปลอดภัยและการกำกับดูแล (key และ audit log)", "color": "#ba7517", "feature": "Custom KMS Key Storage Provider (AWS / GCP)", "pri": "High", "pts": 13, "dep": "PLATFORM-02, KEY-02, ENGINE-04", "sprint": 1, "status": "Backlog", "ws": "Key & DID Service", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. ศึกษา keyStorage provider interface ของ one-core (มี INTERNAL/Azure Key Vault/Secure Enclave และ pkcs11 ยังเป็น stub ยังไม่มี AWS/GCP)\n2. เลือกแนวทาง \n A) INTERNAL+KEK จาก AWS/GCP Secret Manager (ENGINE-01)\n B) Fork เขียน provider ใหม่ตาม azure_vault pattern \n C) complete PKCS#11 stub + libkmsp11(GCP)/libcloudhsm_pkcs11\n D) AWS CloudHSM+PKCS#11 (FIPS 140-2 L3, government-grade)\n3. implement provider ที่เลือกใน one-core (Rust) โดย generate/sign ผ่าน KMS/HSM โดย private key ไม่ออกนอก KMS/HSM\n4. เพิ่ม config เปิดใช้ (ENGINE-01)  ทดสอบ (การจัดการ fork ดู ENGINE-04)\nหมายเหตุ: ที่เก็บกุญแจต้องกำหนดได้รายองค์กร โดยรองรับ 3 แนวทางคู่ขนาน (1) กุญแจอยู่ใน KMS ของเรา (2) กุญแจอยู่ใน KMS ของหน่วยงานเอง โดยหน่วยงานให้สิทธิ์ระบบเราเรียกใช้และตัดสิทธิ์ได้เอง (BYOK) (3) หน่วยงานรัน signing service เอง แล้วเราเรียกไปเซ็นตามมาตรฐาน remote signing (CSC API v2.0 / ETSI TS 119 432) โดยแนวทาง (3) ต้องประเมินว่าจะแยกเป็น story ต่างหากหรือไม่ ดู IDENTITY-02", "ac": "1. one-core รองรับ keyStorage แบบ KMS (AWS หรือ GCP) และเลือกผ่าน config ได้\n2. generate/sign ผ่าน KMS สำเร็จโดย private key ไม่ออกนอก KMS\n3. issue/verify VC ด้วยกุญแจจาก KMS ได้แบบ end-to-end\n\nหมายเหตุ: A/B/C/D คือแนวทาง implement ตามที่ระบุไว้ในขอบเขตงานข้อ 2 (A = INTERNAL + KEK จาก Secret Manager, B = เขียน provider ใหม่ตาม azure_vault pattern, C = เติม PKCS#11 stub ให้สมบูรณ์, D = CloudHSM + PKCS#11) ซึ่งเป็นคนละเรื่องกับ 3 แนวทางการถือครองกุญแจในหมายเหตุท้ายขอบเขตงาน AC ทั้งหมดวัดที่เป้าหมาย key-in-KMS (แนวทาง B/C/D) แนวทาง A เป็น Pilot fallback (= ENGINE-01) ยังไม่เข้าเกณฑ์เหล่านี้\n\nกรณีเลือกแนวทาง A (Pilot): ตาม ENGINE-01 (KEK ใน Secret Manager, ไม่ hardcode, rotate ได้) + issue/verify VC บน INTERNAL ได้แบบ end-to-end", "sx": "ความปลอดภัยและการกำกับดูแล as a backend/rust engineer, i want to พัฒนา keystorage provider ใหม่ใน one-core ให้เชื่อมต่อ aws kms หรือ google cloud kms, so that เก็บ/ใช้กุญแจบน kms ระดับ production แทน internal (encrypted db) ที่ใช้ใน poc"}, "KEY-04": {"id": "KEY-04", "what": "rotate key และเก็บ key เก่าไว้สำหรับ verify เท่านั้น", "out": "เปลี่ยน key ได้โดย VC ที่ออกไปแล้วยังตรวจผ่าน", "comp": "Key & DID Service", "group": "ความปลอดภัยและการกำกับดูแล (key และ audit log)", "color": "#ba7517", "feature": "Key Rotation & DID Lifecycle Management", "pri": "Medium", "pts": 8, "dep": "KEY-01, KEY-02", "sprint": 5, "status": "Backlog", "ws": "Key & DID Service", "phase": "เฟส 2 · 2.3 ตรวจผ่าน Trust Registry", "scope": "1. implement กระบวนการ rotate signing key เอง สร้าง key ใหม่ + เก็บ key เก่าไว้ verify-only ใน DID document + วางแผน re-issue VC\n2. ใช้ did:webvh prerotation ระดับ DID และ อัปเดต/deactivate DID\n3. orchestrate ผ่าน VCVP Core และรักษา key versioning ให้ VC เดิมยัง verify ได้\n4. บันทึกประวัติการ rotate/อัปเดต DID\nหมายเหตุ: one-core ไม่มีกระบวนการ rotate key ในตัว งานนี้จึงต้องพัฒนาเพิ่มทั้งหมด ถ้าเปลี่ยนไปใช้ engine ที่มีให้แล้ว ขอบเขตงานนี้จะเปลี่ยน", "ac": "1. rotate signing key แล้วเก็บ key เก่าเป็น verify-only ใน DID document เพื่อให้ VC เก่ายัง verify ผ่าน, VC ใหม่ใช้ key ใหม่\n2. ปิดใช้งาน (deactivate) กุญแจเก่า/DID ได้ และรองรับ did:webvh prerotation\n3. มีประวัติของการ rotate และอัปเดต DID", "sx": "ความปลอดภัยและการกำกับดูแล as a security engineer, i want to หมุนเวียนกุญแจและอัปเดต/ปิดใช้งาน did ตามวงจรชีวิต, so that ลดความเสี่ยงกุญแจรั่วไหลและคงความน่าเชื่อถือระยะยาว"}, "AUDIT-01": {"id": "AUDIT-01", "what": "รวม audit log ที่ VCVP Core พร้อมหน้าค้นหาและ export", "out": "ค้นหาและออกรายงาน compliance ได้จากที่เดียว", "comp": "Audit & Compliance Service", "group": "ความปลอดภัยและการกำกับดูแล (key และ audit log)", "color": "#ba7517", "feature": "Audit Log & Compliance Reporting", "pri": "High", "pts": 8, "dep": "ISSUANCE-01, IDENTITY-03", "sprint": 4, "status": "Backlog", "ws": "Audit & Compliance Service", "phase": "เฟส 2 · 2.2 VC และ VP ครบวงจร", "scope": "1. รวม audit log แบบ append-only ที่ชั้น VCVP Core ครอบคลุม key/sign operation events (issue/sign/revoke/verify) ที่ engine ไม่ได้ log เอง และ event อื่นจาก VCVP Core\n2. หน้าจอสำหรับค้นหา/กรอง และ export รายงาน compliance (PDPA/ETDA)", "ac": "1. ทุก action สำคัญรวมถึงการ sign/ใช้กุญแจ ถูกบันทึกและแก้ไขย้อนหลังไม่ได้ (immutable)\n2. ค้นหา log ตาม actor/tenant/ประเภท/ช่วงเวลาได้\n3. Export รายงาน compliance ตามรูปแบบที่กำหนด", "sx": "ความปลอดภัยและการกำกับดูแล as an auditor, i want to เข้าถึง audit log แบบ append-only และออกรายงาน compliance, so that ตรวจสอบการดำเนินงานตาม pdpa/etda ได้"}, "AUDIT-02": {"id": "AUDIT-02", "what": "ทำ hash-chain, WORM, จำกัดสิทธิ์เข้าถึง และ retention ของ log", "out": "log ใช้เป็นหลักฐานได้จริง เพราะแก้ย้อนหลังแล้วตรวจจับได้", "comp": "Audit & Compliance Service", "group": "ความปลอดภัยและการกำกับดูแล (key และ audit log)", "color": "#ba7517", "feature": "Audit Log Security & Retention (ISO 27001)", "pri": "High", "pts": 5, "dep": "AUDIT-01", "sprint": 4, "status": "Backlog", "ws": "Audit & Compliance Service", "phase": "เฟส 2 · 2.2 VC และ VP ครบวงจร", "scope": "1. Hash-chain ของ log entry (แต่ละรายการผูก hash ของรายการก่อนหน้า) เพื่อ tamper-evidence ตรวจจับการแก้ไขได้\n2. จัดเก็บแบบ WORM / append-only (เขียนครั้งเดียว แก้/ลบไม่ได้)\n3. จำกัดการเข้าถึง audit log เฉพาะ role Auditor ผ่าน RBAC โดย Auditor เข้าถึงได้อย่างเดียว ทำรายการเปลี่ยนแปลงข้อมูลไม่ได้ (IDENTITY-03) และบันทึกการเข้าถึง log เอง\n4. Retention policy: เก็บ log ตามระยะที่กำหนด (ETDA/PDPA) + archive/purge อัตโนมัติเมื่อครบกำหนด", "ac": "1. แก้ไข/ลบ log entry แล้วตรวจจับได้ (hash-chain เสีย) และเขียนทับ/แก้ไม่ได้ (WORM)\n2. เฉพาะ role Auditor เข้าถึง audit log ได้ และการเข้าถึงถูกบันทึก\n3. log ถูกเก็บครบตาม retention ที่กำหนด และ archive/purge เมื่อครบกำหนด", "sx": "ความปลอดภัยและการกำกับดูแล as a security/compliance officer, i want to ให้ audit log ปลอดภัยและเชื่อถือได้ตาม iso 27001 (กันแก้ไข จำกัดการเข้าถึง เก็บตามกำหนด), so that ใช้เป็นหลักฐานและสามารถตรวจสอบย้อนหลังได้จริง"}, "AUDIT-03": {"id": "AUDIT-03", "what": "กำหนด retention ของข้อมูลธุรกิจ และรองรับสิทธิเจ้าของข้อมูล", "out": "ข้อมูลส่วนบุคคลถูกลบตามกำหนด และตอบคำขอใช้สิทธิได้", "comp": "Audit & Compliance Service", "group": "ความปลอดภัยและการกำกับดูแล (key และ audit log)", "color": "#ba7517", "feature": "Data Retention & Data Subject Rights (PDPA)", "pri": "High", "pts": 5, "dep": "IDENTITY-04, CONSENT-01, WALLET-06", "sprint": 7, "status": "Backlog", "ws": "Audit & Compliance Service", "phase": "เฟส 3 · 3.2 เตรียมเปิดบริการ", "scope": "1. กำหนด retention ของข้อมูลธุรกิจ (issuance/verification record, claim ที่ถูกเปิดเผย) แยกตามประเภทข้อมูล\n2. ลบหรือทำให้ไม่ระบุตัวตน (anonymize) อัตโนมัติเมื่อครบกำหนด\n3. รองรับสิทธิเจ้าของข้อมูล: ขอเข้าถึง ขอสำเนา และขอลบ ตาม PDPA\n4. เก็บ claim เท่าที่จำเป็นตามที่ประกาศไว้ใน proof request (data minimization)\n5. กำหนดนโยบายของประวัติการเปิดเผยข้อมูลของผู้ถือที่เก็บไว้ที่ส่วนกลาง (WALLET-06) ว่าเก็บนานเท่าไร ใครในองค์กรเข้าถึงได้ และผู้ถือขอลบได้แค่ไหน", "ac": "1. ข้อมูลที่ครบกำหนดถูกลบ/anonymize อัตโนมัติและตรวจสอบได้\n2. ตอบคำขอใช้สิทธิของเจ้าของข้อมูลได้ภายในเวลาที่กำหนด\n3. ไม่มีการเก็บ claim เกินกว่าที่ประกาศไว้ใน proof request\n4. ประวัติการเปิดเผยข้อมูลของผู้ถือมีนโยบาย retention และการจำกัดสิทธิ์เข้าถึงที่บันทึกไว้ และบังคับใช้ได้จริง", "sx": "ความปลอดภัยและการกำกับดูแล as a data protection officer, i want to ให้ข้อมูลส่วนบุคคลในระบบถูกเก็บเท่าที่จำเป็นและใช้สิทธิได้ตาม pdpa, so that ระบบเป็นไปตามกฎหมายคุ้มครองข้อมูลส่วนบุคคล"}, "WALLET-01": {"id": "WALLET-01", "what": "เก็บ key ในพื้นที่ปลอดภัยของอุปกรณ์ (secure enclave/keystore)", "out": "key ของผู้ถืออยู่ในเครื่องอย่างปลอดภัย ดึงออกไม่ได้", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Key Storage Provider (Wallet / Encrypted DB)", "pri": "Highest", "pts": 8, "dep": "ENGINE-03, KEY-01", "sprint": 2, "status": "Backlog", "ws": "Wallet App", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. เก็บ private key ใน secure hardware ของอุปกรณ์ (iOS Secure Enclave / Android Keystore) และเก็บ VC ใน encrypted DB บนอุปกรณ์ โดยการเข้ารหัสฐานข้อมูลไม่ได้มาพร้อม SDK ต้องทำเพิ่มเองตาม WALLET-09\n2. เข้ารหัสด้วยกุญแจที่ผูกกับ device unlock โดยการบังคับยืนยันตัวตนต้องทำที่ระดับชิปตาม WALLET-10 เพราะ SDK ที่ได้มาไม่ได้ตั้งเงื่อนไขนี้ให้\n3. ตัดสินแล้วว่าใช้ SDK ของ engine เป็นวิธี implement ความสามารถฝั่งอุปกรณ์ งานที่เหลือคือบันทึกเหตุผลและข้อจำกัดที่พบให้ครบ ครอบคลุมความสามารถ (key storage, SD-JWT, OpenID4VCI/VP client, การ resolve DID ของผู้ออกเพื่อตรวจลายเซ็น โดยฝั่งผู้ถือไม่ต้องสร้าง DID ของตัวเอง) โดยผลลัพธ์ต้องผ่าน conformance ที่กำหนดไว้ และต้องระบุเงื่อนไขที่จะทำให้ต้องกลับมาทบทวนการเลือกนี้\n4. เกณฑ์ที่ใช้ประกอบการตัดสินและต้องบันทึกไว้ใน ADR: มาตรฐานที่รองรับครบไหม (SD_JWT, เวอร์ชัน OpenID4VCI/VP ที่ตรงกับ PROTOCOL-01/02, status list, DID method ตาม KEY-01), รองรับ mDoc/ISO 18013-5 ในอนาคตไหม (ENGINE-05), รองรับทั้ง iOS และ Android ไหม, ใบอนุญาตและข้อผูกพัน, ภาระดูแลระยะยาวและการแก้ช่องโหว่, ต้นทุนการเปลี่ยนถ้าต้องเปลี่ยนภายหลัง, รองรับการแยกกุญแจของผู้ถือต่อผู้ตรวจแต่ละราย (เช่น ออก VC เป็นชุดหลายใบ ใบละกุญแจ) เพื่อกันการเชื่อมโยงตัวตนข้ามผู้ตรวจ ได้แค่ไหน (ตัดสินแล้วว่าไม่แยก ใช้กุญแจดอกเดียวซ้ำทุกผู้ตรวจ บันทึกไว้เพื่อให้ทบทวนได้ถ้าข้อกำหนดเรื่องการเชื่อมโยงตัวตนเปลี่ยน)\n5. เรียกใช้ความสามารถฝั่งอุปกรณ์ผ่าน interface ของเราเอง (wallet adapter) เพื่อให้เปลี่ยนวิธี implement ภายหลังได้โดยไม่ต้องรื้อทั้งแอป\n6. บันทึกผลการเลือกพร้อมเหตุผลและเงื่อนไขที่จะต้องกลับมาทบทวน เป็นเอกสารการตัดสินใจเชิงสถาปัตยกรรม (ADR)", "ac": "1. VC และ key ถูกเข้ารหัสขณะจัดเก็บ และถอดได้เมื่อปลดล็อกเท่านั้น\n2. ข้อมูลไม่สามารถอ่านได้หากเข้าถึงไฟล์ฐานข้อมูลโดยตรง\n3. ผ่านการทดสอบบนอุปกรณ์จริง (Android Keystore/iOS Keychain)\n4. มีเอกสารการตัดสินใจเชิงสถาปัตยกรรม (ADR) ที่ระบุเกณฑ์ เหตุผลที่เลือก SDK ของ engine เหตุผลที่ไม่แยกกุญแจต่อผู้ตรวจ และเงื่อนไขที่ต้องกลับมาทบทวน ครบทุกข้อ\n5. โค้ด UI และ business logic ของ Wallet ไม่เรียก API ของ library ภายนอกโดยตรง เรียกผ่าน wallet adapter เท่านั้น (ตรวจได้จาก review/test)", "sx": "แอปและหน้าจอผู้ใช้ as a wallet user, i want to ให้ private key และ vc ถูกจัดเก็บอย่างปลอดภัยในกระเป๋าดิจิทัล, so that ข้อมูลของฉันปลอดภัยแม้อุปกรณ์สูญหาย"}, "WALLET-02": {"id": "WALLET-02", "what": "สร้าง/กู้คืน wallet และล็อกด้วย PIN หรือ biometric", "out": "เปิดใช้ wallet ได้เอง และคนอื่นเปิดดูไม่ได้", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Wallet Onboarding, PIN & Biometric Lock", "pri": "High", "pts": 8, "dep": "WALLET-01", "sprint": 2, "status": "Backlog", "ws": "Wallet App", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. Wallet onboarding: สร้าง/กู้คืนกระเป๋า, ตั้ง PIN หรือ เปิด biometric (Face/Touch)\n2. การเข้าถึง wallet ต้องยืนยันด้วย PIN หรือ biometric ที่ตั้งไว้ในแอปทุกครั้งก่อนเข้าถึง VC/กุญแจ และแอป re-lock เองเมื่อปิดหรือพักไว้เกินเวลาที่กำหนด (เป็นการล็อกระดับแอปของเราเอง ไม่ขึ้นกับการล็อกหน้าจอของมือถือ และไม่ใช่การบังคับที่ระดับชิป ซึ่งอยู่ที่ WALLET-10) พร้อมจำกัดจำนวนครั้งที่กรอก PIN ผิดและหน่วงเวลาเมื่อผิดซ้ำ เพื่อกันการเดา PIN\n3. ออกแบบหน้าจอแอปให้ผ่านเกณฑ์ WCAG 2.1 AA ตั้งแต่หน้าจอแรก: ขนาดตัวอักษรปรับตามค่าระบบของเครื่อง ความต่างของสีผ่านเกณฑ์ ปุ่มมีขนาดกดง่าย และรองรับโปรแกรมอ่านหน้าจอ (VoiceOver / TalkBack)", "ac": "1. ตั้ง PIN และเปิดใช้ biometric ได้ในขั้นตอน onboarding\n2. แอปล็อกอัตโนมัติและต้องปลดล็อกก่อนเข้าถึง VC\n3. ป้องกัน brute-force PIN (จำกัดจำนวนครั้ง/หน่วงเวลา)\n4. หน้าจอ onboarding ใช้งานได้ด้วยโปรแกรมอ่านหน้าจอ และผ่านเกณฑ์ contrast ของ WCAG 2.1 AA", "sx": "แอปและหน้าจอผู้ใช้ as a wallet user, i want to ตั้งค่าเริ่มต้นกระเป๋าและล็อกด้วย pin/ไบโอเมตริก, so that เฉพาะฉันเท่านั้นที่เปิดใช้กระเป๋าและเข้าถึง vc ได้"}, "WALLET-03": {"id": "WALLET-03", "what": "หน้าจอเลือก claim ที่จะเปิดเผยตามที่ verifier ร้องขอ", "out": "ผู้ถือเปิดเผยเฉพาะข้อมูลที่จำเป็นเท่านั้น", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Selective Disclosure (SD_JWT)", "pri": "High", "pts": 5, "dep": "ENGINE-02, ENGINE-03, WALLET-01, EDGE-03, ADAPTER-02", "sprint": 2, "status": "Backlog", "ws": "Wallet App", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. ใช้ selective disclosure ของ SD_JWT บน wallet ผ่าน wallet adapter (WALLET-01)\n2. UI ให้ผู้ใช้เลือก claim ที่จะเปิดเผยตามรายการที่ verifier ขอมาในคำขอตรวจ\n3. ยื่น VP ไปที่ endpoint OpenID4VP บน domain ของเรา (PROTOCOL-02 / EDGE-03)", "ac": "1. ผู้ใช้สามารถเลือกเปิดเผยเฉพาะ claim ที่ต้องการก่อนยื่น VP ได้\n2. ตรวจ VP ที่ wallet สร้าง ด้วยคำสั่ง verify ของ VCVP Core (ADAPTER-02) แล้วผ่าน โดยไม่เห็น claim ที่ไม่เปิดเผย (การยื่นผ่าน flow OpenID4VP เต็มรูปแบบพิสูจน์ที่ PROTOCOL-02)\n3. ตรวจสอบ claim payload ต้องมีเฉพาะ รายการที่เลือกแชร์เท่านั้น", "sx": "แอปและหน้าจอผู้ใช้ as a wallet user, i want to เลือกเปิดเผยเฉพาะข้อมูลบางส่วนใน vc, so that ปกป้องความเป็นส่วนตัวตามหลัก data minimization และ pdpa"}, "WALLET-09": {"id": "WALLET-09", "what": "เข้ารหัสไฟล์ฐานข้อมูลในเครื่องแบบสองชั้น โดยกุญแจหลักอยู่ใน secure hardware", "out": "ผู้ที่เข้าถึงไฟล์ได้โดยตรงอ่านข้อมูลของผู้ถือไม่ได้", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "On-Device Database Encryption (Envelope)", "pri": "Highest", "pts": 13, "dep": "WALLET-01", "sprint": 4, "status": "Backlog", "ws": "Wallet App", "phase": "เฟส 2 · 2.2 VC และ VP ครบวงจร", "scope": "1. เข้ารหัสไฟล์ฐานข้อมูลของกระเป๋าแบบ envelope encryption คือให้กุญแจหลัก (KEK) อยู่ใน secure hardware ของเครื่อง แล้วใช้ปกป้องกุญแจข้อมูล (DEK) ที่เก็บบนดิสก์ ซึ่งใช้เข้ารหัสไฟล์จริงอีกชั้น\n2. ต้องทำสองชั้นเพราะ secure hardware เข้ารหัสข้อมูลก้อนใหญ่โดยตรงไม่ได้และช้าเกินใช้งาน\n3. ประเมินและเลือกวิธี implement ระหว่างการต่อชั้นเข้ารหัสเข้ากับที่เก็บของ SDK กับการเปลี่ยนไปใช้ที่เก็บของเราเอง แล้วบันทึกเป็น ADR\n4. รองรับการเปลี่ยนกุญแจและการกู้คืนเมื่อผู้ใช้เปลี่ยนวิธีปลดล็อกเครื่อง โดยข้อมูลเดิมต้องยังอ่านได้\n5. ตั้งระดับการปกป้องไฟล์ให้อ่านไม่ได้ขณะจอล็อก ไม่ใช่แค่หลังบูตเครื่องครั้งแรก", "ac": "1. เปิดไฟล์ฐานข้อมูลจากนอกแอปแล้วอ่านเนื้อหาไม่ได้ ทดสอบบนอุปกรณ์จริงทั้ง iOS และ Android\n2. กุญแจหลักอยู่ใน secure hardware และดึงออกมาเป็นค่าดิบไม่ได้\n3. ผ่านเกณฑ์ OWASP MASVS-STORAGE ระดับ L2 พร้อมหลักฐานการตรวจ\n4. เปลี่ยนวิธีปลดล็อกเครื่องแล้วข้อมูลเดิมยังเปิดอ่านได้\n5. มี ADR ระบุทางเลือกที่ประเมิน เหตุผลที่เลือก และเงื่อนไขที่ต้องกลับมาทบทวน", "sx": "แอปและหน้าจอผู้ใช้ as a wallet user, i want to ให้ไฟล์ฐานข้อมูลที่เก็บ vc ในเครื่องถูกเข้ารหัส, so that ผู้ที่เข้าถึงไฟล์ได้โดยตรงอ่านข้อมูลของฉันไม่ได้"}, "WALLET-07": {"id": "WALLET-07", "what": "รับ VC เข้ากระเป๋าจาก QR / deeplink / offer ที่ขอไว้", "out": "ผู้ถือได้ VC เข้ากระเป๋าครบทุกช่องทางด้วยขั้นตอนเดียวกัน", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Credential Receipt (QR / Deeplink / Offer)", "pri": "Highest", "pts": 8, "dep": "WALLET-02, PROTOCOL-01, TRUST-01", "sprint": 5, "status": "Backlog", "ws": "Wallet App", "phase": "เฟส 2 · 2.3 ตรวจผ่าน Trust Registry", "scope": "1. รองรับทางเข้าของ offer ครบ 3 ทาง: สแกน QR จากเจ้าหน้าที่, เปิดผ่าน deeplink, และ offer ที่ได้กลับจากคำขอ self-service (WALLET-05)\n2. แสดงให้ผู้ถือเห็นก่อนตัดสินใจว่าใครเป็นผู้ออก จะได้ใบอะไร และมี claim อะไรบ้าง แล้วจึงกดยอมรับหรือปฏิเสธ\n3. รับ VC ตาม flow OpenID4VCI (PROTOCOL-01) พร้อมพิสูจน์การถือครองกุญแจ จากนั้นตรวจลายเซ็นของผู้ออกบน VC และตรวจว่าผู้ออกอยู่ในทะเบียนหน่วยงานที่เชื่อถือได้ (TRUST-01) ก่อนเก็บลงกระเป๋า (WALLET-01) ถ้าไม่ผ่านให้ปฏิเสธพร้อมแจ้งเหตุผลที่ผู้ใช้เข้าใจได้\n4. จัดการกรณีผิดพลาด: offer หมดอายุ ถูกใช้ไปแล้ว หรือรับไม่สำเร็จ โดยแจ้งเหตุผลที่ผู้ใช้เข้าใจได้", "ac": "1. รับ VC สำเร็จครบทั้ง 3 ทางเข้า และเห็นใบใหม่ในรายการ (WALLET-04)\n2. ผู้ถือเห็นผู้ออกและรายการ claim ก่อนกดยอมรับ และกดปฏิเสธได้โดยไม่มี VC เข้ากระเป๋า\n3. offer ที่หมดอายุหรือถูกใช้ไปแล้ว ระบบแจ้งเหตุผลชัดเจน ไม่ค้างและไม่ล้ม\n4. VC ที่ลายเซ็นไม่ถูกต้อง หรือผู้ออกไม่อยู่ในทะเบียนที่เชื่อถือได้ จะไม่ถูกเก็บลงกระเป๋า และแจ้งเหตุผลให้ผู้ถือทราบ", "sx": "แอปและหน้าจอผู้ใช้ as a wallet user, i want to รับ vc เข้ากระเป๋าจาก offer ที่ได้มา ไม่ว่าจะมาจากการสแกน qr การเปิด deeplink หรือคำขอที่ยื่นไว้เอง, so that ได้ใบรับรองเข้ากระเป๋าครบทุกช่องทางด้วยขั้นตอนเดียวกัน"}, "WALLET-10": {"id": "WALLET-10", "what": "ตั้งเงื่อนไขให้ชิปบังคับยืนยันตัวตนก่อนใช้กุญแจเซ็นทุกครั้ง", "out": "มัลแวร์ที่เข้าถึงแอปได้ก็สั่งเซ็นแทนเจ้าของไม่ได้", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Hardware-Enforced User Authentication for Key Use", "pri": "Highest", "pts": 8, "dep": "WALLET-01, ENGINE-04", "sprint": 5, "status": "Backlog", "ws": "Wallet App", "phase": "เฟส 2 · 2.3 ตรวจผ่าน Trust Registry", "scope": "1. ตั้งเงื่อนไขบังคับยืนยันตัวตนตอนสร้างกุญแจ ให้ชิปเป็นผู้บังคับ ไม่ใช่แอปเป็นผู้บังคับ (Android setUserAuthenticationRequired / iOS .userPresence หรือ .biometryAny)\n2. ต้องแก้ไฟล์ของ engine ฝั่งอุปกรณ์ (SecureEnclaveKeyStorage / AndroidKeyStoreKeyStorage) จึงต้องดูแลเป็น patch ของเราเองตามแนวทางใน ENGINE-04\n3. กำหนดขอบเขตว่าการกระทำใดต้องยืนยันตัวตนซ้ำ (การเซ็น VP, การส่งออกข้อมูล, การลบบัตร) และการกระทำใดไม่ต้อง\n4. รองรับกรณีผู้ใช้ยังไม่ได้ตั้ง biometric หรือ PIN ในเครื่อง โดยต้องแจ้งเหตุผลและไม่ปล่อยให้ใช้งานแบบไม่มีการป้องกัน\n5. งานนี้เป็นการปิดช่องว่างที่ WALLET-01 และ WALLET-02 ระบุไว้ว่าต้องยืนยันตัวตนก่อนเข้าถึงกุญแจ ซึ่งไลบรารีที่ได้มาไม่ได้บังคับให้", "ac": "1. หลังปลดล็อกเครื่องแล้ว การสั่งเซ็นยังต้องผ่านการยืนยันตัวตนอีกครั้ง ทดสอบบนอุปกรณ์จริงทั้งสองระบบ\n2. การยืนยันถูกบังคับที่ระดับชิป ยืนยันได้จากการที่ปิดโค้ดฝั่งแอปแล้วยังบังคับอยู่\n3. มีตารางระบุการกระทำที่ต้องยืนยันซ้ำและที่ไม่ต้อง ผ่านการทบทวนร่วมกับฝ่ายความมั่นคงปลอดภัย\n4. patch ที่แก้ไฟล์ของ engine ถูกบันทึกในทะเบียน patch ตาม ENGINE-04 และ rebase ผ่าน\n5. ถ้อยคำใน WALLET-01 และ WALLET-02 ตรงกับพฤติกรรมจริงของระบบแล้ว", "sx": "แอปและหน้าจอผู้ใช้ as a wallet user, i want to ให้เครื่องบังคับยืนยันตัวตนทุกครั้งก่อนใช้กุญแจของฉันเซ็น, so that มัลแวร์ที่เข้าถึงแอปได้ก็สั่งเซ็นแทนฉันไม่ได้"}, "WALLET-12": {"id": "WALLET-12", "what": "เปิดให้ตั้งค่า HTTP client ได้เองและทำ certificate pinning กับปลายทางของเรา", "out": "ตรวจสอบและควบคุมการรับส่งข้อมูลของแอปได้ตามเกณฑ์ความมั่นคงปลอดภัย", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Network Trust Control (HTTP Client & Certificate Pinning)", "pri": "High", "pts": 8, "dep": "WALLET-01, ENGINE-04", "sprint": 5, "status": "Backlog", "ws": "Wallet App", "phase": "เฟส 2 · 2.3 ตรวจผ่าน Trust Registry", "scope": "1. ปัจจุบันไลบรารีฝั่งอุปกรณ์เป็นเจ้าของ HTTP client เองและไม่มีจุดให้เสียบค่าตั้งจากภายนอก ทำให้ทำ certificate pinning หรือบังคับ proxy เพื่อตรวจสอบไม่ได้\n2. เพิ่มจุดเสียบให้ตั้งค่า HTTP client จากภายนอกได้ โดยแก้ไฟล์ของ engine ฝั่งอุปกรณ์ และดูแลเป็น patch ของเราเองตามแนวทางใน ENGINE-04\n3. ทำ certificate pinning กับปลายทางของเราทุกเส้น พร้อมกำหนดวิธีหมุนใบรับรองโดยไม่ทำให้แอปที่ติดตั้งไปแล้วใช้งานไม่ได้\n4. เปิดให้บังคับ proxy ได้เฉพาะรุ่นสำหรับทดสอบ เพื่อใช้ตรวจสอบความมั่นคงปลอดภัยของการรับส่งข้อมูล และต้องปิดในรุ่นที่เผยแพร่จริง", "ac": "1. ตั้งค่า HTTP client จากภายนอกไลบรารีได้จริง\n2. การเชื่อมต่อไปปลายทางที่ใบรับรองไม่ตรงกับที่ปักไว้ถูกปฏิเสธ ทดสอบด้วย proxy ดักกลาง\n3. มีขั้นตอนหมุนใบรับรองที่ไม่ทำให้แอปรุ่นเดิมใช้งานไม่ได้ พร้อมทดสอบยืนยัน\n4. รุ่นที่เผยแพร่จริงบังคับ proxy ไม่ได้ ตรวจได้จากการทดสอบ\n5. patch ถูกบันทึกในทะเบียน patch ตาม ENGINE-04 และ rebase ผ่าน", "sx": "แอปและหน้าจอผู้ใช้ as a security engineer, i want to ควบคุมการเชื่อมต่อเครือข่ายของกระเป๋าได้เอง, so that ทำ certificate pinning และตรวจสอบการรับส่งข้อมูลได้ตามเกณฑ์ความมั่นคงปลอดภัย"}, "WALLET-04": {"id": "WALLET-04", "what": "แสดงรายการ VC พร้อมสถานะและแจ้งเตือน", "out": "ผู้ถือเห็น VC ทั้งหมด และรู้ว่าใบไหนหมดอายุหรือถูกเพิกถอน", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Credential List & Status UI", "pri": "Medium", "pts": 5, "dep": "WALLET-01", "sprint": 7, "status": "Backlog", "ws": "Wallet App", "phase": "เฟส 3 · 3.2 เตรียมเปิดบริการ", "scope": "1. แสดงรายการ VC ในกระเป๋า และเปิดดูรายละเอียดของแต่ละใบ โดยผู้ถือแก้ไขเนื้อหา VC ไม่ได้ (ถูกลงนามไว้ตั้งแต่ตอนออก) และลบ VC เองไม่ได้\n2. แสดงสถานะ (active/revoked/expired) โดยตรวจการเพิกถอนจาก status list ที่ระบุอยู่ในตัว VC ใบนั้น (อาจอยู่คนละ domain ตามแต่ละ issuer) และตรวจวันหมดอายุจากตัว VC ในเครื่อง ทั้งสองทางไม่ต้องยืนยันตัวตน\n3. แจ้งเตือนเมื่อ VC ใกล้หมดอายุ/ถูกเพิกถอน", "ac": "1. แสดงรายการ VC พร้อมสถานะปัจจุบันได้ถูกต้อง\n2. ผู้ถือแก้ไขเนื้อหา VC หรือลบ VC ออกจากกระเป๋าไม่ได้\n3. แจ้งเตือนเมื่อ VC ใกล้หมดอายุหรือถูกเพิกถอน", "sx": "แอปและหน้าจอผู้ใช้ as a wallet user, i want to ดูรายการและตรวจสอบสถานะ vc ในกระเป๋า, so that รู้ว่าตัวเองมีใบรับรองอะไรบ้างและใบไหนยังใช้ได้"}, "WALLET-05": {"id": "WALLET-05", "what": "ยื่นคำขอรับ VC ด้วยตนเองจากในแอป", "out": "ขอ VC ได้จากในแอปโดยไม่ต้องเดินทางไปหน่วยงาน", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Self-Service Credential Request", "pri": "Medium", "pts": 5, "dep": "PROTOCOL-01, IDENTITY-06, ISSUANCE-03, WALLET-07", "sprint": 7, "status": "Backlog", "ws": "Wallet App", "phase": "เฟส 3 · 3.2 เตรียมเปิดบริการ", "scope": "1. สามารถส่งคำขอรับ VC แบบ self-service (เลขบัตร ปชช./เลขใบอนุญาต) ผ่าน VCVP Core (ISSUANCE-03)\n2. แสดงสถานะคำขอ และเมื่อได้ offer กลับมาให้ส่งต่อให้ขั้นตอนรับ VC (WALLET-07)", "ac": "1. ผู้ใช้กรอกข้อมูลระบุตัวตนและส่งคำขอรับ VC ได้\n2. ระบบเชื่อมคำขอกับ credential id เมื่อออก offer สำเร็จ\n3. แสดงสถานะคำขอและ offer ที่ได้รับกลับ", "sx": "แอปและหน้าจอผู้ใช้ as a wallet user, i want to ขอรับใบรับรองด้วยตนเองโดยกรอกข้อมูลระบุตัวตน, so that เริ่มกระบวนการรับ vc ได้โดยไม่ต้องรอลิงก์จากผู้ออก"}, "WALLET-06": {"id": "WALLET-06", "what": "แสดง timeline การรับ/ยื่น/ถูกเพิกถอนของแต่ละใบ", "out": "ผู้ถือย้อนดูได้ว่าเคยให้ข้อมูลกับใครไปบ้าง", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Activity & Disclosure History", "pri": "Low", "pts": 5, "dep": "WALLET-04, IDENTITY-06", "sprint": 7, "status": "Backlog", "ws": "Wallet App", "phase": "เฟส 3 · 3.2 เตรียมเปิดบริการ", "scope": "1. แสดงประวัติกิจกรรม/การเปิดเผยข้อมูล โดยดึงข้อมูลผ่านทาง VCVP Core\n2. timeline เหตุการณ์ของแต่ละ VC (RECEIVED/PRESENTED/REVOKED)\n3. กรอง/ดูรายละเอียดย้อนหลังได้", "ac": "1. แสดงประวัติการเปิดเผยข้อมูล (disclosure) แยกตามสถานะ\n2. แสดง timeline เหตุการณ์ของแต่ละ VC\n3. กรอง/ดูรายละเอียดรายการย้อนหลังได้", "sx": "แอปและหน้าจอผู้ใช้ as a wallet user, i want to ดูประวัติกิจกรรมและการเปิดเผยข้อมูลของฉัน, so that ตรวจสอบย้อนหลังได้ว่าเคยยื่นข้อมูลอะไรให้ใคร"}, "WALLET-08": {"id": "WALLET-08", "what": "ช่องทางถอนความยินยอมของข้อมูลที่เคยยื่นไป", "out": "ผู้ถือขอให้หยุดใช้ข้อมูลที่เคยให้ไปได้", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Consent Withdrawal (Right to Erasure)", "pri": "High", "pts": 5, "dep": "WALLET-06, PROTOCOL-02, CONSENT-02, IDENTITY-06", "sprint": 7, "status": "Backlog", "ws": "Wallet App", "phase": "เฟส 3 · 3.2 เตรียมเปิดบริการ", "scope": "1. มีช่องทางให้สามารถส่งคำขอถอนความยินยอมของ VP ที่เคยยื่น\n2. แสดงประวัติการถอนและสถานะ\n3. ส่งคำขอผ่าน VCVP Core (CONSENT-02) เพื่อแจ้ง verifier และฝั่ง verifier ดำเนินการที่ CONSENT-01", "ac": "1. ผู้ใช้ส่งคำขอถอนความยินยอมของ VP ที่เคยยื่นได้ และเห็นประวัติ/สถานะ\n2. คำขอถูกส่งต่อให้ VCVP Core (CONSENT-02) เพื่อแจ้ง verifier\n3. ฝั่ง verifier รับและดำเนินการคำขอที่ CONSENT-01 (ตรวจผลฝั่งนั้น)", "sx": "แอปและหน้าจอผู้ใช้ as a wallet user, i want to ถอนความยินยอมการเปิดเผยข้อมูลหลังยื่น vp ไปแล้ว, so that ใช้สิทธิ์ตาม pdpa ในการให้ผู้ตรวจสอบลบ/หยุดใช้ข้อมูลของฉัน"}, "WALLET-11": {"id": "WALLET-11", "what": "ตัดสินและจัดการข้อมูลส่วนบุคคลที่ถูกเก็บซ้ำแบบอ่านได้ในเครื่อง", "out": "เก็บข้อมูลส่วนบุคคลบนเครื่องเท่าที่จำเป็นตามหลัก PDPA", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Personal Data Minimisation in On-Device Claim Store", "pri": "High", "pts": 5, "dep": "WALLET-09", "sprint": 7, "status": "Backlog", "ws": "Wallet App", "phase": "เฟส 3 · 3.2 เตรียมเปิดบริการ", "scope": "1. ตรวจว่าปัจจุบันข้อมูลส่วนบุคคลอยู่บนเครื่องสองที่พร้อมกัน คือในตัว SD-JWT ที่เก็บเป็นก้อน และแตกเป็นรายฟิลด์แบบอ่านได้ในตาราง claim (เช่น เลขประจำตัว ชื่อ วันเกิด)\n2. ตัดสินระหว่างยอมรับการเก็บซ้ำโดยมีมาตรการชดเชย กับเลิกเก็บรายฟิลด์แล้วแยกข้อมูลจากก้อน SD-JWT ตอนใช้งาน\n3. ถ้าเลือกเลิกเก็บ ต้องวัดผลกระทบต่อความเร็วในการแสดงรายการบัตรและหน้ารายละเอียด แล้วยืนยันว่ายังอยู่ในเกณฑ์ที่ยอมรับได้\n4. บันทึกผลการตัดสินพร้อมเหตุผลเป็น ADR และปรับเอกสารบันทึกรายการประมวลผลข้อมูลส่วนบุคคลให้ตรง", "ac": "1. มีเอกสารระบุชัดว่าข้อมูลส่วนบุคคลถูกเก็บที่ใดบ้างบนเครื่อง และแต่ละที่มีเหตุผลรองรับ\n2. มี ADR ระบุทางเลือกที่ประเมินและเหตุผลที่เลือก\n3. ถ้าเลือกเลิกเก็บรายฟิลด์ ตาราง claim ต้องไม่มีข้อมูลส่วนบุคคลแบบอ่านได้เหลืออยู่ ตรวจได้จากการเปิดฐานข้อมูลทดสอบ\n4. เวลาแสดงรายการบัตรอยู่ในเกณฑ์ที่ตกลงไว้", "sx": "แอปและหน้าจอผู้ใช้ as a data protection officer, i want to ให้ข้อมูลส่วนบุคคลบนเครื่องไม่ถูกเก็บซ้ำในรูปแบบที่อ่านได้, so that ความเสี่ยงเมื่อเครื่องถูกเจาะลดลงและสอดคล้องกับหลักเก็บเท่าที่จำเป็น"}, "WALLET-13": {"id": "WALLET-13", "what": "เปลี่ยนค่าตั้งต้นที่ติดมากับไลบรารีให้ชี้มาที่ระบบของเราทั้งหมด", "out": "ไม่มีการเชื่อมต่อออกไปยังระบบของผู้ผลิตไลบรารีโดยไม่ตั้งใจ", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Production Configuration Hardening (Wallet Defaults)", "pri": "High", "pts": 3, "dep": "WALLET-01", "sprint": 7, "status": "Backlog", "ws": "Wallet App", "phase": "เฟส 3 · 3.2 เตรียมเปิดบริการ", "scope": "1. ตรวจค่าตั้งต้นทุกตัวที่ติดมากับไลบรารีฝั่งอุปกรณ์ โดยเฉพาะปลายทาง MQTT broker ที่ค่า default ชี้ไปยังระบบทดสอบของผู้ผลิต\n2. เปลี่ยนให้ชี้ไปยังระบบของเราทุกตัว และทำให้ค่าตั้งต้นเหล่านี้มาจากไฟล์ตั้งค่าของเรา ไม่ใช่ค่าที่ฝังมากับไลบรารี\n3. เพิ่มการตรวจอัตโนมัติในสายการสร้างแอป ไม่ให้ปล่อยรุ่นที่ยังมีปลายทางของผู้ผลิตค้างอยู่\n4. บันทึกรายการค่าตั้งต้นที่ตรวจแล้วไว้เป็นรายการตรวจสอบก่อนปล่อยรุ่น", "ac": "1. ไม่มีปลายทางของผู้ผลิตไลบรารีเหลืออยู่ในรุ่นที่เผยแพร่ ตรวจได้จากการค้นในไฟล์แอปที่สร้างแล้ว\n2. การตรวจอัตโนมัติในสายการสร้างแอปทำให้รุ่นที่มีค่าผิดสร้างไม่ผ่าน\n3. มีรายการตรวจสอบค่าตั้งต้นก่อนปล่อยรุ่นที่ใช้งานได้จริง", "sx": "แอปและหน้าจอผู้ใช้ as a platform engineer, i want to ให้ค่าตั้งต้นทุกตัวในกระเป๋าชี้ไปที่ระบบของเรา, so that ไม่มีการเชื่อมต่อออกไปยังระบบของผู้ผลิตไลบรารีโดยไม่ตั้งใจ"}, "PORTAL-03": {"id": "PORTAL-03", "what": "วางรากฐาน design system และมาตรฐานการเข้าถึง WCAG 2.1 AA ของ Portal", "out": "ทุกหน้าจอที่สร้างหลังจากนี้ใช้ชุดเดียวกันและเข้าถึงได้ตามมาตรฐาน", "comp": "Portal (ส่วนกลาง)", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Portal Design System & Accessibility Foundation", "pri": "High", "pts": 8, "dep": "IDENTITY-01", "sprint": 0, "status": "Backlog", "ws": "Portal (ส่วนกลาง)", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. สร้าง design token และชุดสีที่ผ่านเกณฑ์ contrast ของ WCAG 2.1 AA ตั้งแต่ต้น\n2. สร้าง component ที่ใช้ร่วมกันทั้ง 3 portal โดยรองรับคีย์บอร์ด แสดงโฟกัสชัดเจน และมี label สำหรับโปรแกรมอ่านหน้าจอ\n3. แสดงวันที่และตัวเลขตามรูปแบบไทย (พ.ศ.) ให้ถูกต้องทั้งระบบ\n4. กำหนดให้หน้าจอที่สร้างหลังจากนี้ใช้ design system และ component ชุดนี้ ไม่สร้างเอง\n5. (ทางเลือก) เตรียมโครงสร้างแยกข้อความออกจากโค้ดเพื่อรองรับหลายภาษาในอนาคต โดยเฟสนี้ส่งมอบภาษาไทยอย่างเดียว ให้ทีมพัฒนาประเมินว่าคุ้มที่จะทำตั้งแต่ต้นหรือไม่", "ac": "1. ชุดสีและ component ผ่านเกณฑ์ contrast ของ WCAG 2.1 AA\n2. ใช้คีย์บอร์ดเข้าถึงและสั่งงานได้ครบทุก component พร้อมเห็นโฟกัสชัดเจน\n3. PORTAL-01, PORTAL-02 และ ISSUER-01 ใช้ design system และ component ชุดนี้จริง\n4. วันที่และตัวเลขแสดงตามรูปแบบไทยถูกต้อง", "sx": "แอปและหน้าจอผู้ใช้ as a portal user, i want to ใช้งาน portal ได้สะดวกและเข้าถึงได้ตามมาตรฐาน, so that ผู้ใช้หลากหลายกลุ่มใช้งานได้จริง"}, "PORTAL-01": {"id": "PORTAL-01", "what": "wizard ตั้งค่า DID และ key ขององค์กร พร้อมตรวจความพร้อม", "out": "หน่วยงานใหม่พร้อมออก/ตรวจ VC ได้ด้วยตัวเอง", "comp": "Portal (ส่วนกลาง)", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Organization DID & Key Setup", "pri": "High", "pts": 8, "dep": "KEY-01, KEY-02, IDENTITY-02, PORTAL-03", "sprint": 5, "status": "Backlog", "ws": "Portal (ส่วนกลาง)", "phase": "เฟส 2 · 2.3 ตรวจผ่าน Trust Registry", "scope": "1. Portal UI onboarding wizard ตั้งค่า DID/key ขององค์กร\n2. เรียก VCVP Core เพื่อ สร้าง DID (did:web/key) + generate/import key\n3. เผยแพร่และตรวจ did.json + แสดงสถานะความพร้อม", "ac": "1. สร้าง DID องค์กรและกุญแจผ่าน Portal ได้สำเร็จ\n2. สำหรับ did:web ระบบช่วยเผยแพร่และตรวจ did.json ที่ปลายทาง\n3. แสดงสถานะความพร้อม (DID ready / key ready) ของแต่ละองค์กร", "sx": "แอปและหน้าจอผู้ใช้ as an issuer operator, i want to ตั้งค่า did และกุญแจขององค์กรผ่านขั้นตอน onboarding ใน portal, so that องค์กรพร้อมออกและตรวจ vc ได้โดยไม่ต้องแก้ config เอง"}, "PORTAL-02": {"id": "PORTAL-02", "what": "จัดการ entity ฝั่ง issuer/verifier และผูก DID/key", "out": "จัดการหน่วยงานย่อยที่ทำหน้าที่ออกหรือตรวจได้", "comp": "Portal (ส่วนกลาง)", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Issuer & Verifier Entity Management", "pri": "High", "pts": 5, "dep": "IDENTITY-02, PORTAL-01, PORTAL-03", "sprint": 7, "status": "Backlog", "ws": "Portal (ส่วนกลาง)", "phase": "เฟส 3 · 3.2 เตรียมเปิดบริการ", "scope": "1. Portal UI CRUD issuer/verifier entity ผูก DID/Key และเลือก entity ไปใช้ในสาย issuance/verification\n2. scope ตามองค์กร ผ่าน VCVP Core", "ac": "1. สร้าง/แก้ไข/ดู issuer และ verifier entity พร้อมผูก DID/Key\n2. Entity ถูก scope ตาม organization ที่ถูกต้อง\n3. เลือก entity ไปใช้ในสาย issuance/verification ได้", "sx": "แอปและหน้าจอผู้ใช้ as a portal administrator, i want to สร้างและจัดการ entity ของ issuer และ verifier พร้อมผูก did และ key, so that กำหนดผู้ออกและผู้ตรวจในแต่ละองค์กรได้"}, "ISSUER-01": {"id": "ISSUER-01", "what": "สร้าง/แก้ไข/เผยแพร่ schema ของ VC", "out": "เจ้าหน้าที่กำหนด schema ของ VC ได้เอง", "comp": "Issuer Portal", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Credential Schema Management", "pri": "Highest", "pts": 5, "dep": "ENGINE-02, IDENTITY-03, SCHEMA-01, PORTAL-03", "sprint": 2, "status": "Backlog", "ws": "Issuer Portal", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. หน้าจอสำหรับ สร้าง/แก้ไข/เผยแพร่ credential schema โดยแยกสถานะร่างกับสถานะเผยแพร่ออกจากกัน และการเผยแพร่หมายถึงทำให้ schema และ type metadata เข้าถึงได้จาก URL สาธารณะบน domain ของเรา และเห็นได้ข้ามองค์กร\n2. เรียกผ่าน VCVP Core (schema sync = SCHEMA-01)\n3. เลือก format/revocationMethod โดยอ้างอิง config instance ที่เปิดใช้ใน one-core (ดู ENGINE-01)\n4. กำหนดเงื่อนไขการเปลี่ยนแปลง schema ที่เผยแพร่แล้ว เพื่อไม่ให้กระทบ VC ที่ออกไปแล้ว การแก้ไขต้องออกเป็นเวอร์ชันใหม่เสมอ ไม่ทับของเดิม โดยระบบยังรู้ว่าเป็น schema ตัวเดียวกันแต่เป็นคนละเวอร์ชัน (SCHEMA-01) และกรณีถ้ามี VC อ้างอิงอยู่ จะไม่สามารถลบ schema ได้ โดยระบบจะต้องปฏิเสธการดำเนินการพร้อมเหตุผล แต่ถ้ากรณีอยู่ในสถานะร่างที่ยังไม่เผยแพร่แก้ทับหรือลบได้", "ac": "1. สร้าง/แก้ไข/เผยแพร่ schema และเลือก format ได้\n2. Schema กำหนด claim/format (SD_JWT) ถูกต้องและ validate ได้\n3. แก้ schema สร้างเวอร์ชันใหม่โดยไม่กระทบ VC ที่ออกไปแล้ว\n4. ลบ schema ที่มี VC อ้างอยู่ไม่ได้ ระบบปฏิเสธพร้อมเหตุผลที่ระบุว่ามี VC อ้างอยู่\n5. schema ที่อยู่ในสถานะร่างและยังไม่เผยแพร่ แก้ทับหรือลบได้", "sx": "แอปและหน้าจอผู้ใช้ as an issuer operator, i want to สร้างและจัดการ credential schema ผ่าน portal, so that กำหนดโครงสร้างข้อมูลใบรับรองได้เอง"}, "ISSUER-02": {"id": "ISSUER-02", "what": "หน้าจอสำหรับออก VC แสดง QR และติดตามสถานะ", "out": "เจ้าหน้าที่ออก VC ให้ประชาชนได้จากหน้าจอ", "comp": "Issuer Portal", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Issuance Workflow & Credential Offer", "pri": "Highest", "pts": 5, "dep": "PROTOCOL-01, ISSUER-01, ISSUANCE-02", "sprint": 3, "status": "Backlog", "ws": "Issuer Portal", "phase": "เฟส 2 · 2.1 Issuer core", "scope": "1. หน้าจอสำหรับออก VC แสดง QR/deeplink และ ติดตามสถานะ offer\n2. เรียก VCVP Core เป็นผู้ orchestrate (ISSUANCE-02)\n3. รองรับการยกเลิก offer ที่ยังไม่มีผู้มารับได้จากหน้าจอ โดยต้องยืนยันก่อนทำ และปุ่มจะไม่แสดงเมื่อ offer ถูกรับไปแล้ว (การเพิกถอน VC ที่ถูกรับไปแล้วอยู่ที่ ISSUER-03)", "ac": "1. สร้าง credential offer ผ่าน VCVP Core และแสดง QR/deeplink ได้\n2. ติดตามสถานะ offer (pending เป็น claimed)\n3. ยกเลิก offer ที่ยังไม่ถูก claim ได้", "sx": "แอปและหน้าจอผู้ใช้ as an issuer operator, i want to สร้างคำสั่งออก vc และ credential offer (qr/deeplink) ให้ผู้ถือ, so that ผู้ใช้รับ vc เข้ากระเป๋าได้ผ่าน openid4vci"}, "ISSUER-03": {"id": "ISSUER-03", "what": "ค้นหา VC และเพิกถอน/ระงับ/ปลดระงับ", "out": "เจ้าหน้าที่สามารถดำเนินการค้นหาและเพิกถอน/ระงับ/ปลดระงับได้", "comp": "Issuer Portal", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Revocation Management Console", "pri": "High", "pts": 5, "dep": "REVOCATION-01, ISSUER-02, REVOCATION-02", "sprint": 6, "status": "Backlog", "ws": "Issuer Portal", "phase": "เฟส 3 · 3.1 Final test", "scope": "1. หน้าจอสำหรับค้นหา VC และเพิกถอน/ระงับ/ปลดระงับ (revoke/suspend/unsuspend)\n2. ดำเนินการผ่าน VCVP Core (REVOCATION-02) และ แสดง audit พร้อมเหตุผล\n3. มีช่องให้กรอกเหตุผล โดยกำหนดให้เป็นข้อมูลจำเป็นก่อนยืนยันทุกครั้ง และส่งเหตุผลพร้อมข้อมูลผู้ดำเนินการไปบันทึกที่ VCVP Core (REVOCATION-02)", "ac": "1. ค้นหา VC ตาม subject/credential id/วันที่ออกได้\n2. สามารถ เพิกถอน/ระงับ/ปลดระงับ แล้วสถานะใน status list อัปเดตจริง\n3. ตรวจพบบันทึกเหตุผลและข้อมูลผู้ดำเนินการทุกครั้ง (audit)", "sx": "แอปและหน้าจอผู้ใช้ as an issuer operator, i want to ค้นหาและเพิกถอน/ระงับ/ปลดระงับ vc ผ่านหน้าจอ portal, so that จัดการใบรับรองที่ไม่ถูกต้องหรือหมดสิทธิ์ได้ทันที"}, "ISSUER-04": {"id": "ISSUER-04", "what": "dashboard สถิติการออก/เพิกถอน พร้อมประวัติและ นำออกรายงาน", "out": "เจ้าหน้าที่เห็นภาพรวมการออก/เพิกถอน VC และนำออกรายงานได้", "comp": "Issuer Portal", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Issuance Dashboard & History", "pri": "Medium", "pts": 5, "dep": "ISSUER-02, ISSUER-03", "sprint": 7, "status": "Backlog", "ws": "Issuer Portal", "phase": "เฟส 3 · 3.2 เตรียมเปิดบริการ", "scope": "1. หน้า dashboard สถิติการออก เพิกถอน และประวัติ (filter/pagination)\n2. ดึงข้อมูลผ่านทาง VCVP Core และสามารถ export CSV หรือ Excel", "ac": "1. แสดงสถิติการออกและเพิกถอนแยกตามช่วงเวลาและ schema\n2. ค้นหา/กรองประวัติและแบ่งหน้า (pagination) ได้\n3. Export รายงานเป็น CSV/Excel ได้", "sx": "แอปและหน้าจอผู้ใช้ as an issuer operator, i want to ดูสถิติและประวัติการออก vc, so that ติดตามปริมาณงานและตรวจสอบย้อนหลังได้"}, "VERIFIER-01": {"id": "VERIFIER-01", "what": "สร้างชุดคำขอตรวจ (เลือก claim / issuer ที่ยอมรับ)", "out": "verifier กำหนดเองได้ว่าจะขอดูข้อมูลอะไรบ้าง", "comp": "Verifier Portal", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Proof Request Builder", "pri": "Highest", "pts": 8, "dep": "VERIFICATION-03, IDENTITY-03, SCHEMA-01, PROTOCOL-02", "sprint": 4, "status": "Backlog", "ws": "Verifier Portal", "phase": "เฟส 2 · 2.2 VC และ VP ครบวงจร", "scope": "1. หน้าจอสำหรับสร้างชุดคำขอตรวจ (proof request) ที่บันทึกไว้ใช้ซ้ำได้ โดยเลือก claim จากรายการ schema ที่ issuer เผยแพร่ไว้ (SCHEMA-01) และเลือก trusted issuers จาก trust list ที่ระบบมี (VERIFICATION-03)\n2. แปลงชุดคำขอตรวจเป็นรูปแบบคำขอตามเวอร์ชัน OpenID4VP ที่เปิดใช้ (PROTOCOL-02) — DCQL สำหรับ OpenID4VP 1.0 หรือ Presentation Definition (DIF Presentation Exchange v2.0) สำหรับร่างก่อนหน้า — และบันทึกผ่าน VCVP Core", "ac": "1. สร้างและบันทึกชุดคำขอตรวจ และเลือก claim ที่ต้องตรวจได้\n2. ระบุ trusted issuers และ required claim ได้ (เช่น age_over flag)\n3. ชุดคำขอตรวจถูกแปลงเป็นรูปแบบคำขอที่ถูกต้องตามเวอร์ชัน OpenID4VP ที่เปิดใช้ และ wallet ปลายทางตอบกลับได้สำเร็จ", "sx": "แอปและหน้าจอผู้ใช้ as a verifier operator, i want to สร้างชุดคำขอตรวจ (proof request) โดยเลือก claim ที่ต้องการตรวจ, so that ออกแบบเงื่อนไขการตรวจสอบได้เองตามกรณีใช้งาน"}, "VERIFIER-02": {"id": "VERIFIER-02", "what": "เปิด session ตรวจ แสดง QR และผลแบบ real-time", "out": "จุดบริการตั้งจุดตรวจแล้วรู้ผลทันทีที่ประชาชนสแกน", "comp": "Verifier Portal", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Verification Session & QR Generation", "pri": "Highest", "pts": 5, "dep": "PROTOCOL-02, VERIFIER-01, VERIFICATION-01", "sprint": 4, "status": "Backlog", "ws": "Verifier Portal", "phase": "เฟส 2 · 2.2 VC และ VP ครบวงจร", "scope": "1. หน้าจอสำหรับ เปิด verification session โดยเลือกจากชุดคำขอตรวจที่บันทึกไว้ (VERIFIER-01) และ แสดง QR/deeplink พร้อมทั้ง แสดงผล real-time\n2. เรียก VCVP Core เป็นผู้ orchestrate (VERIFICATION-01)", "ac": "1. เปิด session และแสดง QR ให้ผู้ถือยื่น VP ได้\n2. แสดงผล verified/failed พร้อมเหตุผล\n3. กัน replay (จัดการที่ VCVP Core)\n4. เมื่อองค์กรถูกถอนออกจากทะเบียน หน้าจอแสดงเหตุผลที่เปิด session ไม่ได้", "sx": "แอปและหน้าจอผู้ใช้ as a verifier operator, i want to เปิด verification session และสร้าง qr ให้ผู้ถือยื่น vp, so that ดำเนินการตรวจสอบ ณ จุดบริการได้"}, "VERIFIER-03": {"id": "VERIFIER-03", "what": "ประวัติและสถิติการตรวจสอบ พร้อมตัวกรอง", "out": "ย้อนดูได้ว่าตรวจเมื่อไหร่ ผลเป็นอย่างไร", "comp": "Verifier Portal", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Verification Results & History Dashboard", "pri": "Medium", "pts": 5, "dep": "VERIFIER-02", "sprint": 7, "status": "Backlog", "ws": "Verifier Portal", "phase": "เฟส 3 · 3.2 เตรียมเปิดบริการ", "scope": "1. หน้าจอสำหรับ ประวัติและสถิติการตรวจสอบ VP (filter/pagination)\n2. ดึงข้อมูลจาก VCVP Core (เก็บข้อมูลเท่าที่จำเป็นตาม PDPA) และ export รายงานเป็น CSV หรือ Excel", "ac": "1. แสดงประวัติการตรวจสอบพร้อมผลและเหตุผล\n2. ไม่จัดเก็บ PII เกินจำเป็น (data minimization)\n3. กรองตามช่วงเวลา/ชุดคำขอตรวจ และ export ได้", "sx": "แอปและหน้าจอผู้ใช้ as a verifier operator, i want to ดูประวัติและสถิติการตรวจสอบ vp, so that ตรวจสอบย้อนหลังและวิเคราะห์การใช้งานได้"}, "PLATFORM-01": {"id": "PLATFORM-01", "what": "วาง pipeline build/test/deploy และ Infrastructure as Code", "out": "deploy ขึ้นระบบได้อัตโนมัติ โดย production ต้องผ่านการอนุมัติ และสร้าง environment ขึ้นใหม่ได้เหมือนเดิม", "comp": "Platform & Infrastructure", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "CI/CD Pipeline & Infrastructure as Code", "pri": "High", "pts": 8, "dep": "PLATFORM-02", "sprint": 0, "status": "Backlog", "ws": "Platform & Infrastructure", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "ตั้งค่า CI (build/test/lint/security scan) + CD (deploy staging/prod), containerize (Docker), IaC (Terraform/Helm) และ secret management", "ac": "1. ทุก commit ผ่าน pipeline build+test อัตโนมัติ\n2. Deploy ขึ้น staging อัตโนมัติ และ prod แบบ approval\n3. สร้าง environment ใหม่จาก IaC ได้สำเร็จโดยไม่ต้องมีคนเข้าไปตั้งค่าเพิ่ม และได้ผลเหมือนเดิมทุกครั้ง\n4. ทุกบริการถูก deploy เป็น container จาก image ที่ระบุเวอร์ชันได้ชัดเจน\n5. secret ไม่อยู่ใน repo และ pipeline ดึงจาก secret manager ตอน deploy", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a devops engineer, i want to มี ci/cd และ infrastructure as code, so that build/test/deploy ได้อัตโนมัติ ปลอดภัย และทำซ้ำได้"}, "PLATFORM-02": {"id": "PLATFORM-02", "what": "build และ deploy engine พร้อม health check และ smoke test", "out": "มี engine ที่รันได้จริงบน environment ของเรา", "comp": "Platform & Infrastructure", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "one-core Installation, Deployment & Initialization", "pri": "Highest", "pts": 8, "dep": "PLATFORM-04", "sprint": 0, "status": "Backlog", "ws": "Platform & Infrastructure", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. Install/Build one-core (engine ของ Procivis) บน environment ที่กำหนด และ version pinning (reproducible build)\n2. จัดการ dependency ของ native module (เช่น crypto/SDK) และ containerize\n3. รัน one-core เป็นบริการ \n4. wiring health check (/health) สำหรับ readiness/liveness เข้ากับ container platform ที่เลือก และ smoke test (health/version) หลัง deploy\n5. verify ว่า one-core boot แล้ว provider โหลดครบ ไม่มี error\n6. จัดทำเอกสารขั้นตอนติดตั้งและวิธีการรัน ให้คนอื่นในทีมทำตามแล้วติดตั้งได้เอง\nหมายเหตุ: เฟสนี้ติดตั้ง engine ตัวเดียว การติดตั้งและดูแล engine ตัวที่สองอยู่นอกขอบเขตเฟสนี้ แต่โครงสร้างของระบบต้องรองรับไว้แล้ว (ADAPTER-01 / ADAPTER-03)", "ac": "1. รัน one-core บน environment ที่กำหนด และผ่าน smoke test (health/version)\n2. ระบุและล็อกเวอร์ชันของ one-core/SDK ได้ชัดเจน (reproducible build)\n3. one-core boot แล้วโหลด provider ครบทุกตัวโดยไม่มี error ใน log\n4. GET /health return 200 และ แสดงสถานะ provider และต่อ readiness/liveness probe กับ orchestrator ได้\n5. มีเอกสารขั้นตอนติดตั้งและวิธีการรัน ที่คนอื่นในทีมทำตามแล้วติดตั้งได้สำเร็จ", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a devops engineer, i want to ติดตั้งและ deploy one-core (engine ของ procivis) เป็นบริการที่รันได้, so that ทีมมีบริการกลางของระบบ vcvp พร้อมใช้งานบนทุก environment"}, "PLATFORM-03": {"id": "PLATFORM-03", "what": "แยก environment Dev/UAT/PreProd/Prod และกำหนด promotion path", "out": "ทดสอบก่อนขึ้นใช้งานจริงได้โดยไม่กระทบ production", "comp": "Platform & Infrastructure", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Multi-Environment Provisioning (Dev / UAT / PreProd / Prod)", "pri": "High", "pts": 8, "dep": "PLATFORM-02, PLATFORM-01", "sprint": 0, "status": "Backlog", "ws": "Platform & Infrastructure", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. สร้าง environment แยกขาดจากกัน พร้อมกำหนด network และ resource sizing ของแต่ละตัว\n2. แยก config/secret ต่อ env\n3. แยกฐานข้อมูลและ DID/host ต่อ env\n4. กำหนด promotion path ระหว่าง environment\n5. กำหนดเงื่อนไขก่อนขึ้น production เป็น 2 ระดับ (ก) ระดับนำร่อง จำกัดหน่วยงานและจำนวนผู้ใช้: กุญแจของหน่วยงานต้องอยู่ใน KMS แล้ว (KEY-03) เพราะ INTERNAL (encrypted DB) ใช้ได้เฉพาะ dev/UAT พร้อม hardening ระดับ platform (PLATFORM-06) และ audit log ใช้งานได้ (AUDIT-01) (ข) ระดับเปิดสาธารณะเต็มรูปแบบ: ต้องผ่านการทดสอบเจาะระบบและ DPIA (TESTING-02) ปรับตามข้อกำหนด ETDA (ENGINE-07) audit log ที่แก้ย้อนหลังไม่ได้ (AUDIT-02) ระบบสำรองและการกู้คืน (PLATFORM-08) และการทดสอบรองรับโหลด (TESTING-03) ครบก่อน โดยบังคับทั้งสองระดับเป็นด่านอัตโนมัติใน CD pipeline (PLATFORM-01) ถ้ายังไม่ครบให้หยุด deploy พร้อมแจ้งว่าขาดเงื่อนไขข้อใด", "ac": "1. มี environment Dev / UAT / PreProd / Prod แยกข้อมูลและ config ขาดจากกัน\n2. ทรัพยากร (DB, secret, DID/host) ของแต่ละ env แยกขาดจากกัน ไม่ปะปนกัน\n3. promote build จาก environment หนึ่งไปยัง environment ถัดไปได้จริงตามเส้นทางที่กำหนด และข้ามขั้นไม่ได้\n4. deploy ขึ้น production ระดับนำร่องไม่ได้ถ้ายังไม่ครบเงื่อนไขระดับ (ก) และ deploy ระดับเปิดสาธารณะไม่ได้ถ้ายังไม่ครบเงื่อนไขระดับ (ข) โดยระบบแจ้งว่าขาดเงื่อนไขข้อใด", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a platform engineer, i want to จัดเตรียม environment แยก dev / uat / preprod / prod, so that พัฒนา ทดสอบ และใช้งานจริงโดยไม่กระทบกัน"}, "PLATFORM-04": {"id": "PLATFORM-04", "what": "ติดตั้งฐานข้อมูล เปิด encryption-at-rest และรัน migration", "out": "ข้อมูลถูกเก็บอย่างปลอดภัยและอัปเกรดโครงสร้างได้", "comp": "Platform & Infrastructure", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Database Provisioning, Encryption & Migration", "pri": "High", "pts": 8, "dep": "None", "sprint": 0, "status": "Backlog", "ws": "Platform & Infrastructure", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. ติดตั้ง/กำหนดค่า MariaDB/PostgreSQL\n2. เปิด encryption-at-rest\n3. ให้ one-core รัน migration ของตัวเองได้สำเร็จตอน boot และเตรียมฐานข้อมูลเปล่าไว้ให้ VCVP Core (schema ออกแบบที่ IDENTITY-04)\n4. ตั้ง connection pooling และ baseline backup", "ac": "1. ฐานข้อมูลถูกสร้างครบทั้งของ one-core และของ VCVP Core และ one-core รัน migration ของตัวเองสำเร็จ\n2. เปิดใช้ encryption-at-rest และจำกัดสิทธิ์การเข้าถึง (least privilege)\n3. ทดสอบการเชื่อมต่อจาก one-core และจาก VCVP Core เข้าฐานข้อมูลของตัวเองสำเร็จ และมี baseline backup", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a platform engineer, i want to จัดเตรียมฐานข้อมูลของ one-core พร้อมเข้ารหัสและ migration, so that ข้อมูลระบบถูกจัดเก็บอย่างปลอดภัยและ schema พร้อมใช้งาน"}, "PLATFORM-06": {"id": "PLATFORM-06", "what": "กำหนดให้ใช้ TLS, rate limit, input validation และ security headers", "out": "ระบบสามารถรับมือกับการโจมตีพื้นฐานตามเกณฑ์ OWASP ได้", "comp": "Platform & Infrastructure", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Transport & API Security Hardening", "pri": "High", "pts": 5, "dep": "PLATFORM-02", "sprint": 0, "status": "Backlog", "ws": "Platform & Infrastructure", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "Hardening ระดับ platform ในชั้นแอปพลิเคชัน (ส่วนการจำกัดอัตราและ cache ที่ชั้น edge อยู่ที่ EDGE-03): enforce TLS 1.2+, rate limiting, input/schema validation, CORS policy, security headers และ secret management ตาม OWASP ASVS", "ac": "1. ทุก endpoint บังคับ HTTPS และปฏิเสธ HTTP\n2. มี rate limiting และตอบ 429 เมื่อเกิน threshold\n3. Input ที่ผิด schema ถูกปฏิเสธพร้อม error message ที่ไม่เปิดเผยข้อมูลภายใน\n4. CORS อนุญาตเฉพาะ origin ที่กำหนด และปฏิเสธ origin อื่น\n5. ทุก response มี security headers ตามรายการที่กำหนดไว้ (เช่น HSTS, X-Content-Type-Options, X-Frame-Options, CSP)\n6. ตรวจแล้วไม่พบ secret ใน repo, config, log และ error message", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a security engineer, i want to บังคับใช้ tls, rate limiting และ input validation ทุก endpoint, so that ป้องกันการโจมตีและข้อมูลรั่วไหล"}, "PLATFORM-08": {"id": "PLATFORM-08", "what": "เก็บ metrics, ตั้ง alert และทำ distributed tracing", "out": "รู้ปัญหาก่อนผู้ใช้แจ้ง และตามรอยปัญหาข้าม service ได้", "comp": "Platform & Infrastructure", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "High Availability, Backup & Disaster Recovery", "pri": "Medium", "pts": 13, "dep": "PLATFORM-01", "sprint": 0, "status": "Backlog", "ws": "Platform & Infrastructure", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. ออกแบบ HA (redundancy, load balancing) และ failover plan\n2. automated DB backup ,  restore drill และ กำหนด RPO/RTO\n3. Key backup & escrow ของ issuer signing key (เช่น Shamir Secret Sharing / KMS backup) และ test recovery กัน key หาย = VC verify ไม่ได้", "ac": "1. ระบบรองรับ node ล่มโดยไม่หยุดบริการ (HA)\n2. มี backup อัตโนมัติ (DB และ key) และทดสอบ restore/recovery สำเร็จ\n3. มีเอกสาร RPO/RTO, runbook กู้คืน และ key escrow procedure", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a platform operator, i want to ให้ระบบมี ha และแผนสำรอง/กู้คืน, so that บริการต่อเนื่องและกู้คืนข้อมูลได้เมื่อเกิดเหตุ"}, "PLATFORM-07": {"id": "PLATFORM-07", "what": "ออกแบบ HA/failover, backup/restore drill และสำรอง key", "out": "ระบบล่มแล้วกู้คืนได้ตาม RPO/RTO และ key ไม่สูญหาย", "comp": "Platform & Infrastructure", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Monitoring, Metrics & Analytics", "pri": "Medium", "pts": 5, "dep": "PLATFORM-06, IDENTITY-02", "sprint": 1, "status": "Backlog", "ws": "Platform & Infrastructure", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. Observability ครอบ one-core , VCVP Core, Portal (metrics/health)\n2. alerting เมื่อ error rate/latency เกิน threshold\n3. usage analytics แยกตาม organization\n4. distributed tracing ด้วย correlation id ที่ส่งต่อข้ามทุก service เพื่อตามรอยปัญหาข้าม service ได้", "ac": "1. มี metrics endpoint และ dashboard แสดงสุขภาพระบบ/throughput\n2. ตั้ง alert เมื่อ error rate/latency เกิน threshold\n3. แสดง usage analytics แยกตาม organization ได้\n4. ตามรอย request หนึ่งรายการข้าม one-core, VCVP Core และ Portal ได้ด้วย correlation id เดียวกัน", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a platform operator, i want to มี dashboard เฝ้าระวังสุขภาพระบบและ metrics การใช้งาน, so that ตรวจจับปัญหาและวางแผนขยายระบบได้"}, "PLATFORM-05": {"id": "PLATFORM-05", "what": "ตั้ง NTP ให้ทุก node และตรวจ clock drift", "out": "เวลาใน log และการตรวจอายุ VC ตรงกันทั้งระบบ", "comp": "Platform & Infrastructure", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Clock Synchronization (NTP) Across Nodes", "pri": "Medium", "pts": 3, "dep": "PLATFORM-03", "sprint": 7, "status": "Backlog", "ws": "Platform & Infrastructure", "phase": "เฟส 3 · 3.2 เตรียมเปิดบริการ", "scope": "1. ตั้งค่า NTP/time sync ให้ทุก node (one-core, VCVP Core, Portal) อ้างอิงแหล่งเวลาเดียวกัน\n2. ตรวจสอบ clock drift และ alert เมื่อเกิน threshold ที่กำหนด", "ac": "1. ทุก node เวลาตรงกัน (clock drift < threshold ที่กำหนด)\n2. timestamp ใน audit log และการตรวจ validity ของ credential อ้างอิงเวลาที่ sync แล้ว", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a devops/platform engineer, i want to ให้ทุก server/node sync เวลาจากแหล่ง ntp เดียวกัน, so that timestamp ใน log และการตรวจสอบช่วงเวลาของ credential ถูกต้องตรงกัน (iso 27001 clock sync)"}, "INTEGRATION-01": {"id": "INTEGRATION-01", "what": "ออก/เพิกถอน Key สำหรับใช้งาน API และลงทะเบียน webhook พร้อม retry", "out": "ระบบของหน่วยงานอื่นเชื่อมต่อและรับ event ได้", "comp": "Integration & Notification", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "API Key & Webhook Management", "pri": "Medium", "pts": 8, "dep": "IDENTITY-03, IDENTITY-02", "sprint": 4, "status": "Backlog", "ws": "Integration & Notification", "phase": "เฟส 2 · 2.2 VC และ VP ครบวงจร", "scope": "1. ขาเข้า: VCVP Core ออกและเพิกถอน Key สำหรับใช้งาน API ให้ระบบภายนอกเรียกใช้งานได้ โดยกำหนด scope/role ว่า key แต่ละดอกทำอะไรได้บ้าง\n2. ขาออก: ลงทะเบียน webhook ให้ระบบภายนอกรับ event จากเรา พร้อมลงลายเซ็น HMAC ให้ปลายทางตรวจสอบที่มาได้ และส่งซ้ำเมื่อส่งไม่สำเร็จ พร้อมเก็บ log การส่งที่ล้มเหลวไว้ตรวจสอบ\n3. หน้าจอสำหรับให้ผู้ดูแลระบบขององค์กรบริหารจัดการ Key สำหรับใช้งาน API และ webhook ขององค์กรตัวเองได้ (ต้องมี permission รองรับใน RBAC — IDENTITY-03)", "ac": "1. สร้าง/เพิกถอน Key สำหรับใช้งาน API พร้อม scope ที่กำหนดได้\n2. Webhook ส่ง event (issued/revoked/verified) พร้อมลายเซ็นตรวจสอบได้\n3. มี retry และ log การส่ง webhook ที่ล้มเหลว", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as an integration engineer, i want to สร้าง key สำหรับใช้งาน api และตั้งค่า webhook สำหรับระบบภายนอก, so that ระบบขององค์กรเรียกใช้ฟังก์ชัน issue/verify แบบอัตโนมัติได้"}, "INTEGRATION-02": {"id": "INTEGRATION-02", "what": "ส่ง email/in-app ตาม template และ event ที่กำหนด", "out": "ผู้ใช้ได้รับแจ้งเตือนเมื่อมีเหตุการณ์สำคัญ", "comp": "Integration & Notification", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Notification Service (Email / In-app)", "pri": "Low", "pts": 8, "dep": "IDENTITY-01, IDENTITY-03, PORTAL-03", "sprint": 5, "status": "Backlog", "ws": "Integration & Notification", "phase": "เฟส 2 · 2.3 ตรวจผ่าน Trust Registry", "scope": "1. Implement notification service: template-based email/in-app notification, trigger ตาม event และเตรียมโครงสร้างให้เพิ่มภาษาได้ภายหลัง\n2. ตั้งค่า subscription ต่อ role/user โดย Admin ขององค์กรกำหนดว่า role ใดได้รับการแจ้งเตือนประเภทใด และผู้ใช้แต่ละคนเปิด/ปิดการรับของตัวเองรายประเภทได้ (IDENTITY-03)\n3. หน้าจอสำหรับตั้งค่าการแจ้งเตือนทั้งสองระดับ โดยใช้ design system และ component ชุดกลาง (PORTAL-03)", "ac": "1. ส่งการแจ้งเตือนตาม event ที่กำหนดได้ (email/in-app)\n2. รองรับตัวแปรแทนค่าใน template และเตรียมโครงสร้างให้เพิ่มภาษาได้ภายหลัง\n3. Admin ขององค์กรกำหนดการแจ้งเตือนต่อ role ได้ และผู้ใช้แต่ละคนเปิด/ปิดการรับของตัวเองรายประเภทได้จากหน้าจอ", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as an operator, i want to ให้ระบบแจ้งเตือนเหตุการณ์สำคัญ (vc ใกล้หมดอายุ, ออก/เพิกถอนสำเร็จ), so that ผู้เกี่ยวข้องรับทราบและดำเนินการได้ทันเวลา"}, "INTEGRATION-03": {"id": "INTEGRATION-03", "what": "ส่ง push ไปยัง wallet ผ่าน FCM/APNs พร้อมจัดการ device token", "out": "ผู้ถือรู้ทันทีเมื่อมี VC ใหม่หรือ VC ถูกเพิกถอน", "comp": "Integration & Notification", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Push Notification Service (Wallet)", "pri": "Medium", "pts": 5, "dep": "WALLET-02, INTEGRATION-02", "sprint": 6, "status": "Backlog", "ws": "Integration & Notification", "phase": "เฟส 3 · 3.1 Final test", "scope": "Implement push service (FCM/APNs) สามารถส่ง push ไปยัง wallet สำหรับ event offer/revocation/consent, จัดการ device token และ opt-in/opt-out", "ac": "1. Wallet ลงทะเบียน device token และรับ push ได้\n2. ส่ง push เมื่อมี offer/เพิกถอน/แจ้งเตือน PDPA\n3. ผู้ใช้เปิด/ปิดการรับ push ได้", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a wallet user, i want to รับการแจ้งเตือนแบบ push เมื่อมี credential offer ใหม่หรือ vc ถูกเพิกถอน, so that รับทราบและดำเนินการได้ทันที"}, "TESTING-05": {"id": "TESTING-05", "what": "ทดสอบความปลอดภัยระดับการตั้งค่าและวัดขีดความสามารถตั้งต้นของ Core Service ที่เพิ่งติดตั้ง", "out": "รู้ช่องโหว่และขีดความสามารถของฐานระบบก่อนเริ่มพัฒนาต่อยอด", "comp": "Quality & Compliance Testing", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Core Service Security & Load Baseline Test", "pri": "High", "pts": 5, "dep": "PLATFORM-02, ENGINE-01", "sprint": 0, "status": "Backlog", "ws": "Quality & Compliance Testing", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. ทดสอบความปลอดภัยระดับการตั้งค่าของ one-core และ VCVP Core ที่ติดตั้งใหม่ ครอบคลุม TLS, security header, พอร์ตที่เปิด, การจัดการ secret และค่า default ที่ติดมากับไลบรารี\n2. ทดสอบโหลดเพื่อวัดขีดความสามารถตั้งต้น (throughput การออกและตรวจ credential, เวลาตอบสนอง, จุดคอขวดของฐานข้อมูล) แล้วบันทึกเป็นค่าอ้างอิงสำหรับเทียบในรอบถัดไป\n3. สแกนช่องโหว่ของ dependency ที่ติดมากับ engine แล้วบันทึกรายการที่ต้องเฝ้าระวังตลอดโครงการ\n4. สรุปเป็นรายงานพร้อมข้อจำกัดที่ต้องแก้ก่อนขึ้นใช้จริง ส่งต่อให้ TESTING-02 ใช้เป็นฐานเปรียบเทียบ", "ac": "1. มีรายงานผลทดสอบความปลอดภัยระดับการตั้งค่า พร้อมรายการที่ต้องแก้และผู้รับผิดชอบ\n2. มีค่าอ้างอิงประสิทธิภาพตั้งต้น (throughput และเวลาตอบสนอง) ที่วัดซ้ำได้\n3. ปิดช่องโหว่ระดับ High/Critical ที่เกิดจากการตั้งค่าครบ\n4. ค่า default ที่ไม่เหมาะกับการใช้งานจริงถูกระบุครบและมีเจ้าของงานรับไปแก้", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a platform/security engineer, i want to ทดสอบความปลอดภัยและความสามารถรับโหลดของ core service ที่เพิ่งติดตั้ง, so that รู้ขีดความสามารถและช่องโหว่ของฐานระบบก่อนเริ่มพัฒนาต่อยอด"}, "TESTING-01": {"id": "TESTING-01", "what": "ทำ conformance test ของ OpenID4VCI และทดสอบกับ reference wallet ภายนอก", "out": "ยืนยันได้ว่า VC ที่เราออกใช้ร่วมกับระบบอื่นตามมาตรฐานได้จริง", "comp": "Quality & Compliance Testing", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Interoperability & Conformance Testing (Issuance)", "pri": "Medium", "pts": 5, "dep": "PROTOCOL-01, TRUST-01", "sprint": 5, "status": "Backlog", "ws": "Quality & Compliance Testing", "phase": "เฟส 2 · 2.3 ตรวจผ่าน Trust Registry", "scope": "จัดทำ conformance test suite ครอบคลุม did methods, credential formats, OpenID4VCI flow, revocation status list และ vct type metadata resolution พร้อมทดสอบกับ reference wallet ภายนอก และอ้างอิงเกณฑ์ ETDA (ส่วน OpenID4VP และการ resolve trust list สาธารณะอยู่ที่ TESTING-04)", "ac": "1. ผ่าน conformance test ของ OpenID4VCI\n2. ส่ง VC ให้ wallet ภายนอกอย่างน้อย 1 รายรับเข้ากระเป๋าได้สำเร็จ\n3. รายงานผลทดสอบ map กับเกณฑ์ ETDA และ W3C ครบถ้วนในส่วนของการออก VC\n4. ผ่านการทดสอบ resolve vct type metadata พร้อมตรวจค่า integrity", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a qa engineer, i want to ทดสอบ interoperability ของการออก vc กับ wallet ภายนอกตามมาตรฐาน openid4vci และ w3c, so that มั่นใจว่า vc ที่เราออกใช้งานร่วมกับ ecosystem ได้จริง"}, "TESTING-04": {"id": "TESTING-04", "what": "ขยาย conformance test ให้ครอบ OpenID4VP และทดสอบกับ reference verifier ภายนอก", "out": "ยืนยันได้ว่าขั้นตอนตรวจ VP ของเราทำงานร่วมกับระบบอื่นได้จริง", "comp": "Quality & Compliance Testing", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Interoperability & Conformance Testing (Verification)", "pri": "Medium", "pts": 3, "dep": "PROTOCOL-02, TESTING-01, TRUST-03", "sprint": 5, "status": "Backlog", "ws": "Quality & Compliance Testing", "phase": "เฟส 2 · 2.3 ตรวจผ่าน Trust Registry", "scope": "ขยาย conformance test suite จาก TESTING-01 ให้ครอบคลุม OpenID4VP flow, selective disclosure ของ SD_JWT ตอนแชร์ VP, การตรวจสถานะเพิกถอนระหว่างตรวจ และการ resolve trust list จาก endpoint สาธารณะ พร้อมทดสอบกับ reference verifier ภายนอก และอ้างอิงเกณฑ์ ETDA", "ac": "1. ผ่าน conformance test ของ O
