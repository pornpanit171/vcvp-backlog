ction"}, "PROT-06": {"id": "PROT-06", "what": "กำหนดเป้าโหลด ทดสอบ stress และหาคอขวด", "out": "รู้ว่าระบบรับได้เท่าไหร่ และต้องขยายตรงไหน", "comp": "Quality & Compliance Testing", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Performance & Load Testing", "pri": "Medium", "pts": 5, "dep": "PROT-04", "sprint": 8, "status": "Backlog", "ws": "Protocol & Security", "phase": "Phase 3 พร้อมเปิดใช้จริง", "scope": "1. กำหนดเป้าหมายรองรับโหลด (จำนวนการออก VC และตรวจ VP ต่อวินาที, ผู้ใช้พร้อมกัน)\n2. load/stress test ครอบ flow ออก VC และตรวจ VP รวมถึงการดึง status list จากภายนอก\n3. ระบุคอขวด (engine, ฐานข้อมูล, edge) และปรับ sizing/scaling ตามผล", "ac": "1. ระบบรองรับโหลดเป้าหมายโดย latency และ error rate อยู่ในเกณฑ์ที่กำหนด\n2. ระบุคอขวดของระบบได้ชัดเจนพร้อมแผนรองรับการขยาย", "sx": "quality assurance as a platform operator, i want to ทดสอบว่าระบบรองรับโหลดตามเป้าหมายได้, so that มั่นใจว่าเปิดใช้งานจริงแล้วไม่ล่มในช่วงที่มีผู้ใช้พร้อมกันจำนวนมาก"}}, "totals": {"comp": 19, "story": 70, "pts": 448}};
let view="svc", sel=null, sp=null, q="", collapsed={phase:{},sprint:{}}, openScope={};
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
const esc=(s)=>(s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('stats').innerHTML =
  `<div class="stat"><b>${D.totals.comp}</b> ชิ้นงาน</div><div class="stat"><b>${D.totals.story}</b> stories</div>
   <div class="stat"><b>${D.totals.pts}</b> points</div><div class="stat"><b>${D.sprints.length}</b> sprints</div>`;

const chips=document.getElementById('chips');
const spSel=el('<select class="sel" id="spSel"></select>');
spSel.innerHTML='<option value="">ทุก sprint</option>'+D.sprints.map(S=>`<option value="${S.n}">Sprint ${S.n}</option>`).join('');
spSel.onchange=()=>{sp=spSel.value?+spSel.value:null;render()};
chips.appendChild(spSel);
const cl=el('<button class="chip clear">ล้างตัวกรอง</button>');
cl.onclick=()=>{sp=null;q="";document.getElementById('q').value="";render()};chips.appendChild(cl);
document.getElementById('q').oninput=(e)=>{q=e.target.value.trim().toLowerCase();render()};
document.getElementById('tabA').onclick=()=>{view="svc";render()};
document.getElementById('tabB').onclick=()=>{view="road";render()};

const priCls=(p)=>({"Highest":"p-highest","High":"p-high","Medium":"p-medium","Low":"p-low"}[p]||"p-low");
const priB=(s)=>`<span class="b pri ${priCls(s.pri)}">${esc(s.pri)}</span>`;
const liveStatus=(s)=>s.status&&s.status.trim()&&s.status.trim()!=="Backlog";
const scopeBtn=(s)=>`<span class="more" data-sc="${s.id}">${openScope[s.id]?'▾':'▸'} ขอบเขตงาน</span>`;
const scopeBox=(s)=>openScope[s.id]?`<div class="scope"><b>คำอธิบายขอบเขตงาน (Technical Scope)</b>${esc(s.scope)}`
  +(s.ac?`<div class="acx"><b>#AC (Acceptance Criteria)</b>${esc(s.ac)}</div>`:'')+`</div>`:'';
function wireScope(root){root.querySelectorAll('.more').forEach(b=>b.onclick=(e)=>{
  e.stopPropagation();const id=b.dataset.sc;openScope[id]=!openScope[id];render();});}
const match=(s)=>!q||((s.id+" "+s.what+" "+s.out+" "+s.feature+" "+s.ws+" "+s.comp+" "+(s.phase||"")).toLowerCase().includes(q)||(s.sx||"").includes(q)||(s.scope||"").toLowerCase().includes(q)||(s.ac||"").toLowerCase().includes(q));
const vis=(s)=>match(s)&&(!sp||s.sprint===sp);

function render(){
  document.getElementById('tabA').classList.toggle('on',view==="svc");
  document.getElementById('tabB').classList.toggle('on',view==="road");
  const ss=document.getElementById('spSel');
  if(ss){ss.value=sp?String(sp):"";ss.classList.toggle('on',!!sp);}
  document.querySelector('.layout').classList.toggle('full',view==="road");
  document.getElementById('hint').innerHTML = view==="svc" ? ""
    : `<div class="note"><b>อ่านยังไง:</b> ไล่จาก Sprint 1 ลงมา ในแต่ละ sprint งาน "ลำดับ 1" เริ่มได้ทันที ส่วนลำดับถัดไปต้องรอลำดับก่อนหน้าเสร็จก่อน</div>`;
  document.getElementById('main').innerHTML="";
  view==="svc"?renderSvc():renderRoad();
  renderPanel();
}

function renderSvc(){
  const main=document.getElementById('main');
  D.groups.forEach(g=>{
    const z=el(`<div class="zone"><h2 style="background:${g.color}"><span>${esc(g.name)}</span><span>${g.comps.length} ชิ้น</span></h2><div class="cards"></div></div>`);
    const box=z.querySelector('.cards');
    g.comps.forEach(c=>{
      const hits=c.stories.filter(vis), pts=c.stories.reduce((a,s)=>a+s.pts,0);
      const cnt={},ptn={}; c.stories.forEach(s=>{cnt[s.sprint]=(cnt[s.sprint]||0)+1;ptn[s.sprint]=(ptn[s.sprint]||0)+s.pts});
      let tl=""; for(let i=1;i<=8;i++){
        tl+=`<i class="${cnt[i]?'has':''} ${(sp===i&&cnt[i])?'hit':''}" title="Sprint ${i}${cnt[i]?` | ${cnt[i]} stories | ${ptn[i]} pts`:' | ไม่มีงาน'}">${cnt[i]||""}</i>`}
      const card=el(`<div class="card ${sel===c.name?'sel':''} ${hits.length?'':'dim'}" style="border-left-color:${g.color}">
        <div class="nm">${esc(c.name)}</div>
        <div class="gl">${esc(c.gloss||"")}</div>
        <div class="mt">${c.stories.length} stories | ${pts} pts${(q||sp)?` | <b style="color:#d85a30">ตรง ${hits.length}</b>`:''}</div>
        <div class="tl">${tl}</div></div>`);
      card.onclick=()=>{sel=(sel===c.name?null:c.name);render()};
      box.appendChild(card);
    });
    main.appendChild(z);
  });
}

function renderRoad(){
  const main=document.getElementById('main');
  const ctl=el('<div class="rctl"><span>คลิกที่แถบ Phase หรือ SPRINT เพื่อย่อ/ขยาย</span><span class="fill"></span>'
    +'<button class="chip" id="expAll">ขยายทั้งหมด</button><button class="chip" id="colAll">ย่อทั้งหมด</button></div>');
  main.appendChild(ctl);
  ctl.querySelector('#expAll').onclick=()=>{collapsed={phase:{},sprint:{}};render()};
  ctl.querySelector('#colAll').onclick=()=>{collapsed={phase:{},sprint:{}};D.sprints.forEach(S=>{collapsed.phase[S.phase]=true});render()};
  let curPhase=null;
  D.sprints.forEach(S=>{
    if(S.phase!==curPhase){
      curPhase=S.phase;
      const inPh=D.sprints.filter(x=>x.phase===curPhase);
      const st=inPh.reduce((a,x)=>a+x.count,0), pt=inPh.reduce((a,x)=>a+x.pts,0);
      const pcol=!q&&!!collapsed.phase[curPhase], key=curPhase;
      const ph=el(`<div class="phase"><span style="font-weight:600;opacity:1;font-size:14px"><i class="cv">${pcol?'▸':'▾'}</i>${esc(curPhase)}</span>`
        +`<span>Sprint ${inPh[0].n}-${inPh[inPh.length-1].n} | ${st} stories | ${pt} points${pcol?' | (ย่อไว้)':''}</span></div>`);
      ph.onclick=()=>{collapsed.phase[key]=!collapsed.phase[key];render()};
      main.appendChild(ph);
    }
    if(!q&&collapsed.phase[S.phase]) return;
    const any=S.waves.some(w=>w.some(x=>vis(D.stories[x.id])));
    const scol=!q&&!!collapsed.sprint[S.n];
    const blk=el(`<div class="sprint ${any?'':'dim'}">
      <div class="sh"><b><i class="cv">${scol?'▸':'▾'}</i>SPRINT ${S.n}</b><span>${S.count} stories | ${S.pts} points | ${S.waves.length} ลำดับ</span></div>
      <div class="goal"><b>เป้าหมายของ SPRINT นี้</b>${esc(S.goal)}</div></div>`);
    blk.querySelector('.sh').onclick=()=>{collapsed.sprint[S.n]=!collapsed.sprint[S.n];render()};
    if(!scol){
      S.waves.forEach((w,i)=>{
        const wp=w.reduce((a,x)=>a+D.stories[x.id].pts,0);
        const wv=el(`<div class="wave"><div class="wh"><span>ลำดับ ${i+1} ${i===0?'(เริ่มได้ทันที)':'(รอลำดับ '+i+' เสร็จก่อน)'}</span><span>${w.length} งาน | ${wp} pts</span></div></div>`);
        w.forEach(x=>{
          const s=D.stories[x.id];
          const row=el(`<div class="wrow ${vis(s)?'':'dimr'}">
            <div class="wleft"><span class="sid" data-tag="[${esc(s.comp)}] ${s.id}">${s.id}</span></div>
            <div class="wbody">
              <div>${esc(s.what)}<span class="svc" style="background:${s.color}">${esc(s.comp)}</span></div>
              <div class="o">${esc(s.out)}</div>
              ${x.blockers.length?`<div class="blk">รอ ${x.blockers.join(', ')} ใน sprint เดียวกันก่อน</div>`:''}
              <div class="f">${priB(s)} ${s.pts} pts${liveStatus(s)?" | "+esc(s.status):""} ${scopeBtn(s)}</div>
              ${scopeBox(s)}
            </div></div>`);
          row.querySelector('.sid').onclick=()=>{sel=s.comp;view="svc";render();window.scrollTo({top:0,behavior:'smooth'})};
          wireScope(row);
          wv.appendChild(row);
        });
        blk.appendChild(wv);
      });
    }
    main.appendChild(blk);
  });
}

function renderPanel(){
  const p=document.getElementById('panel');
  let g=null,c=null;
  D.groups.forEach(gg=>gg.comps.forEach(cc=>{if(cc.name===sel){g=gg;c=cc}}));
  if(!c){p.innerHTML='<div class="empty">'+(view==="svc"?'เลือกชิ้นงานจากด้านซ้ายเพื่อดูรายละเอียด':'คลิกที่รหัสงานเพื่อดูรายละเอียดของ service นั้น')+'</div>';return}
  const pts=c.stories.reduce((a,s)=>a+s.pts,0);
  let h=`<div class="ph" style="border-left-color:${g.color}"><h3>${esc(c.name)}</h3><div class="gl">${esc(c.gloss||"")}</div>
      <div class="zn">${esc(g.name)} | ${c.stories.length} stories | ${pts} pts</div></div>
    <div class="out"><b>Output</b>${esc(c.output)}</div>`;
  c.stories.slice().sort((a,b)=>a.sprint-b.sprint||a.id.localeCompare(b.id)).forEach(s=>{
    h+=`<div class="st ${vis(s)?'':'dimr'}">
      <div class="r1"><span class="sid" data-tag="[${esc(c.name)}] ${s.id}">${s.id}</span>
        ${priB(s)}<span class="b sp">Sprint ${s.sprint}</span><span class="b pt">${s.pts} pts</span>
        ${liveStatus(s)?`<span class="b pt">${esc(s.status)}</span>`:""}${scopeBtn(s)}</div>
      <div class="w">${esc(s.what)}</div><div class="o">${esc(s.out)}</div>
      <div class="f">${esc(s.feature)}${s.dep&&s.dep.toLowerCase()!=='none'?' | ต้องมีก่อน: '+esc(s.dep):''}</div>${scopeBox(s)}</div>`;
  });
  h+=`<div class="toast" id="toast"></div>`;
  p.innerHTML=h;
  p.querySelectorAll('.sid').forEach(b=>b.onclick=()=>copyTag(b));
  wireScope(p);
}
function copyTag(b){
  navigator.clipboard.writeText(b.dataset.tag).then(()=>{
    let t=document.getElementById('toast');
    if(t){t.textContent='คัดลอกแล้ว: '+b.dataset.tag;t.style.display='block';setTimeout(()=>t.style.display='none',1600)}})}
render();
</script></body></html>
