<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Tahoma,"Sarabun",sans-serif;background:#f7f7f5;color:#26251f;font-size:14px;line-height:1.65}
.wrap{max-width:1500px;margin:0 auto;padding:20px}
header h1{font-size:21px;font-weight:600;color:#1f4e78}
header .sub{color:#77756d;font-size:12.5px;margin-top:2px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{background:#fff;border:1px solid #e3e1d9;border-radius:8px;padding:6px 12px;font-size:12.5px}
.stat b{font-size:16px;color:#1f4e78}
.tabs{display:flex;gap:6px;margin-top:16px;border-bottom:2px solid #e3e1d9}
.tab{border:none;background:none;padding:9px 16px;font-size:13.5px;font-family:inherit;cursor:pointer;color:#77756d;border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:600}
.tab.on{color:#1f4e78;border-bottom-color:#1f4e78}
.note{margin-top:12px;background:#fce4d6;border-left:3px solid #d85a30;padding:9px 13px;border-radius:0 6px 6px 0;font-size:12.5px;color:#843c0c}
.legend{margin-top:8px;background:#fff;border:1px solid #e3e1d9;border-radius:7px;padding:8px 12px;font-size:12px;color:#5f5e5a;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.legend .lg{display:flex;gap:2px}
.legend .lg i{width:15px;height:15px;border-radius:2px;background:#f0efe9;font-style:normal;font-size:9.5px;color:#a09e95;display:flex;align-items:center;justify-content:center}
.legend .lg i.has{background:#bdd7ee;color:#1f4e78;font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 6px}
#q{flex:1;min-width:220px;padding:9px 13px;border:1px solid #d8d6cd;border-radius:8px;font-size:13.5px;font-family:inherit;background:#fff}
#q:focus{outline:2px solid #9dc3e6;outline-offset:-1px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid #d8d6cd;background:#fff;border-radius:20px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit}
.chip.on{background:#1f4e78;color:#fff;border-color:#1f4e78}
.chip.clear{color:#a09e95}
.fbar{margin-top:10px;background:#eef3f8;border:1px solid #cfe0ef;border-radius:8px;padding:8px 13px;font-size:12.5px;color:#1f4e78;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fbar .x{margin-left:auto}
.emptybig{background:#fff;border:1px dashed #d8d6cd;border-radius:9px;padding:44px 20px;text-align:center;color:#a09e95;font-size:13.5px;line-height:2}
.fnote{padding:7px 15px;background:#f7f7f5;border-bottom:1px solid #eeece5;font-size:11.5px;color:#77756d}
.sel{padding:8px 12px;border:1px solid #d8d6cd;border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:#26251f;cursor:pointer}
.sel:focus{outline:2px solid #9dc3e6;outline-offset:-1px}
.sel.on{background:#1f4e78;color:#fff;border-color:#1f4e78}
.layout{display:grid;grid-template-columns:1fr 440px;gap:18px;margin-top:14px;align-items:start}
@media(max-width:1080px){.layout{grid-template-columns:1fr}}
.layout.full{grid-template-columns:1fr}
.layout.full .panel{display:none}
.zone{margin-bottom:16px}
.zone h2{font-size:13px;font-weight:600;color:#fff;padding:6px 12px;border-radius:7px 7px 0 0;display:flex;justify-content:space-between;gap:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:9px;padding:10px;background:#fff;border:1px solid #e3e1d9;border-top:none;border-radius:0 0 7px 7px}
.card{border:1px solid #e3e1d9;border-radius:8px;padding:10px 11px;cursor:pointer;background:#fff;transition:.12s;border-left-width:3px}
.card:hover{border-color:#9dc3e6;box-shadow:0 2px 8px rgba(0,0,0,.07);transform:translateY(-1px)}
.card.sel .nm{font-weight:700}
.card.dim{opacity:.28}
.card .nm{font-weight:600;font-size:13px;line-height:1.35}
.card .mt{color:#77756d;font-size:11.5px;margin-top:3px}
.tl{display:flex;gap:2px;margin-top:8px}

.tl i.hit{outline:1.5px solid #d85a30;outline-offset:-1.5px}
.rctl{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:12px;color:#77756d;flex-wrap:wrap}
.rctl .fill{flex:1}
.cv{font-style:normal;display:inline-block;width:15px;opacity:.85}

.phase{background:#1f4e78;color:#fff;padding:10px 15px;border-radius:8px;margin:20px 0 10px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.phase span{font-weight:400;opacity:.8;font-size:12.5px}
.gl{color:#77756d;font-size:12.5px;font-weight:400;margin-top:1px}
.sprint{background:#fff;border:1px solid #e3e1d9;border-radius:9px;margin-bottom:14px;overflow:hidden}
.sprint.dim{opacity:.35}
.sprint .sh{background:#dfe6ee;color:#1f3350;border-bottom:1px solid #cbd6e3;padding:8px 14px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sprint .sh b{font-size:15px}
.sprint .sh span{font-size:12px;color:#4a627f}
.goal{background:#eaf3de;border-bottom:1px solid #c0dd97;padding:9px 14px;font-size:15px;color:#4a5c1f}
.goal b{font-size:13px;color:#4f7020;font-weight:700;margin-right:7px}
.wave{border-top:1px solid #eeece5}
.wh{background:#f3f2ec;padding:5px 14px;font-size:11.5px;color:#5f5e5a;font-weight:600;display:flex;justify-content:space-between}
.wrow{display:flex;gap:10px;padding:9px 14px;border-top:1px solid #f4f3ee;align-items:flex-start}
.wrow.dimr{opacity:.28}
.wleft{flex:0 0 116px}
.wbody{flex:1;min-width:0}
.wbody>div:first-child{font-size:15px}
.svc{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:10px;color:#fff;margin-left:6px;vertical-align:1px}
.blk{font-size:13px;color:#c05621;margin-top:2px}
.panel{background:#fff;border:1px solid #e3e1d9;border-radius:9px;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}
.panel .ph{padding:13px 15px;border-bottom:1px solid #eeece5;border-left:4px solid #ccc}
.panel h3{font-size:16px;font-weight:600}
.panel .zn{font-size:11.5px;color:#77756d;margin-top:1px}
.out{margin:11px 15px;background:#eaf3de;border:1px solid #c0dd97;border-radius:7px;padding:9px 12px;font-size:14.5px;color:#4a5c1f}
.out b{display:block;font-size:11px;color:#4f7020;margin-bottom:2px;font-weight:600}
.st{border-top:1px solid #eeece5;padding:11px 15px}
.st.dimr{opacity:.3}
.st .r1,.wrow .r1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sid{font-weight:600;font-size:12.5px;color:#1f4e78;cursor:pointer;border:1px dashed #bdd7ee;border-radius:5px;padding:1px 6px;background:#f4f9fd;white-space:nowrap}
.sid:hover{background:#1f4e78;color:#fff}
.b{font-size:10.5px;border-radius:4px;padding:1px 6px;border:1px solid}
.b.sp{background:#eef3f8;border-color:#d5e3ef;color:#1f4e78}
.b.pt{background:#f3f2ec;border-color:#e3e1d9;color:#5f5e5a}
.b.pri{font-weight:600}
.b.p-highest{background:#fceaea;border-color:#eeb4b4;color:#a32d2d}
.b.p-high{background:#fdf1e4;border-color:#f2cda2;color:#8a4a10}
.b.p-medium{background:#eef5e6;border-color:#c6dfae;color:#3b6d11}
.b.p-low{background:#f1efe8;border-color:#d3d1c7;color:#5f5e5a}
.w{margin-top:5px;font-size:15px}
.o{margin-top:3px;font-size:14.5px;color:#3a6b2f;padding-left:11px;border-left:2px solid #cfe3c4}
.f{margin-top:4px;font-size:13px;color:#a09e95}
.more{font-size:11px;color:#1f4e78;cursor:pointer;border:1px solid #d5e3ef;background:#f4f9fd;border-radius:4px;padding:1px 7px;user-select:none}
.more:hover{background:#1f4e78;color:#fff}
.scope{margin-top:7px;background:#f7f7f5;border:1px solid #e3e1d9;border-left:3px solid #9dc3e6;border-radius:0 6px 6px 0;padding:8px 11px;font-size:14px;white-space:pre-line;color:#3d3c37;line-height:1.7}

.empty{padding:34px 18px;text-align:center;color:#a09e95;font-size:13px}
.toast{position:sticky;bottom:14px;margin:0 15px 14px;background:#1d9e75;color:#fff;padding:7px 12px;border-radius:7px;font-size:12.5px;display:none}
footer{margin-top:22px;color:#a09e95;font-size:11.5px;text-align:center}

<script>
const D = {"groups": [{"name": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "comps": [{"name": "Engine Layer (one-core)", "gloss": "ตั้งค่าและดูแล engine ที่ใช้ออก/ตรวจ VC", "output": "มี engine VC/VP ที่ใช้งานได้จริง ตั้งค่าได้ตามมาตรฐานที่ต้องการ และดูแลรุ่นของ engine เองได้", "stories": [{"id": "ENGINE-01", "what": "ตั้งค่า provider ที่เปิดใช้ และย้าย secret/KEK ไปเก็บใน KMS", "out": "เปิด-ปิดความสามารถของ engine ได้ผ่าน config โดยไม่ต้องแก้โค้ด", "comp": "Engine Layer (one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "one-core Configuration & Secrets Management", "pri": "Highest", "pts": 8, "dep": "PLATFORM-02, PLATFORM-04", "sprint": 0, "status": "Backlog", "ws": "Engine Layer (one-core)", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. ตรวจสอบและตั้งค่า provider instances ที่เปิดใช้ในระบบ ผ่าน config YAML ของ one-core ให้ครบทุกหมวด (did, format, revocation, keyAlgorithm, keyStorage, issuanceProtocol/verificationProtocol, transport, trustManagement, task) โดย transport, trustManagement และ task กำหนดจบใน story นี้ พร้อมตั้งตัวเรียก task ตามรอบเวลา (one-core เปิดเส้น /api/task/v1/run ให้ แต่ไม่มีตัวจับเวลาในตัว) ส่วนหมวดอื่นดูรายละเอียดใน story ที่เกี่ยวข้อง\n2. ย้าย KEK/encryption key ของ INTERNAL key storage และ DB credential เก็บใน KMS/secrets manager, inject ตอน runtime, rotate KEK ได้ (ต้องวางแผน re-encrypt key ใน DB)\n3. ใช้ key storage แบบ KMS ที่ต้องพัฒนาเพิ่มเอง (AWS/GCP ใน KEY-03) เพื่อให้ private key ไม่ออกนอก KMS\nหมายเหตุ: one-core มี Azure Key Vault ในตัวแต่เราไม่ใช้\nPKCS#11 ยังเป็น stub คือยังไม่มีการพัฒนา ต้องพัฒนาเพิ่ม\n4. แยกค่า config ต่อ environment (Dev/UAT/PreProd/Prod)\n5. ทดสอบ/verify ตัว one-core จะมี fail-fast เมื่อ config ผิดตอน startup (ความสามารถในตัว one-core) และ VCVP Core/ops เรียก /api/config/v1 ตรวจว่า provider ที่ active ตรงที่คาดหวัง", "ac": "1. เปิด/ปิด provider instance (DID/format/revocation/keyStorage/protocol/task) ผ่าน config YAML โดยไม่แก้โค้ด\n2. KEK/encryption key ของ key storage และ DB credential ไม่อยู่ใน repo/config และดึงจาก KMS/vault ตอน runtime\n3. รองรับการ rotate KEK โดยกุญแจ/ข้อมูลเดิมยังถอดได้ และจำกัดสิทธิ์+audit การเข้าถึง KEK\n4. ใส่ config ผิดแล้ว one-core ไม่ start (fail-fast) และเรียก /api/config/v1 ได้รายการ provider ที่ active ตรงกับที่ตั้งค่า\n5. task ที่เปิดใช้ถูกเรียกตามรอบเวลาที่กำหนดจริง และตรวจสอบได้ว่ารันสำเร็จหรือล้มเหลว", "sx": "engine และ adapter as a platform engineer, i want to บริหาร configuration และ secret ของ one-core แบบรวมศูนย์ต่อ environment, so that เปิด/ปิด provider และจัดการคีย์ลับได้ปลอดภัยและยืดหยุ่น"}, {"id": "ENGINE-03", "what": "เปิดใช้อัลกอริทึม EdDSA / ECDSA / ML-DSA", "out": "เลือกอัลกอริทึมลงนามได้ตามงาน รวมถึงแบบรองรับยุคควอนตัม", "comp": "Engine Layer (one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Key Algorithm Provider", "pri": "Highest", "pts": 5, "dep": "PLATFORM-02", "sprint": 0, "status": "Backlog", "ws": "Engine Layer (one-core)", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. ตั้งค่า key algorithm ใน one-core ผ่าน config โดยเปิด EdDSA/ECDSA/ML-DSA และปิดตัวที่ไม่ได้ใช้\n2. เลือกอัลกอริทึมต่อ use case ได้โดยไม่แก้โค้ด\n3. ทดสอบ sign/verify", "ac": "1. sign/verify สำเร็จครบทุกอัลกอริทึมผ่าน one-core\n2. เลือกอัลกอริทึมผ่าน config ได้", "sx": "engine และ adapter as a security engineer, i want to ให้ key algorithm provider รองรับ eddsa, ecdsa และ ml-dsa (post-quantum), so that ระบบเลือกใช้อัลกอริทึมได้ยืดหยุ่นและรองรับยุคหลังควอนตัม"}, {"id": "ENGINE-04", "what": "fork one-core และวาง process sync upstream", "out": "รักษา patch ของเราไว้ได้ ขณะที่ยัง sync upstream release ใหม่ได้ต่อเนื่อง โดยไม่เกิด drift", "comp": "Engine Layer (one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "one-core Fork Setup & Upstream Maintenance", "pri": "High", "pts": 8, "dep": "PLATFORM-02", "sprint": 0, "status": "Backlog", "ws": "Engine Layer (one-core)", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. Fork repo one-core (Apache 2.0) และ ตั้ง CI/CD ของ fork + legal check (NOTICE/trademark/patent)\n2. Pin upstream version และ automated upstream-sync test\n3. เก็บการแก้เป็น patch queue แบบ rebase บน upstream (ไม่ merge ปน) เพื่อนับ patch และแก้ conflict ทีละตัวได้\n4. คุม drift ด้วยทะเบียน patch (เจ้าของ/เหตุผล/เงื่อนไขการลบ) และเพดานจำนวน patch โดยประเมินรายกรณีว่า patch ไหนควรส่ง PR กลับ upstream", "ac": "1. มี fork repo และ CI ที่ build/test ผ่าน\n2. sync upstream แล้ว patch ของเรายังอยู่ และ test ผ่าน\n3. มี runbook sync upstream และทะเบียน patch ที่ระบุไฟล์ที่แก้ (Apache 2.0 #4b)", "sx": "engine และ adapter as a devops/backend engineer, i want to ตั้งและดูแล fork ของ one-core, so that แก้ one-core ได้และ sync กับ upstream ระยะยาวโดยไม่พัง"}, {"id": "ENGINE-07", "what": "หา gap แล้วปรับ engine ตามข้อกำหนดกฎหมายไทย/ETDA", "out": "engine ทำงานตรงข้อกำหนด ETDA พร้อมเอกสารอ้างอิงสำหรับการตรวจสอบ", "comp": "Engine Layer (one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Thai Law / ETDA Compliance Adaptation", "pri": "High", "pts": 13, "dep": "PLATFORM-02, ENGINE-04", "sprint": 0, "status": "Backlog", "ws": "Engine Layer (one-core)", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. รวบรวมข้อกำหนดตามกฎหมายไทย/ETDA ที่กระทบ one-core (เช่น อัลกอริทึม/crypto ที่รับรอง, credential profile, trust framework, data residency)\n2. วิเคราะห์ gap ระหว่าง one-core ปัจจุบันกับข้อกำหนด\n3. implement/ปรับแต่ง one-core ตาม gap (การจัดการ fork ดู ENGINE-04)\n4. จัดทำเอกสาร mapping ความสอดคล้องสำหรับ audit (หมายเหตุ: ต้องแตกเป็น sub-task เมื่อข้อกำหนดชัด)", "ac": "1. มีรายการข้อกำหนด ETDA/กฎหมายไทยที่กระทบ และ gap analysis\n2. one-core ปรับให้รองรับข้อกำหนดที่ระบุครบ\n3. มีเอกสาร mapping ความสอดคล้องสำหรับยื่น/ตรวจรับ", "sx": "engine และ adapter as a compliance/backend engineer, i want to ปรับแต่ง/เพิ่มความสามารถใน one-core ให้สอดคล้องกฎหมายไทย (etda/pdpa), so that ระบบผ่านเกณฑ์กำกับดูแลของไทยก่อนใช้งานจริง"}, {"id": "ENGINE-02", "what": "เปิดใช้ formatter SD-JWT", "out": "ออก VC แบบ SD-JWT ที่ปกปิดข้อมูลบางส่วนได้", "comp": "Engine Layer (one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Credential Formatter Provider (SD_JWT)", "pri": "Highest", "pts": 5, "dep": "KEY-01, EDGE-03", "sprint": 2, "status": "Backlog", "ws": "Engine Layer (one-core)", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. ตั้งค่า formatter ใน one-core ผ่าน config โดยเปิดรูปแบบ SD_JWT และปิดตัวที่ไม่ได้ใช้ (SD_JWT มี @context และชั้นห่อ vc ตาม W3C VCDM ส่วน SD_JWT_VC ของ IETF ใช้ vct แทนและไม่มี @context จึงเป็นคนละ provider กัน เราเลือก SD_JWT เพราะ ขมธอ. 24-2563 บังคับ @context)\n2. integrate การออก VC ให้เรียกผ่าน VCVP Core\n3. ทดสอบออก VC (SD_JWT) และ verify proof ได้\n4. งานส่วน vct เป็นงานมีเงื่อนไข ใช้เฉพาะเมื่อมีข้อกำหนดให้เปิดใช้รูปแบบ SD_JWT_VC เพิ่มในภายหลัง ซึ่งไม่ใช่แผนปัจจุบัน ถ้าเปิดใช้ ต้องกำหนดรูปแบบ vct ของใบรับรองแต่ละประเภทให้เป็น URL บน domain ของเราเอง และเผยแพร่ SD-JWT VC Type Metadata ที่ URL นั้น พร้อม vct#integrity เพื่อให้ผู้ตรวจยืนยันได้ว่า metadata ไม่ถูกแก้ภายหลัง โดยต้องเผื่อไว้ด้วยว่า one-core บังคับให้ URL ของ vct ดึงได้จริง ถ้าดึงไม่ได้จะออกบัตรไม่ได้เลย", "ac": "1. ออก VC รูปแบบ SD_JWT ที่มี disclosure array ครบ และมี @context ตามที่ ขมธอ. 24-2563 กำหนด\n2. ออก VC รูปแบบ SD_JWT ผ่าน API ของ VCVP Core ได้ โดย client ไม่เรียก one-core โดยตรง\n3. ข้อนี้วัดเมื่อเปิดใช้รูปแบบ SD_JWT_VC เท่านั้น คือ resolve vct ของ VC ที่ออก แล้วได้ type metadata ที่ตรงกับค่า integrity ที่ฝังอยู่ใน VC ตราบใดที่ยังใช้ SD_JWT อย่างเดียว ข้อนี้ถือว่าไม่อยู่ในขอบเขตการวัด", "sx": "engine และ adapter as an issuer developer, i want to ใช้ credential formatter provider ที่รองรับ sd_jwt, so that ออก vc รูปแบบ sd_jwt ที่บรรจุ claim ตามที่ issuer กำหนด (schema) และรองรับ selective disclosure"}, {"id": "ENGINE-05", "what": "เปิดใช้ formatter mdoc ตาม ISO 18013-5", "out": "ออก mDL ที่ใช้ร่วมกับระบบสากลได้", "comp": "Engine Layer (one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "mDoc / ISO 18013-5 (mDL) Format Support", "pri": "High", "pts": 5, "dep": "ENGINE-02, ENGINE-03", "sprint": 3, "status": "Backlog", "ws": "Engine Layer (one-core)", "phase": "เฟส 2 · 2.1 Issuer core", "scope": "1. เปิดใช้ formatter mso_mdoc (ISO/IEC 18013-5) ใน one-core\n2. เปิดการออก mDoc เป็น API ของ VCVP Core โดย client ไม่เรียก one-core โดยตรง\n3. ทดสอบออก mDoc (MSO ลงนาม) และนำเสนอผ่าน mdoc-OpenID4VP", "ac": "1. ออก VC mDoc (mso_mdoc) ที่มี MSO ลงนามถูกต้อง\n2. verify mDoc และ data elements ได้\n3. นำเสนอ mDoc ผ่าน OpenID4VP ได้", "sx": "engine และ adapter as an issuer developer, i want to ออกใบรับรองรูปแบบ mdoc (iso/iec 18013-5) นอกเหนือจาก sd-jwt, so that รองรับใบขับขี่ดิจิทัล (mdl) และ use case ตามมาตรฐาน iso/etda"}, {"id": "ENGINE-06", "what": "จัดการ certificate chain ของ mDoc (IACA / Document Signer)", "out": "mDoc ที่ออกถูกตรวจสอบได้จริงโดย verifier ภายนอก", "comp": "Engine Layer (one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Document Signer Certificate (mDoc / ISO 18013-5)", "pri": "Medium", "pts": 8, "dep": "ENGINE-05", "sprint": 6, "status": "Backlog", "ws": "Engine Layer (one-core)", "phase": "เฟส 3 · 3.1 Final test", "scope": "1. จัดการ certificate chain สำหรับ mDoc (IACA / Document Signer) ตาม ISO/IEC 18013-5\n2. ผูก certificate กับกุญแจขององค์กร แจ้งเตือนเมื่อใกล้หมดอายุ และต่ออายุก่อนหมดอายุ\n3. เผยแพร่/แลกเปลี่ยน trust anchor ให้ verifier ใช้ตรวจสอบได้\n4. กำหนดวิธีเพิกถอน mDoc ซึ่งใช้กลไกคนละแบบกับ SD-JWT (ISO 18013-5 อิง certificate ไม่ใช่ Bitstring Status List) โดยเผยแพร่รายการเพิกถอน certificate ให้ verifier ตรวจได้", "ac": "1. mDoc ที่ออกมี certificate chain ที่ verifier ตรวจสอบผ่าน\n2. certificate ใกล้หมดอายุมีการแจ้งเตือนและต่ออายุได้ โดย mDoc ที่ออกไปแล้วยังตรวจได้\n3. เพิกถอน Document Signer certificate แล้ว verifier ภายนอกตรวจ mDoc ที่ออกด้วย certificate นั้นได้ผลเป็นไม่ผ่าน", "sx": "  และ authorization code flow\n3. ตรวจ proof of possession ก่อนออก VC", "sx": "ด่านหน้าสาธารณะ as an integration engineer, i want to เปิดช่องทาง openid4vci สำหรับการรับมอบ vc, so that wallet รับ vc จาก issuer ได้ตามมาตรฐานสากล"}, {"id": "PROTOCOL-02", "what": "เปิด flow ยื่น/ตรวจ VP ตาม OpenID4VP พร้อมป้องกันการยื่นซ้ำ (replay)", "out": "wallet ยื่น VP ให้ verifier ได้อย่างปลอดภัย", "comp": "SSI Protocol Service", "group": "ด่านหน้าสาธารณะ (รับจาก wallet และคนภายนอก)", "color": "#d85a30", "feature": "OpenID4VP (Credential Presentation)", "pri": "Highest", "pts": 8, "dep": "WALLET-03, ADAPTER-02, EDGE-03", "sprint": 3, "status": "Backlog", "ws": "SSI Protocol Service", "phase": "เฟส 2 · 2.1 Issuer core", "scope": "1. ตั้งค่า verificationProtocol ใน one-core ผ่าน config โดยเปิดเวอร์ชัน OpenID4VP ที่ตกลงกับ wallet ปลายทาง และปิดเวอร์ชันที่ไม่ได้ใช้ (one-core มีให้เลือกหลายเวอร์ชัน การเลือกเป็นตัวกำหนดว่า wallet เจ้าไหนใช้งานกับเราได้)\n2. integrate การยื่น/ตรวจ VP ให้ทำผ่าน VCVP Core (VERIFICATION-01)\n3. ทดสอบ flow ยื่น VP และ กัน replay (nonce/audience)\n4. endpoint และ metadata ที่ wallet มองเห็น ต้องอยู่บน domain ของเราเอง (ดู EDGE-03) เพื่อไม่ผูกกับ engine\n5. กำหนดวิธีพิสูจน์ตัวตนผู้ขอตรวจตามมาตรฐาน OpenID4VP (client_id_scheme) โดยฝั่งเราลงนามคำขอตรวจด้วยกุญแจของหน่วยงาน และฝั่ง wallet ต้องตรวจลายเซ็นของคำขอก่อนแสดงชื่อผู้ขอและก่อนขอความยินยอม ถ้าตรวจไม่ผ่านให้ปฏิเสธพร้อมเตือนผู้ใช้ โดยเลือกวิธีผ่าน config ได้โดยไม่แก้โค้ด (one-core รองรับ redirect_uri / verifier_attestation / did / x509_san_dns) และเทียบตัวตนที่ยืนยันได้นั้นกับทะเบียนหน่วยงานที่เชื่อถือได้ (TRUST-03) แล้วแสดงผลให้ผู้ถือเห็นก่อนกดยินยอม กรณีไม่อยู่ในทะเบียนให้เตือนชัดเจนและต้องยืนยันเพิ่มอีกครั้ง แต่ไม่ปิดกั้นการยื่น เพราะเป็นสิทธิ์ตัดสินใจของเจ้าของข้อมูล (ทะเบียนที่ wallet ใช้มาจาก endpoint สาธารณะที่ TRUST-03 เผยแพร่ ความสามารถส่วนเทียบทะเบียนจึงเริ่มใช้ได้เมื่อ TRUST-03 เสร็จ ส่วนการตรวจลายเซ็นคำขอทำได้ตั้งแต่ sprint นี้)", "ac": "1. Verifier ส่ง request และรับ VP กลับได้สำเร็จ\n2. ตรวจ nonce/audience กัน replay\n3. รองรับ VP ที่ผ่าน selective disclosure\n4. กรณีคำขอตรวจที่ลายเซ็นไม่ถูกต้องหรือไม่มีลายเซ็น wallet จะแสดงคำเตือนว่ายืนยันตัวตนผู้ขอไม่ได้ และยื่น VP ต่อไม่ได้\n5. ผู้ขอตรวจที่ไม่อยู่ในทะเบียนหน่วยงานที่เชื่อถือได้ wallet แสดงคำเตือนและต้องให้ผู้ถือยืนยันเพิ่มอีกครั้งก่อนจึงยื่น VP ได้ (ทดสอบข้อนี้ได้เมื่อ TRUST-03 เผยแพร่ทะเบียนแล้ว)", "sx": "ด่านหน้าสาธารณะ as an integration engineer, i want to เปิดช่องทาง openid4vp สำหรับการยื่นตรวจ vp, so that verifier ขอและรับ vp จาก wallet ได้ตามมาตรฐานสากล"}, {"id": "PROTOCOL-03", "what": "ให้กระเป๋าสร้างและให้ผู้ตรวจตรวจ Key Binding JWT ที่ผูก nonce, aud, sd_hash และ iat", "out": "บัตรที่ถูกคัดลอกไปใช้ต่อยื่นผ่านไม่ได้", "comp": "SSI Protocol Service", "group": "ด่านหน้าสาธารณะ (รับจาก wallet และคนภายนอก)", "color": "#d85a30", "feature": "Key Binding JWT (Holder Proof of Possession)", "pri": "Highest", "pts": 5, "dep": "PROTOCOL-02, IDENTITY-06", "sprint": 3, "status": "Backlog", "ws": "SSI Protocol Service", "phase": "เฟส 2 · 2.1 Issuer core", "scope": "1. ฝั่งกระเป๋าสร้าง Key Binding JWT (typ = kb+jwt) ทุกครั้งที่ยื่น VP โดยเซ็นด้วยกุญแจในเครื่องที่ผูกกับ cnf ในตัว VC\n2. KB-JWT ต้องมีครบ 4 ฟิลด์ nonce (ค่าสุ่มจากผู้ตรวจ ใช้ซ้ำไม่ได้), aud (ผูกกับผู้ตรวจรายนี้), sd_hash (ผูกกับชุด disclosure รอบนี้), iat (เวลาที่เซ็น)\n3. ฝั่งผู้ตรวจตรวจลายเซ็นกับ public key ใน cnf ของ VC แล้วตรวจ nonce ว่าไม่ซ้ำ, aud ว่าเป็นตัวเอง, sd_hash ว่าตรงกับ disclosure ที่ได้รับ และ iat ว่าอยู่ในช่วงเวลาที่ยอมรับ\n4. ฝั่ง VCVP Core ต้องฝัง cnf ลงในบัตรตอนออก VC ในรูปแบบ SD_JWT ที่ใช้จริง และต้องยังฝังได้ถูกต้องด้วยถ้าเปิดใช้ SD_JWT_VC เพิ่มภายหลัง\n5. เก็บ nonce ที่ใช้แล้วเพื่อกันการยื่นซ้ำ พร้อมกำหนดอายุและวิธีล้าง", "ac": "1. VP ที่ไม่มี KB-JWT ถูกปฏิเสธ\n2. VP ที่ KB-JWT เซ็นด้วยกุญแจที่ไม่ตรงกับ cnf ถูกปฏิเสธ\n3. การยื่น VP ซ้ำด้วย nonce เดิมถูกปฏิเสธ\n4. VP ที่ aud ไม่ตรงกับผู้ตรวจรายนั้นถูกปฏิเสธ\n5. VP ที่สลับชุด disclosure จน sd_hash ไม่ตรงถูกปฏิเสธ\n6. มีชุดทดสอบครอบทั้ง 5 กรณีข้างต้นและผ่านทั้งหมด", "sx": "ด่านหน้า  และบังคับสิทธิ์ที่ทุก endpoint", "out": "แต่ละคนทำได้เฉพาะสิ่งที่ตรงกับบทบาทของตน", "comp": "IAM & Tenant Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "Role-Based Access Control (RBAC)", "pri": "Highest", "pts": 8, "dep": "IDENTITY-02", "sprint": 1, "status": "Backlog", "ws": "IAM & Tenant Service", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. RBAC: role/permission model 5 role — Super Admin (ระดับแพลตฟอร์ม), Admin (ระดับองค์กร), Issuer, Verifier และ Auditor\n2. บังคับสิทธิ์ที่ VCVP Core (ทุก endpoint) และ Portal UI ซ่อน/แสดงตาม role\n3. assign role ต่อผู้ใช้ในแต่ละ org โดยผู้ใช้หนึ่งคนถือได้หลาย role\n4. กำหนดขอบเขตข้ามองค์กร: Super Admin เข้าถึงข้ามองค์กรได้ (เช่น สร้าง/แก้ไของค์กรที่ IDENTITY-02 และจัดการทะเบียนหน่วยงานที่ TRUST-01) ส่วน role อื่นทั้งหมดจำกัดอยู่ที่องค์กรตัวเองเท่านั้น และ Auditor เข้าถึง audit log ได้อย่างเดียว เรียกคำสั่งที่เปลี่ยนแปลงข้อมูลไม่ได้", "ac": "1. ผู้ใช้เห็นและทำได้เฉพาะเมนูและการกระทำตาม role\n2. การเรียก API ที่ไม่มีสิทธิ์ return 403\n3. เปลี่ยน role ของผู้ใช้แล้วสิทธิ์อัปเดตทันทีใน session ถัดไป\n4. Super Admin เข้าถึงข้ามองค์กรได้ ส่วน role อื่นเข้าถึงข้ามองค์กรไม่ได้แม้จะรู้ id ของข้อมูล\n5. Auditor เรียกคำสั่งที่เปลี่ยนแปลงข้อมูลไม่ได้ ระบบปฏิเสธพร้อมเหตุผล", "sx": "ระบบภายใน as a portal administrator, i want to กำหนดบทบาทและสิทธิ์ (admin / issuer operator / verifier operator / auditor), so that ควบคุมว่าใครทำอะไรได้บ้างในระบบ"}, {"id": "IDENTITY-06", "what": "ให้ Wallet ของประชาชนยืนยันตัวตนกับ VCVP Core และผูกกับเครื่อง", "out": "คำขอจากกระเป๋าผูกกับเจ้าของจริง ดึงหรือแก้ข้อมูลของคนอื่นไม่ได้", "comp": "IAM & Tenant Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "Wallet Holder Authentication & Device Binding", "pri": "Highest", "pts": 8, "dep": "WALLET-01, IDENTITY-03, IDENTITY-04", "sprint": 2, "status": "Backlog", "ws": "IAM & Tenant Service", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. ผูกกระเป๋ากับตัวบุคคลครั้งแรก (device binding) ผ่านช่องทางยืนยันตัวตนที่หน่วยงานกำหนด (เช่น OIDC/ThaID) แล้วผูกกับ public key ของผู้ถือที่สร้างจากกุญแจในเครื่อง (WALLET-01) โดยไม่ต้องสร้าง holder DID เพราะการลงนาม VC/VP อ้างอิงกุญแจผ่าน cnf ในตัว VC อยู่แล้ว\n2. หลังผูกแล้ว ทุก request ใช้การพิสูจน์การถือครองกุญแจแบบ challenge-response แทนการล็อกอินซ้ำ โดย VCVP Core ออก challenge และตรวจลายเซ็นกับ public key ที่ผูกไว้\n3. ออก session/token ให้กระเป๋า และให้ VCVP Core ตรวจทุก request ว่าเข้าถึงได้เฉพาะข้อมูลของเจ้าของ token นั้น โดยใช้กลไกเดียวกับ IDENTITY-03\n4. รองรับกรณีอุปกรณ์สูญหายหรือเปลี่ยนเครื่อง: เพิกถอน binding เดิม และผูกเครื่องใหม่ได้\n5. กัน replay ของ challenge (ใช้ได้ครั้งเดียวและหมดอายุ) และจำกัดอัตราการเรียก\n6. บันทึก audit log ของการผูก การเพิกถอน และการยืนยันตัวตนที่ล้มเหลว (AUDIT-01)", "ac": "1. Wallet ที่ยังไม่ผูก เรียก endpoint ฝั่ง Wallet ไม่ได้ (return 401)\n2. Wallet A ดึงหรือแก้ข้อมูลของ Wallet B ไม่ได้ (return 403) ทดสอบครอบทุก endpoint ฝั่ง Wallet ที่เปิดใช้แล้ว ณ เวลานั้น\n3. ผูกเครื่องใหม่และเพิกถอนเครื่องเดิมได้ และเครื่องเดิมใช้งานต่อไม่ได้ทันที\n4. challenge ใช้ซ้ำไม่ได้และหมดอายุตามที่กำหนด\n5. มี audit log ของการผูก เพิกถอน และการยืนยันตัวตนที่ล้มเหลว", "sx": "ระบบภายใน as a backend engineer, i want to ให้ wallet ของประชาชนยืนยันตัวตนกับ vcvp core ได้, so that คำขอที่ส่งจากกระเป๋าถูกผูกกับเจ้าของจริง และไม่มีใครดึงหรือแก้ข้อมูลของคนอื่นได้"}, {"id": "IDENTITY-05", "what": "สร้าง/แก้ไข/ระงับผู้ใช้ และกำหนด role ต่อองค์กร", "out": "ผู้ดูแลจัดการผู้ใช้และสิทธิ์ได้เองโดยไม่ต้องพึ่ง dev", "comp": "IAM & Tenant Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "User Management (CRUD)", "pri": "Medium", "pts": 5, "dep": "IDENTITY-03", "sprint": 6, "status": "Backlog", "ws": "IAM & Tenant Service", "phase": "เฟส 3 · 3.1 Final test", "scope": "Implement user management: แสดงรายชื่อผู้ใช้พร้อม role/organization, สร้าง/แก้ไข/ระงับผู้ใช้ และ assign role/org ผูกกับ RBAC และบันทึก audit log ของทุกการเปลี่ยนแปลง", "ac": "1. แสดงรายชื่อผู้ใช้พร้อม role/organization\n2. สร้าง/แก้ไข/ระงับผู้ใช้และกำหนด role ได้\n3. การเปลี่ยนแปลงผูกกับ RBAC และบันทึก audit log", "sx": "ระบบภายใน as a portal administrator, i want to สร้าง แก้ไข และกำหนดบทบาทผู้ใช้ในองค์กร, so that บริหารทีมงานและสิทธิ์เข้าถึงได้ครบวงจร"}]}, {"name": "Trust Registry Service", "gloss": "ทะเบียน issuer และ verifier ที่เชื่อถือได้", "output": "ตรวจสอบได้ว่า VC มาจากหน่วยงานที่ได้รับการรับรองจริง และผู้ขอข้อมูลเป็นผู้ที่ได้รับอนุญาต", "stories": [{"id": "TRUST-01", "what": "เก็บรายชื่อหน่วยงานผู้ออกที่เชื่อถือได้พร้อมสถานะการรับรอง ตั้งค่าผ่าน config", "out": "Wallet ตรวจได้ตั้งแต่วันแรกว่า VC มาจากหน่วยงานที่ได้รับการรับรอง", "comp": "Trust Registry Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "Trusted Issuer List (Core)", "pri": "High", "pts": 3, "dep": "IDENTITY-02", "sprint": 1, "status": "Backlog", "ws": "Trust Registry Service", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. เก็บรายชื่อหน่วยงานผู้ออกเอกสารพร้อม identifier (DID) ชื่อ โลโก้ สถานะการรับรอง และวันหมดอายุ โดยระยะนี้ตั้งค่าผ่าน config ยังไม่ต้องมีหน้าจอ (หน้าจอและ endpoint สาธารณะอยู่ที่ TRUST-03)\n2. เปิด interface ภายในให้ VCVP Core และ Wallet เรียกตรวจได้ว่าหน่วยงานรายหนึ่งอยู่ในรายชื่อและยังไม่หมดอายุการรับรองหรือไม่\n3. ออกแบบโครงสร้างข้อมูลและ interface ให้เปลี่ยนแหล่งที่มาภายหลังได้โดยไม่แก้โค้ดฝั่งที่เรียกใช้ (TRUST-03)", "ac": "1. VCVP Core และ Wallet เรียกตรวจได้ว่าหน่วยงานผู้ออกเอกสารรายหนึ่งอยู่ในรายชื่อหรือไม่\n2. หน่วยงานที่หมดอายุการรับรองแล้วถือว่าไม่ผ่านทันที\n3. Wallet ปฏิเสธ VC จากหน่วยงานที่ไม่อยู่ในรายชื่อ พร้อมแจ้งเหตุผลที่ผู้ใช้เข้าใจได้ (WALLET-07)\n4. เปลี่ยนรายชื่อผ่าน config ได้โดยไม่แก้โค้ด", "sx": "ระบบภายใน as a backend engineer, i want to ให้ระบบมีรายชื่อหน่วยงานผู้ออกเอกสารที่เชื่อถือได้พร้อมสถานะการรับรอง, so that wallet ตรวจได้ตั้งแต่วันแรกว่า vc ที่จะรับเข้ากระเป๋ามาจากหน่วยงานที่ได้รับการรับรอง"}, {"id": "TRUST-03", "what": "หน้าจอจัดการทะเบียน เผยแพร่ trust list สาธารณะ และสลับแหล่งที่มาได้", "out": "ระบบปลา ้ำแบบอ่านได้ในเครื่อง", "out": "เก็บข้อมูลส่วนบุคคลบนเครื่องเท่าที่จำเป็นตามหลัก PDPA", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Personal Data Minimisation in On-Device Claim Store", "pri": "High", "pts": 5, "dep": "WALLET-09", "sprint": 7, "status": "Backlog", "ws": "Wallet App", "phase": "เฟส 3 · 3.2 เตรียมเปิดบริการ", "scope": "1. ตรวจว่าปัจจุบันข้อมูลส่วนบุคคลอยู่บนเครื่องสองที่พร้อมกัน คือในตัว SD-JWT ที่เก็บเป็นก้อน และแตกเป็นรายฟิลด์แบบอ่านได้ในตาราง claim (เช่น เลขประจำตัว ชื่อ วันเกิด)\n2. ตัดสินระหว่างยอมรับการเก็บซ้ำโดยมีมาตรการชดเชย กับเลิกเก็บรายฟิลด์แล้วแยกข้อมูลจากก้อน SD-JWT ตอนใช้งาน\n3. ถ้าเลือกเลิกเก็บ ต้องวัดผลกระทบต่อความเร็วในการแสดงรายการบัตรและหน้ารายละเอียด แล้วยืนยันว่ายังอยู่ในเกณฑ์ที่ยอมรับได้\n4. บันทึกผลการตัดสินพร้อมเหตุผลเป็น ADR และปรับเอกสารบันทึกรายการประมวลผลข้อมูลส่วนบุคคลให้ตรง", "ac": "1. มีเอกสารระบุชัดว่าข้อมูลส่วนบุคคลถูกเก็บที่ใดบ้างบนเครื่อง และแต่ละที่มีเหตุผลรองรับ\n2. มี ADR ระบุทางเลือกที่ประเมินและเหตุผลที่เลือก\n3. ถ้าเลือกเลิกเก็บรายฟิลด์ ตาราง claim ต้องไม่มีข้อมูลส่วนบุคคลแบบอ่านได้เหลืออยู่ ตรวจได้จากการเปิดฐานข้อมูลทดสอบ\n4. เวลาแสดงรายการบัตรอยู่ในเกณฑ์ที่ตกลงไว้", "sx": "แอปและหน้าจอผู้ใช้ as a data protection officer, i want to ให้ข้อมูลส่วนบุคคลบนเครื่องไม่ถูกเก็บซ้ำในรูปแบบที่อ่านได้, so that ความเสี่ยงเมื่อเครื่องถูกเจาะลดลงและสอดคล้องกับหลักเก็บเท่าที่จำเป็น"}, {"id": "WALLET-13", "what": "เปลี่ยนค่าตั้งต้นที่ติดมากับไลบรารีให้ชี้มาที่ระบบของเราทั้งหมด", "out": "ไม่มีการเชื่อมต่อออกไปยังระบบของผู้ผลิตไลบรารีโดยไม่ตั้งใจ", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Production Configuration Hardening (Wallet Defaults)", "pri": "High", "pts": 3, "dep": "WALLET-01", "sprint": 7, "status": "Backlog", "ws": "Wallet App", "phase": "เฟส 3 · 3.2 เตรียมเปิดบริการ", "scope": "1. ตรวจค่าตั้งต้นทุกตัวที่ติดมากับไลบรารีฝั่งอุปกรณ์ โดยเฉพาะปลายทาง MQTT broker ที่ค่า default ชี้ไปยังระบบทดสอบของผู้ผลิต\n2. เปลี่ยนให้ชี้ไปยังระบบของเราทุกตัว และทำให้ค่าตั้งต้นเหล่านี้มาจากไฟล์ตั้งค่าของเรา ไม่ใช่ค่าที่ฝังมากับไลบรารี\n3. เพิ่มการตรวจอัตโนมัติในสายการสร้างแอป ไม่ให้ปล่อยรุ่นที่ยังมีปลายทางของผู้ผลิตค้างอยู่\n4. บันทึกรายการค่าตั้งต้นที่ตรวจแล้วไว้เป็นรายการตรวจสอบก่อนปล่อยรุ่น", "ac": "1. ไม่มีปลายทางของผู้ผลิตไลบรารีเหลืออยู่ในรุ่นที่เผยแพร่ ตรวจได้จากการค้นในไฟล์แอปที่สร้างแล้ว\n2. การตรวจอัตโนมัติในสายการสร้างแอปทำให้รุ่นที่มีค่าผิดสร้างไม่ผ่าน\n3. มีรายการตรวจสอบค่าตั้งต้นก่อนปล่อยรุ่นที่ใช้งานได้จริง", "sx": "แอปและหน้าจอผู้ใช้ as a platform engineer, i want to ให้ค่าตั้งต้นทุกตัวในกระเป๋าชี้ไปที่ระบบของเรา, so that ไม่มีการเชื่อมต่อออกไปยังระบบของผู้ผลิตไลบรารีโดยไม่ตั้งใจ"}]}, {"name": "Portal (ส่วนกลาง)", "gloss": "ตั้งค่าองค์กรและผู้ใช้", "output": "หน่วยงานตั้งค่าตัวเองให้พร้อมใช้งานได้ บนหน้าจอที่ใช้ชุดเดียวกันทั้งระบบและเข้าถึงได้ตามมาตรฐาน", "stories": [{"id": "PORTAL-03", "what": "วางรากฐาน design system และมาตรฐานการเข้าถึง WCAG 2.1 AA ของ Portal", "out": "ทุกหน้าจอที่สร้างหลังจากนี้ใช้ชุดเดียวกันและเข้าถึงได้ตามมาตรฐาน", "comp": "Portal (ส่วนกลาง)", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Portal Design System & Accessibility Foundation", "pri": "High", "pts": 8, "dep": "IDENTITY-01", "sprint": 0, "status": "Backlog", "ws": "Portal (ส่วนกลาง)", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. สร้าง design token และชุดสีที่ผ่านเกณฑ์ contrast ของ WCAG 2.1 AA ตั้งแต่ต้น\n2. สร้าง component ที่ใช้ร่วมกันทั้ง 3 portal โดยรองรับคีย์บอร์ด แสดงโฟกัสชัดเจน และมี label สำหรับโปรแกรมอ่านหน้าจอ\n3. แสดงวันที่และตัวเลขตามรูปแบบไทย (พ.ศ.) ให้ถูกต้องทั้งระบบ\n4. กำหนดให้หน้าจอที่สร้างหลังจากนี้ใช้ design system และ component ชุดนี้ ไม่สร้างเอง\n5. (ทางเลือก) เตรียมโครงสร้างแยกข้อความออกจากโค้ดเพื่อรองรับหลายภาษาในอนาคต โดยเฟสนี้ส่งมอบภาษาไทยอย่างเดียว ให้ทีมพัฒนาประเมินว่าคุ้มที่จะทำตั้งแต่ต้นหรือไม่", "ac": "1. ชุดสีและ component ผ่านเกณฑ์ contrast ของ WCAG 2.1 AA\n2. ใช้คีย์บอร์ดเข้าถึงและสั่งงานได้ครบทุก component พร้อมเห็นโฟกัสชัดเจน\n3. PORTAL-01, PORTAL-02 และ ISSUER-01 ใช้ design system และ component ชุดนี้จริง\n4. วันที่และตัวเลขแสดงตามรูปแบบไทยถูกต้อง", "sx": "แอปและหน้าจอผู้ใช้ as a portal user, i want to ใช้งาน portal ได้สะดวกและเข้าถึงได้ตามมาตรฐาน, so that ผู้ใช้หลากหลายกลุ่มใช้งานได้จริง"}, {"id": "PORTAL-01", "what": "wizard ตั้งค่า DID และ key ขององค์กร พร้อมตรวจความพร้อม", "out": "หน่วยงานใหม่พร้อมออก/ตรวจ VC ได้ด้วยตัวเอง", "comp": "Portal (ส่วนกลาง)", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Organization DID & Key Setup", "pri": "High", "pts": 8, "dep": "KEY-01, KEY-02, IDENTITY-02, PORTAL-03", "sprint": 5, "status": "Backlog", "ws": "Portal (ส่วนกลาง)", "phase": "เฟส 2 · 2.3 ตรวจผ่าน Trust Registry", "scope": "1. Portal UI onboarding wizard ตั้งค่า DID/key ขององค์กร\n2. เรียก VCVP Core เพื่อ สร้าง DID (did:web/key) + generate/import key\n3. เผยแพร่และตรวจ did.json + แสดงสถานะความพร้อม", "ac": "1. สร้าง DID องค์กรและกุญแจผ่าน Portal ได้สำเร็จ\n2. สำหรับ did:web ระบบช่วยเผยแพร่และตรวจ did.json ที่ปลายทาง\n3. แสดงสถานะความพร้อม (DID ready / key ready) ของแต่ละองค์กร", "sx": "แอปและหน้าจอผู้ใช้ as an issuer operator, i want to ตั้งค่า did และกุญแจขององค์กรผ่านขั้นตอน onboarding ใน portal, so that องค์กรพร้อมออกและตรวจ vc ได้โดยไม่ต้องแก้ config เอง"}, {"id": "PORTAL-02", "what": "จัดการ entity ฝั่ง issuer/verifier และผูก DID/key", "out": "จัดการหน่วยงานย่อยที่ทำหน้าที่ออกหรือตรวจได้", "comp": "Portal (ส่วนกลาง)", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Issuer & Verifier Entity Management", "pri": "High", "pts": 5, "dep": "IDENTITY-02, PORTAL-01, PORTAL-03", "sprint": 7, "status": "Backlog", "ws": "Portal (ส่วนกลาง)", "phase": "เฟส 3 · 3.2 เตรียมเปิดบริการ", "scope": "1. Portal UI CRUD issuer/verifier entity ผูก DID/Key และเลือก entity ไปใช้ในสาย issuance/verification\n2. scope ตามองค์กร ผ่าน VCVP Core", "ac": "1. สร้าง/แก้ไข/ดู issuer และ verifier entity พร้อมผูก DID/Key\n2. Entity ถูก scope ตาม organization ที่ถูกต้อง\n3. เลือก entity ไปใช้ในสาย issuance/verification ได้", " structure", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. สร้าง environment แยกขาดจากกัน พร้อมกำหนด network และ resource sizing ของแต่ละตัว\n2. แยก config/secret ต่อ env\n3. แยกฐานข้อมูลและ DID/host ต่อ env\n4. กำหนด promotion path ระหว่าง environment\n5. กำหนดเงื่อนไขก่อนขึ้น production เป็น 2 ระดับ (ก) ระดับนำร่อง จำกัดหน่วยงานและจำนวนผู้ใช้: กุญแจของหน่วยงานต้องอยู่ใน KMS แล้ว (KEY-03) เพราะ INTERNAL (encrypted DB) ใช้ได้เฉพาะ dev/UAT พร้อม hardening ระดับ platform (PLATFORM-06) และ audit log ใช้งานได้ (AUDIT-01) (ข) ระดับเปิดสาธารณะเต็มรูปแบบ: ต้องผ่านการทดสอบเจาะระบบและ DPIA (TESTING-02) ปรับตามข้อกำหนด ETDA (ENGINE-07) audit log ที่แก้ย้อนหลังไม่ได้ (AUDIT-02) ระบบสำรองและการกู้คืน (PLATFORM-08) และการทดสอบรองรับโหลด (TESTING-03) ครบก่อน โดยบังคับทั้งสองระดับเป็นด่านอัตโนมัติใน CD pipeline (PLATFORM-01) ถ้ายังไม่ครบให้หยุด deploy พร้อมแจ้งว่าขาดเงื่อนไขข้อใด", "ac": "1. มี environment Dev / UAT / PreProd / Prod แยกข้อมูลและ config ขาดจากกัน\n2. ทรัพยากร (DB, secret, DID/host) ของแต่ละ env แยกขาดจากกัน ไม่ปะปนกัน\n3. promote build จาก environment หนึ่งไปยัง environment ถัดไปได้จริงตามเส้นทางที่กำหนด และข้ามขั้นไม่ได้\n4. deploy ขึ้น production ระดับนำร่องไม่ได้ถ้ายังไม่ครบเงื่อนไขระดับ (ก) และ deploy ระดับเปิดสาธารณะไม่ได้ถ้ายังไม่ครบเงื่อนไขระดับ (ข) โดยระบบแจ้งว่าขาดเงื่อนไขข้อใด", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a platform engineer, i want to จัดเตรียม environment แยก dev / uat / preprod / prod, so that พัฒนา ทดสอบ และใช้งานจริงโดยไม่กระทบกัน"}, {"id": "PLATFORM-04", "what": "ติดตั้งฐานข้อมูล เปิด encryption-at-rest และรัน migration", "out": "ข้อมูลถูกเก็บอย่างปลอดภัยและอัปเกรดโครงสร้างได้", "comp": "Platform & Infrastructure", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Database Provisioning, Encryption & Migration", "pri": "High", "pts": 8, "dep": "None", "sprint": 0, "status": "Backlog", "ws": "Platform & Infrastructure", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. ติดตั้ง/กำหนดค่า MariaDB/PostgreSQL\n2. เปิด encryption-at-rest\n3. ให้ one-core รัน migration ของตัวเองได้สำเร็จตอน boot และเตรียมฐานข้อมูลเปล่าไว้ให้ VCVP Core (schema ออกแบบที่ IDENTITY-04)\n4. ตั้ง connection pooling และ baseline backup", "ac": "1. ฐานข้อมูลถูกสร้างครบทั้งของ one-core และของ VCVP Core และ one-core รัน migration ของตัวเองสำเร็จ\n2. เปิดใช้ encryption-at-rest และจำกัดสิทธิ์การเข้าถึง (least privilege)\n3. ทดสอบการเชื่อมต่อจาก one-core และจาก VCVP Core เข้าฐานข้อมูลของตัวเองสำเร็จ และมี baseline backup", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a platform engineer, i want to จัดเตรียมฐานข้อมูลของ one-core พร้อมเข้ารหัสและ migration, so that ข้อมูลระบบถูกจัดเก็บอย่างปลอดภัยและ schema พร้อมใช้งาน"}, {"id": "PLATFORM-06", "what": "กำหนดให้ใช้ TLS, rate limit, input validation และ security headers", "out": "ระบบสามารถรับมือกับการโจมตีพื้นฐานตามเกณฑ์ OWASP ได้", "comp": "Platform & Infrastructure", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Transport & API Security Hardening", "pri": "High", "pts": 5, "dep": "PLATFORM-02", "sprint": 0, "status": "Backlog", "ws": "Platform & Infrastructure", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "Hardening ระดับ platform ในชั้นแอปพลิเคชัน (ส่วนการจำกัดอัตราและ cache ที่ชั้น edge อยู่ที่ EDGE-03): enforce TLS 1.2+, rate limiting, input/schema validation, CORS policy, security headers และ secret management ตาม OWASP ASVS", "ac": "1. ทุก endpoint บังคับ HTTPS และปฏิเสธ HTTP\n2. มี rate limiting และตอบ 429 เมื่อเกิน threshold\n3. Input ที่ผิด schema ถูกปฏิเสธพร้อม error message ที่ไม่เปิดเผยข้อมูลภายใน\n4. CORS อนุญาตเฉพาะ origin ที่กำหนด และปฏิเสธ origin อื่น\n5. ทุก response มี security headers ตามรายการที่กำหนดไว้ (เช่น HSTS, X-Content-Type-Options, X-Frame-Options, CSP)\n6. ตรวจแล้วไม่พบ secret ใน repo, config, log และ error message", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a security engineer, i want to บังคับใช้ tls, rate limiting และ input validation ทุก endpoint, so that ป้องกันการโจมตีและข้อมูลรั่วไหล"}, {"id": " ": "ENGINE-01", "what": "ตั้งค่า provider ที่เปิดใช้ และย้าย secret/KEK ไปเก็บใน KMS", "out": "เปิด-ปิดความสามารถของ engine ได้ผ่าน config โดยไม่ต้องแก้โค้ด", "comp": "Engine Layer (one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "one-core Configuration & Secrets Management", "pri": "Highest", "pts": 8, "dep": "PLATFORM-02, PLATFORM-04", "sprint": 0, "status": "Backlog", "ws": "Engine Layer (one-core)", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. ตรวจสอบและตั้งค่า provider instances ที่เปิดใช้ในระบบ ผ่าน config YAML ของ one-core ให้ครบทุกหมวด (did, format, revocation, keyAlgorithm, keyStorage, issuanceProtocol/verificationProtocol, transport, trustManagement, task) โดย transport, trustManagement และ task กำหนดจบใน story นี้ พร้อมตั้งตัวเรียก task ตามรอบเวลา (one-core เปิดเส้น /api/task/v1/run ให้ แต่ไม่มีตัวจับเวลาในตัว) ส่วนหมวดอื่นดูรายละเอียดใน story ที่เกี่ยวข้อง\n2. ย้าย KEK/encryption key ของ INTERNAL key storage และ DB credential เก็บใน KMS/secrets manager, inject ตอน runtime, rotate KEK ได้ (ต้องวางแผน re-encrypt key ใน DB)\n3. ใช้ key storage แบบ KMS ที่ต้องพัฒนาเพิ่มเอง (AWS/GCP ใน KEY-03) เพื่อให้ private key ไม่ออกนอก KMS\nหมายเหตุ: one-core มี Azure Key Vault ในตัวแต่เราไม่ใช้\nPKCS#11 ยังเป็น stub คือยังไม่มีการพัฒนา ต้องพัฒนาเพิ่ม\n4. แยกค่า config ต่อ environment (Dev/UAT/PreProd/Prod)\n5. ทดสอบ/verify ตัว one-core จะมี fail-fast เมื่อ config ผิดตอน startup (ความสามารถในตัว one-core) และ VCVP Core/ops เรียก /api/config/v1 ตรวจว่า provider ที่ active ตรงที่คาดหวัง", "ac": "1. เปิด/ปิด provider instance (DID/format/revocation/keyStorage/protocol/task) ผ่าน config YAML โดยไม่แก้โค้ด\n2. KEK/encryption key ของ key storage และ DB credential ไม่อยู่ใน repo/config และดึงจาก KMS/vault ตอน runtime\n3. รองรับการ rotate KEK โดยกุญแจ/ข้อมูลเดิมยังถอดได้ และจำกัดสิทธิ์+audit การเข้าถึง KEK\n4. ใส่ config ผิดแล้ว one-core ไม่ start (fail-fast) และเรียก /api/config/v1 ได้รายการ provider ที่ active ตรงกับที่ตั้งค่า\n5. task ที่เปิดใช้ถูกเรียกตามรอบเวลาที่กำหนดจริง และตรวจสอบได้ว่ารันสำเร็จหรือล้มเหลว", "sx": "engine และ adapter as a platform engineer, i want to บริหาร configuration และ secret ของ one-core แบบรวมศูนย์ต่อ environment, so that เปิด/ปิด provider และจัดการคีย์ลับได้ปลอดภัยและยืดหยุ่น"}, "ENGINE-03": {"id": "ENGINE-03", "what": "เปิดใช้อัลกอริทึม EdDSA / ECDSA / ML-DSA", "out": "เลือกอัลกอริทึมลงนามได้ตามงาน รวมถึงแบบรองรับยุคควอนตัม", "comp": "Engine Layer (one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Key Algorithm Provider", "pri": "Highest", "pts": 5, "dep": "PLATFORM-02", "sprint": 0, "status": "Backlog", "ws": "Engine Layer (one-core)", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. ตั้งค่า key algorithm ใน one-core ผ่าน config โดยเปิด EdDSA/ECDSA/ML-DSA และปิดตัวที่ไม่ได้ใช้\n2. เลือกอัลกอริทึมต่อ use case ได้โดยไม่แก้โค้ด\n3. ทดสอบ sign/verify", "ac": "1. sign/verify สำเร็จครบทุกอัลกอริทึมผ่าน one-core\n2. เลือกอัลกอริทึมผ่าน config ได้", "sx": "engine และ adapter as a security engineer, i want to ให้ key algorithm provider รองรับ eddsa, ecdsa และ ml-dsa (post-quantum), so that ระบบเลือกใช้อัลกอริทึมได้ยืดหยุ่นและรองรับยุคหลังควอนตัม"}, "ENGINE-04": {"id": "ENGINE-04", "what": "fork one-core และวาง process sync upstream", "out": "รักษา patch ของเราไว้ได้ ขณะที่ยัง sync upstream release ใหม่ได้ต่อเนื่อง โดยไม่เกิด drift", "comp": "Engine Layer (one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "one-core Fork Setup & Upstream Maintenance", "pri": "High", "pts": 8, "dep": "PLATFORM-02", "sprint": 0, "status": "Backlog", "ws": "Engine Layer (one-core)", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. Fork repo one-core (Apache 2.0) และ ตั้ง CI/CD ของ fork + legal check (NOTICE/trademark/patent)\n2. Pin upstream version และ automated upstream-sync test\n3. เก็บการแก้เป็น patch queue แบบ rebase บน upstream (ไม่ merge ปน) เพื่อนับ patch และแก้ conflict ทีละตัวได้\n4. คุม drift ด้วยทะเบียน patch (เจ้าของ/เหตุผล/เงื่อนไขการลบ) และเพดานจำนวน patch โดยประเมินรายกรณีว่า patch ไหนควรส่ง PR กลับ upstream", "ac": "1. มี fork repo และ CI ที่ build/test ผ่าน\n2. sync upstream แล้ว patch ของเรายังอยู่ และ test ผ่าน\n3. มี runbook sync upstream และทะเบียน patch ที่ระบุไฟล์ที่แก้ (Apache 2.0 #4b)", "sx": "engine และ adapter as a devops/backend engineer, i want to ตั้งและดูแล fork ของ one-core, so that แก้ one-core ได้และ sync กับ upstream ระยะยาวโดยไม่พัง"}, "ENGINE-07": {"id": "ENGINE-07", "what": "หา gap แล้วปรับ engine ตามข้อกำหนดกฎหมายไทย/ETDA", "out": "engine ทำงานตรงข้อกำหนด ETDA พร้อมเอกสารอ้างอิงสำหรับการตรวจสอบ", "comp": "Engine Layer (one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Thai Law / ETDA Compliance Adaptation", "pri": "High", "pts": 13, "dep": "PLATFORM-02, ENGINE-04", "sprint": 0, "status": "Backlog", "ws": "Engine Layer (one-core)", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. รวบรวมข้อกำหนดตามกฎหมายไทย/ETDA ที่กระทบ one-core (เช่น อัลกอริทึม/crypto ที่รับรอง, credential profile, trust framework, data residency)\n2. วิเคราะห์ gap ระหว่าง one-core ปัจจุบันกับข้อกำหนด\n3. implement/ปรับแต่ง one-core ตาม gap (การจัดการ fork ดู ENGINE-04)\n4. จัดทำเอกสาร mapping ความสอดคล้องสำหรับ audit (หมายเหตุ: ต้องแตกเป็น sub-task เมื่อข้อกำหนดชัด)", "ac": "1. มีรายการข้อกำหนด ETDA/กฎหมายไทยที่กระทบ และ gap analysis\n2. one-core ปรับให้รองรับข้อกำหนดที่ระบุครบ\n3. มีเอกสาร mapping ความสอดคล้องสำหรับยื่น/ตรวจรับ", "sx": "engine และ adapter as a compliance/backend engineer, i want to ปรับแต่ง/เพิ่มความสามารถใน one-core ให้สอดคล้องกฎหมายไทย (etda/pdpa), so that ระบบผ่านเกณฑ์กำกับดูแลของไทยก่อนใช้งานจริง"}, "ENGINE-02": {"id": "ENGINE-02", "what": "เปิดใช้ formatter SD-JWT", "out": "ออก VC แบบ SD-JWT ที่ปกปิดข้อมูลบางส่วนได้", "comp": "Engine Layer (one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Credential Formatter Provider (SD_JWT)", "pri": "Highest", "pts": 5, "dep": "KEY-01, EDGE-03", "sprint": 2, "status": "Backlog", "ws": "Engine Layer (one-core)", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. ตั้งค่า formatter ใน one-core ผ่าน config โดยเปิดรูปแบบ SD_JWT และปิดตัวที่ไม่ได้ใช้ (SD_JWT มี @context และชั้นห่อ vc ตาม W3C VCDM ส่วน SD_JWT_VC ของ IETF ใช้ vct แทนและไม่มี @context จึงเป็นคนละ provider กัน เราเลือก SD_JWT เพราะ ขมธอ. 24-2563 บังคับ @context)\n2. integrate การออก VC ให้เรียกผ่าน VCVP Core\n3. ทดสอบออก VC (SD_JWT) และ verify proof ได้\n4. งานส่วน vct เป็นงานมีเงื่อนไข ใช้เฉพาะเมื่อมีข้อกำหนดให้เปิดใช้รูปแบบ SD_JWT_VC เพิ่มในภายหลัง ซึ่งไม่ใช่แผนปัจจุบัน ถ้าเปิดใช้ ต้องกำหนดรูปแบบ vct ของใบรับรองแต่ละประเภทให้เป็น URL บน domain ของเราเอง และเผยแพร่ SD-JWT VC Type Metadata ที่ URL นั้น พร้อม vct#integrity เพื่อให้ผู้ตรวจยืนยันได้ว่า metadata ไม่ถูกแก้ภายหลัง โดยต้องเผื่อไว้ด้วยว่า one-core บังคับให้ URL ของ vct ดึงได้จริง ถ้าดึงไม่ได้จะออกบัตรไม่ได้เลย", "ac": "1. ออก VC รูปแบบ SD_JWT ที่มี disclosure array ครบ และมี @context ตามที่ ขมธอ. 24-2563 กำหนด\n2. ออก VC รูปแบบ SD_JWT ผ่าน API ของ VCVP Core ได้ โดย client ไม่เรียก one-core โดยตรง\n3. ข้อนี้วัดเมื่อเปิดใช้รูปแบบ SD_JWT_VC เท่านั้น คือ resolve vct ของ VC ที่ออก แล้วได้ type metadata ที่ตรงกับค่า integrity ที่ฝังอยู่ใน VC ตราบใดที่ยังใช้ SD_JWT อย่างเดียว ข้อนี้ถือว่าไม่อยู่ในขอบเขตการวัด", "sx": "engine และ adapter as an issuer developer, i want to ใช้ credential formatter provider ที่รองรับ sd_jwt, so that ออก vc รูปแบบ sd_jwt ที่บรรจุ claim ตามที่ issuer กำหนด (schema) และรองรับ selective disclosure"}, "ENGINE-05": {"id": "ENGINE-05", "what": "เปิดใช้ formatter mdoc ตาม ISO 18013-5", "out": "ออก mDL ที่ใช้ร่วมกับระบบสากลได้", "comp": "Engine Layer (one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "mDoc / ISO 18013-5 (mDL) Format Support", "pri": "High", "pts": 5, "dep": "ENGINE-02, ENGINE-03", "sprint": 3, "status": "Backlog", "ws": "Engine Layer (one-core)", "phase": "เฟส 2 · 2.1 Issuer core", "scope": "1. เปิดใช้ formatter mso_mdoc (ISO/IEC 18013-5) ใน one-core\n2. เปิดการออก mDoc เป็น API ของ VCVP Core โดย client ไม่เรียก one-core โดยตรง\n3. ทดสอบออก mDoc (MSO ลงนาม) และนำเสนอผ่าน mdoc-OpenID4VP", "ac": "1. ออก VC mDoc (mso_mdoc) ที่มี MSO ลงนามถูกต้อง\n2. verify mDoc และ data elements ได้\n3. นำเสนอ mDoc ผ่าน OpenID4VP ได้", "sx": "engine และ adapter as an issuer developer, i want to ออกใบรับรองรูปแบบ mdoc (iso/iec 18013-5) นอกเหนือจาก sd-jwt, so that รองรับใบขับขี่ดิจิทัล (mdl) และ use case ตามมาตรฐาน iso/etda"}, "ENGINE-06": {"id": "ENGINE-06", "what": "จัดการ certificate chain ของ mDoc (IACA / Document Signer)", "out": "mDoc ที่ออกถูกตรวจสอบได้จริงโดย verifier ภายนอก", "comp": "Engine Layer (one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Document Signer Certificate (mDoc / ISO 18013-5)", "pri": "Medium", "pts": 8, "dep": "ENGINE-05", "sprint": 6, "status": "Backlog", "ws": "Engine Layer (one-core)", "phase": "เฟส 3 · 3.1 Final test", "scope": "1. จัดการ certificate chain สำหรับ mDoc (IACA / Document Signer) ตาม ISO/IEC 18013-5\n2. ผูก certificate กับกุญแจขององค์กร แจ้งเตือนเมื่อใกล้หมดอายุ และต่ออายุก่อนหมดอายุ\n3. เผยแพร่/แลกเปลี่ยน trust anchor ให้ verifier ใช้ตรวจสอบได้\n4. กำหนดวิธีเพิกถอน mDoc ซึ่งใช้กลไกคนละแบบกับ SD-JWT (ISO 18013-5 อิง certificate ไม่ใช่ Bitstring Status List) โดยเผยแพร่รายการเพิกถอน certificate ให้ verifier ตรวจได้", "ac": "1. mDoc ที่ออกมี certificate chain ที่ verifier ตรวจสอบผ่าน\n2. certificate ใกล้หมดอายุมีการแจ้งเตือนและต่ออายุได้ โดย mDoc ที่ออกไปแล้วยังตรวจได้\n3. เพิกถอน Document Signer certificate แล้ว verifier ภายนอกตรวจ mDoc ที่ออกด้วย certificate นั้นได้ผลเป็นไม่ผ่าน", "sx": "engine และ adapter as a security engineer, i want to จัดการ certificate chain สำหรับ mdoc ตาม iso 18013-5, so that verifier ตรวจสอบ mdoc ที่เราออกได้จริงตามมาตรฐาน"}, "ENGINE-08": {"id": "ENGINE-08", "what": "เพิ่มกลไกให้ฝั่งผู้ออกลบเอกสารที่ออกไปแล้วได้ตามเงื่อนไข", "out": "จัดการข้อมูลตามคำขอของเจ้าของข้อมูลและตามระยะเวลาเก็บรักษาได้", "comp": "Engine Layer (one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Issuer-Side Credential Deletion", "pri": "Medium", "pts": 5, "dep": "ENGINE-02", "sprint": 6, "status": "Backlog", "ws": "Engine Layer (one-core)", "phase": "เฟส 3 · 3.1 Final test", "scope": "1. ปัจจุบัน engine ปฏิเสธการลบเมื่อผู้ใช้เป็นฝั่งผู้ออก และ credential schema มีวิธีเพิกถอน และสถานะเป็นรับแล้ว ทำให้ลบไม่ได้เลย\n2. เพิ่มกลไกให้ลบได้ตามเงื่อนไข โดยเลียนแบบงานเบื้องหลังที่มีอยู่แล้วสำหรับการล้างหลักฐานการยื่น\n3. กำหนดเงื่อนไขที่ลบได้ให้ชัด เช่น พ้นระยะเวลาเก็บรักษา หรือมีคำขอจากเจ้าของข้อมูลที่ผ่านการอนุมัติ และต้องเพิกถอนก่อนลบเสมอ\n4. ทุกการลบต้องบันทึกร่องรอยว่าใครลบ เมื่อใด ด้วยเหตุผลใด โดยร่องรอยต้องไม่มีข้อมูลส่วนบุคคลของเอกสารที่ถูกลบ\n5. เป็นการแก้ engine จึงต้องดูแลเป็น patch ตามแนวทางใน ENGINE-04", "ac": "1. ลบเอกสารที่เข้าเงื่อนไขได้สำเร็จ และเอกสารที่ไม่เข้าเงื่อนไขถูกปฏิเสธพร้อมเหตุผล\n2. เอกสารที่ยังไม่ถูกเพิกถอนลบไม่ได้\n3. มีร่องรอยการลบครบทุกครั้ง และไม่มีข้อมูลส่วนบุคคลของเอกสารที่ถูกลบอยู่ในร่องรอย\n4. รองรับคำขอจากเจ้าของข้อมูลตาม AUDIT-03\n5. patch ถูกบันทึกในทะเบียน patch ตาม ENGINE-04 และ rebase ผ่าน", "sx": "engine และ adapter as an issuer administrator, i want to ลบเอกสารที่ออกไปแล้วได้ตามเงื่อนไขที่กำหนด, so that จัดการข้อมูลตามคำขอของเจ้าของข้อมูลและตามระยะเวลาเก็บรักษาได้"}, "ADAPTER-01": {"id": "ADAPTER-01", "what": "กำหนด interface กลาง และสร้าง adapter ตัวแรกครอบ one-core", "out": "Portal และ Wallet เรียกใช้งานผ่านช่องทางเดียว และไม่สามารถเรียก engine เองได้", "comp": "Adapter & Integration Layer", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Credential Engine Interface & Adapter (Integration Layer)", "pri": "Highest", "pts": 8, "dep": "PLATFORM-02", "sprint": 0, "status": "Backlog", "ws": "Adapter & Integration Layer", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. สร้าง VCVP Core service เป็น API base เดียวสำหรับ Portal และ Wallet (ไม่มี client ใดเรียก API ของ engine โดยตรง)\n2. กำหนด interface กลางสำหรับเรียกใช้ engine โดยตั้งชื่อคำสั่งตามงานที่ระบบทำจริง (issue/verify/revoke/sign/resolve/schema/status) ไม่อิงศัพท์เฉพาะของ engine ตัวใดตัวหนึ่ง\n3. implement adapter ตัวแรกสำหรับ one-core: แปลง request/response, จัดการ auth, retry/timeout และแปลง error ให้สื่อความหมาย\n4. กำหนดให้ชื่อ/โครงสร้างเฉพาะของ engine ต้องไม่รั่วออกนอก adapter (โดเมนและ API ที่เปิดให้ client ต้องเป็นกลาง)\n5. ออกแบบให้รองรับ engine มากกว่าหนึ่งตัวตั้งแต่ต้น แม้เฟสนี้จะติดตั้งใช้งานจริงเพียงตัวเดียว (one-core) เพื่อไม่ให้ต้องรื้อโครงสร้างเมื่อเพิ่ม engine ภายหลัง (การรองรับหลาย engine จริงอยู่ที่ ADAPTER-03)\n6. เพิ่ม architecture test เข้า CI ที่ fail อัตโนมัติเมื่อโค้ดชั้นโดเมนอ้างถึงโครงสร้างของ engine หรือ adapter โดยตรง\n7. รองรับ adapter 2 แบบ คือ adapter ที่ครอบ engine ที่เราติดตั้งเอง และ adapter แบบอ่านอย่างเดียวที่ครอบ endpoint มาตรฐานของหน่วยงานภายนอก โดย adapter ไม่จำเป็นต้อง implement ครบทุกคำสั่ง", "ac": "1. Portal และ Wallet เรียกใช้ความสามารถได้ครบ flow ผ่าน VCVP Core และไม่มี client ใดเรียก API ของ engine โดยตรง\n2. โค้ดชั้นโดเมนไม่มีการอ้างถึงชื่อ/โครงสร้างเฉพาะของ engine ตัวใดตัวหนึ่ง (ทดสอบกับ adapter ของ one-core ซึ่งเป็น adapter ตัวเดียวใน sprint นี้)\n3. จัดการ error/timeout จาก engine และ return error ที่สื่อความหมาย\n4. architecture test ทำงานใน CI และ fail จริงเมื่อทดลองใส่การอ้างถึง engine เข้าไปในชั้นโดเมน\n5. adapter แบบอ่านอย่างเดียวที่ครอบ endpoint มาตรฐานของหน่วยงานภายนอก ทำงานผ่าน interface กลางชุดเดียวกันได้ โดยไม่ต้อง implement ครบทุกคำสั่ง และคำสั่งที่ไม่รองรับถูกปฏิเสธพร้อมเหตุผล", "sx": "engine และ adapter as a backend engineer, i want to ให้ vcvp core เรียกใช้งาน engine ผ่าน interface กลาง โดยมี adapter เป็นตัวแปลง, so that เพิ่มหรือเปลี่ยน engine ในอนาคตได้โดยไม่กระทบโดเมนและ client"}, "ADAPTER-03": {"id": "ADAPTER-03", "what": "ให้ adapter ประกาศความสามารถ และเลือก engine ตามหน่วยงาน", "out": "ต่อ engine หลายเจ้าพร้อมกันได้ และปฏิเสธงานที่ engine ไม่รองรับพร้อมเหตุผล", "comp": "Adapter & Integration Layer", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Engine Capability & Routing (Multi-engine)", "pri": "High", "pts": 8, "dep": "ADAPTER-01, IDENTITY-04", "sprint": 1, "status": "Backlog", "ws": "Adapter & Integration Layer", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. เพิ่มคำสั่ง capabilities ใน interface กลาง ให้แต่ละ adapter return ความสามารถของ engine ตัวเองให้ VCVP Core (format, algorithm, วิธีเพิกถอน, เวอร์ชันโปรโตคอลที่รองรับ)\n2. ตรวจความสามารถก่อนสั่งงาน และปฏิเสธพร้อมเหตุผลที่ชัดเจนเมื่อ engine ไม่รองรับ\n3. routing: เลือก engine ตามหน่วยงาน/ประเภท credential จาก engine profile ขององค์กร\n4. รองรับการเปิดใช้ engine หลายตัวพร้อมกันในระบบเดียว\n5. สร้าง adapter จำลอง (stub) ที่ไม่ต่อกับ engine จริง โดยประกาศ capabilities ต่างจาก adapter ของ one-core เพื่อใช้พิสูจน์การทำงานแบบหลาย engine และใช้ในการทดสอบอัตโนมัติ", "ac": "1. เพิ่ม adapter ตัวใหม่เข้าระบบได้โดยไม่ต้องแก้โค้ดในชั้นโดเมน\n2. สั่งงานที่ engine ไม่รองรับ ระบบปฏิเสธพร้อมเหตุผลชัดเจน ไม่ล้มแบบไม่ทราบสาเหตุ\n3. ตั้งค่าให้หน่วยงานคนละแห่งใช้ adapter คนละตัว (one-core และ adapter จำลอง) แล้วทำงานพร้อมกันได้ถูกต้อง โดยแต่ละหน่วยงานได้ผลจาก engine ของตัวเอง", "sx": "engine และ adapter as a backend engineer, i want to ให้ระบบรู้ความสามารถของแต่ละ engine และเลือก engine ตามหน่วยงานได้, so that รองรับการต่อกับ engine หลายตัวพร้อมกันโดยไม่พังแบบไม่ทราบสาเหตุ"}, "ADAPTER-02": {"id": "ADAPTER-02", "what": "ใช้ตัวตรวจลายเซ็นของ engine และ resolve DID ของ issuer", "out": "ตรวจได้ว่า VC ออกโดย issuer ตัวจริงและไม่ถูกแก้ไข", "comp": "Adapter & Integration Layer", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Crypto Provider (Signature Verification)", "pri": "Highest", "pts": 5, "dep": "KEY-01, ENGINE-03", "sprint": 2, "status": "Backlog", "ws": "Adapter & Integration Layer", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. พัฒนาคำสั่ง verify ใน adapter โดยส่งงานตรวจลายเซ็นให้ one-core ทำ ไม่เขียน crypto เอง ครอบคลุมอัลกอริทึมที่เปิดไว้ใน ENGINE-03 (EdDSA/ECDSA/ML-DSA)\n2. resolve DID ของ issuer เพื่อดึง public key\n3. เปิด verify/resolve เป็น API ของ VCVP Core ให้ Portal และ Wallet เรียกใช้ได้", "ac": "1. return สถานะผลการตรวจสอบ ทั้งกรณีที่ผ่านและไม่ผ่าน\n2. return รายละเอียดผลการ verify ครบทุกอัลกอริทึมที่ใช้ออก\n3. ดึง public key จาก DID ของ issuer อัตโนมัติ", "sx": "engine และ adapter as a verifier developer, i want to ตรวจสอบลายเซ็นดิจิทัลและความถูกต้องของ vc/vp ผ่าน crypto provider, so that มั่นใจได้ว่าใบรับรองออกโดย issuer จริงและไม่ถูกแก้ไข"}, "EDGE-01": {"id": "EDGE-01", "what": "เผยแพร่ did.json บน domain ของเรา และติดตั้ง/ต่ออายุใบรับรอง TLS", "out": "การเชื่อมต่อจากภายนอกสามารถดึง DID document ของเราได้ผ่าน HTTPS", "comp": "Public Edge & Resolver", "group": "ด่านหน้าสาธารณะ (รับจาก wallet และคนภายนอก)", "color": "#d85a30", "feature": "did:web Hosting & TLS Certificate Setup", "pri": "Medium", "pts": 5, "dep": "PLATFORM-03", "sprint": 1, "status": "Backlog", "ws": "Public Edge & Resolver", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. ตั้งค่า web hosting/reverse proxy สำหรับ /.well-known/did.json\n2. ออก/ต่ออายุใบรับรอง TLS (เช่น Let's Encrypt)\n3. บังคับ HTTPS (ปฏิเสธ HTTP) เฉพาะ endpoint ที่ host ของ DID ส่วนการบังคับครอบทุก endpoint ของระบบอยู่ที่ PLATFORM-06\n4. จัดการ domain ต่อ environment", "ac": "1. เข้าถึง /.well-known/did.json ผ่าน HTTPS ได้และ resolve สำเร็จ\n2. ใบรับรอง TLS ถูกต้องและตั้ง auto-renew\n3. บังคับ HTTPS (ปฏิเสธ HTTP) สำหรับ endpoint ที่ host ของ DID", "sx": "ด่านหน้าสาธารณะ as a platform engineer, i want to host did.json ผ่าน https พร้อมใบรับรอง tls, so that did:web ขององค์กร resolve ได้และน่าเชื่อถือ"}, "EDGE-03": {"id": "EDGE-03", "what": "ตั้ง edge ให้ทุก endpoint สาธารณะอยู่บน domain ของเราเอง", "out": "เปลี่ยน engine ข้างหลังได้โดย QR ที่ออกไปแล้วยังใช้ได้", "comp": "Public Edge & Resolver", "group": "ด่านหน้าสาธารณะ (รับจาก wallet และคนภายนอก)", "color": "#d85a30", "feature": "Public Endpoint Gateway & Domain Ownership", "pri": "High", "pts": 5, "dep": "PLATFORM-03, EDGE-01", "sprint": 1, "status": "Backlog", "ws": "Public Edge & Resolver", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. ตั้ง edge/reverse proxy ให้ endpoint สาธารณะทั้งหมด (SSI protocol, status list, did.json, issuer metadata, vct / type metadata, credential schema, trust list) อยู่บน domain ของเรา\n2. เส้นทางภายในชี้ไป engine/บริการที่รับผิดชอบ โดยเปลี่ยนปลายทางได้โดย URL ภายนอกไม่เปลี่ยน\n3. แยกทางเข้า: endpoint สาธารณะกับ management API ไม่ใช้ทางเข้าเดียวกัน\n4. กำหนด cache policy และ rate limit ที่ชั้น edge", "ac": "1. wallet และ verifier ภายนอกเห็นเฉพาะ domain ของเรา ไม่เห็น host ของ engine\n2. เปลี่ยน backend ปลายทางได้โดย URL สาธารณะไม่เปลี่ยน\n3. management API เข้าถึงจากอินเทอร์เน็ตสาธารณะไม่ได้\n4. endpoint สาธารณะถูกจำกัดอัตราการเรียกที่ชั้น edge และตอบตาม cache policy ที่กำหนด (ตรวจได้จาก response header)", "sx": "ด่านหน้าสาธารณะ as a platform architect, i want to ให้ endpoint สาธารณะทั้งหมดอยู่บน domain ของเราเอง, so that เปลี่ยน engine ข้างหลังได้โดย qr และการตั้งค่าที่ประกาศออกไปแล้วยังใช้ได้"}, "EDGE-02": {"id": "EDGE-02", "what": "ตั้ง cache ของ DID document และ status list พร้อม TTL", "out": "ตรวจ VC ได้เร็วขึ้นและไม่ยิงซ้ำไปต้นทางทุกครั้ง", "comp": "Public Edge & Resolver", "group": "ด่านหน้าสาธารณะ (รับจาก wallet และคนภายนอก)", "color": "#d85a30", "feature": "DID Document & Status List Caching", "pri": "Medium", "pts": 5, "dep": "KEY-01", "sprint": 2, "status": "Backlog", "ws": "Public Edge & Resolver", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. ตั้งค่า caching ของ DID Document, status list, trust list และ vct / type metadata (one-core internal และ ชั้น VCVP Core)\n2. กำหนด TTL และ invalidation policy ตามประเภทข้อมูล\n3. รองรับ purge cache ราย entry", "ac": "1. การ resolve DID ครั้งที่ 2 ภายใน TTL อ่านจาก cache โดยไม่เรียกออก network\n2. เมื่อ TTL หมดอายุ ระบบ refresh ค่าใหม่อัตโนมัติ\n3. สามารถสั่ง purge cache ราย entry ได้ผ่าน admin API", "sx": "ด่านหน้าสาธารณะ as a platform engineer, i want to ให้ระบบ cache ผลการ resolve did document และ status list, so that ลดภาระ network และทำงานต่อได้แม้ปลายทางช้า/ล่ม"}, "PROTOCOL-01": {"id": "PROTOCOL-01", "what": "เปิด flow ออก VC ตามมาตรฐาน OpenID4VCI", "out": "wallet มาตรฐานทั่วไปรับ VC จากระบบเราได้", "comp": "SSI Protocol Service", "group": "ด่านหน้าสาธารณะ (รับจาก wallet และคนภายนอก)", "color": "#d85a30", "feature": "OpenID4VCI (Credential Issuance)", "pri": "Highest", "pts": 5, "dep": "ENGINE-02, WALLET-01, EDGE-03", "sprint": 2, "status": "Backlog", "ws": "SSI Protocol Service", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. ตั้งค่า issuanceProtocol ใน one-core ผ่าน config โดยเปิดเวอร์ชัน OpenID4VCI ที่ตกลงกับ wallet ปลายทาง (รองรับ pre-authorized & authorization code) และปิดเวอร์ชันที่ไม่ได้ใช้\n2. integrate การออก VC ให้ทำผ่าน VCVP Core (ISSUANCE-02)\n3. ทดสอบ flow รับ VC เข้ากระเป๋า และ proof of possession\n4. endpoint และ metadata ที่ wallet มองเห็น ต้องอยู่บน domain ของเราเอง (ดู EDGE-03) เพื่อไม่ผูกกับ engine", "ac": "1. Wallet รับ VC ผ่าน flow OpenID4VCI ได้สำเร็จ\n2. รองรับทั้ง pre-authorized และ authorization code flow\n3. ตรวจ proof of possession ก่อนออก VC", "sx": "ด่านหน้าสาธารณะ as an integration engineer, i want to เปิดช่องทาง openid4vci สำหรับการรับมอบ vc, so that wallet รับ vc จาก issuer ได้ตามมาตรฐานสากล"}, "PROTOCOL-02": {"id": "PROTOCOL-02", "what": "เปิด flow ยื่น/ตรวจ VP ตาม OpenID4VP พร้อมป้องกันการยื่นซ้ำ (replay)", "out": "wallet ยื่น VP ให้ verifier ได้อย่างปลอดภัย", "comp": "SSI Protocol Service", "group": "ด่านหน้าสาธารณะ (รับจาก wallet และคนภายนอก)", "color": "#d85a30", "feature": "OpenID4VP (Credential Presentation)", "pri": "Highest", "pts": 8, "dep": "WALLET-03, ADAPTER-02, EDGE-03", "sprint": 3, "status": "Backlog", "ws": "SSI Protocol Service", "phase": "เฟส 2 · 2.1 Issuer core", "scope": "1. ตั้งค่า verificationProtocol ใน one-core ผ่าน config โดยเปิดเวอร์ชัน OpenID4VP ที่ตกลงกับ wallet ปลายทาง และปิดเวอร์ชันที่ไม่ได้ใช้ (one-core มีให้เลือกหลายเวอร์ชัน การเลือกเป็นตัวกำหนดว่า wallet เจ้าไหนใช้งานกับเราได้)\n2. integrate การยื่น/ตรวจ VP ให้ทำผ่าน VCVP Core (VERIFICATION-01)\n3. ทดสอบ flow ยื่น VP และ กัน replay (nonce/audience)\n4. endpoint และ metadata ที่ wallet มองเห็น ต้องอยู่บน domain ของเราเอง (ดู EDGE-03) เพื่อไม่ผูกกับ engine\n5. กำหนดวิธีพิสูจน์ตัวตนผู้ขอตรวจตามมาตรฐาน OpenID4VP (client_id_scheme) โดยฝั่งเราลงนามคำขอตรวจด้วยกุญแจของหน่วยงาน และฝั่ง wallet ต้องตรวจลายเซ็นของคำขอก่อนแสดงชื่อผู้ขอและก่อนขอความยินยอม ถ้าตรวจไม่ผ่านให้ปฏิเสธพร้อมเตือนผู้ใช้ โดยเลือกวิธีผ่าน config ได้โดยไม่แก้โค้ด (one-core รองรับ redirect_uri / verifier_attestation / did / x509_san_dns) และเทียบตัวตนที่ยืนยันได้นั้นกับทะเบียนหน่วยงานที่เชื่อถือได้ (TRUST-03) แล้วแสดงผลให้ผู้ถือเห็นก่อนกดยินยอม กรณีไม่อยู่ในทะเบียนให้เตือนชัดเจนและต้องยืนยันเพิ่มอีกครั้ง แต่ไม่ปิดกั้นการยื่น เพราะเป็นสิทธิ์ตัดสินใจของเจ้าของข้อมูล (ทะเบียนที่ wallet ใช้มาจาก endpoint สาธารณะที่ TRUST-03 เผยแพร่ ความสามารถส่วนเทียบทะเบียนจึงเริ่มใช้ได้เมื่อ TRUST-03 เสร็จ ส่วนการตรวจลายเซ็นคำขอทำได้ตั้งแต่ sprint นี้)", "ac": "1. Verifier ส่ง request และรับ VP กลับได้สำเร็จ\n2. ตรวจ nonce/audience กัน replay\n3. รองรับ VP ที่ผ่าน selective disclosure\n4. กรณีคำขอตรวจที่ลายเซ็นไม่ถูกต้องหรือไม่มีลายเซ็น wallet จะแสดงคำเตือนว่ายืนยันตัวตนผู้ขอไม่ได้ และยื่น VP ต่อไม่ได้\n5. ผู้ขอตรวจที่ไม่อยู่ในทะเบียนหน่วยงานที่เชื่อถือได้ wallet แสดงคำเตือนและต้องให้ผู้ถือยืนยันเพิ่มอีกครั้งก่อนจึงยื่น VP ได้ (ทดสอบข้อนี้ได้เมื่อ TRUST-03 เผยแพร่ทะเบียนแล้ว)", "sx": "ด่านหน้าสาธารณะ as an integration engineer, i want to เปิดช่องทาง openid4vp สำหรับการยื่นตรวจ vp, so that verifier ขอและรับ vp จาก wallet ได้ตามมาตรฐานสากล"}, "PROTOCOL-03": {"id": "PROTOCOL-03", "what": "ให้กระเป๋าสร้างและให้ผู้ตรวจตรวจ Key Binding JWT ที่ผูก nonce, aud, sd_hash และ iat", "out": "บัตรที่ถูกคัดลอกไปใช้ต่อยื่นผ่านไม่ได้", "comp": "SSI Protocol Service", "group": "ด่านหน้าสาธารณะ (รับจาก wallet และคนภายนอก)", "color": "#d85a30", "feature": "Key Binding JWT (Holder Proof of Possession)", "pri": "Highest", "pts": 5, "dep": "PROTOCOL-02, IDENTITY-06", "sprint": 3, "status": "Backlog", "ws": "SSI Protocol Service", "phase": "เฟส 2 · 2.1 Issuer core", "scope": "1. ฝั่งกระเป๋าสร้าง Key Binding JWT (typ = kb+jwt) ทุกครั้งที่ยื่น VP โดยเซ็นด้วยกุญแจในเครื่องที่ผูกกับ cnf ในตัว VC\n2. KB-JWT ต้องมีครบ 4 ฟิลด์ nonce (ค่าสุ่มจากผู้ตรวจ ใช้ซ้ำไม่ได้), aud (ผูกกับผู้ตรวจรายนี้), sd_hash (ผูกกับชุด disclosure รอบนี้), iat (เวลาที่เซ็น)\n3. ฝั่งผู้ตรวจตรวจลายเซ็นกับ public key ใน cnf ของ VC แล้วตรวจ nonce ว่าไม่ซ้ำ, aud ว่าเป็นตัวเอง, sd_hash ว่าตรงกับ disclosure ที่ได้รับ และ iat ว่าอยู่ในช่วงเวลาที่ยอมรับ\n4. ฝั่ง VCVP Core ต้องฝัง cnf ลงในบัตรตอนออก VC ในรูปแบบ SD_JWT ที่ใช้จริง และต้องยังฝังได้ถูกต้องด้วยถ้าเปิดใช้ SD_JWT_VC เพิ่มภายหลัง\n5. เก็บ nonce ที่ใช้แล้วเพื่อกันการยื่นซ้ำ พร้อมกำหนดอายุและวิธีล้าง", "ac": "1. VP ที่ไม่มี KB-JWT ถูกปฏิเสธ\n2. VP ที่ KB-JWT เซ็นด้วยกุญแจที่ไม่ตรงกับ cnf ถูกปฏิเสธ\n3. การยื่น VP ซ้ำด้วย nonce เดิมถูกปฏิเสธ\n4. VP ที่ aud ไม่ตรงกับผู้ตรวจรายนั้นถูกปฏิเสธ\n5. VP ที่สลับชุด disclosure จน sd_hash ไม่ตรงถูกปฏิเสธ\n6. มีชุดทดสอบครอบทั้ง 5 กรณีข้างต้นและผ่านทั้งหมด", "sx": "ด่านหน้าสาธารณะ as a verifier, i want to ตรวจ key binding jwt ที่ผู้ถือเซ็นแนบมากับ vp, so that บัตรที่ถูกคัดลอกไปใช้ต่อไม่สามารถยื่นผ่านได้"}, "IDENTITY-01": {"id": "IDENTITY-01", "what": "ล็อกอินด้วย SSO/MFA พร้อมจัดการ session และ token", "out": "เฉพาะเจ้าหน้าที่ที่ได้รับอนุญาตเข้า Portal ได้", "comp": "IAM & Tenant Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "Admin Authentication & SSO", "pri": "Highest", "pts": 8, "dep": "PLATFORM-02", "sprint": 0, "status": "Backlog", "ws": "IAM & Tenant Service", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. Portal authentication: รองรับวิธียืนยันตัวตนที่กำหนด เช่น SSO (OIDC/SAML) + MFA พร้อม session/token (JWT+refresh)\n2. ออก/ตรวจ session ร่วมกับ VCVP Core", "ac": "1. ล็อกอินด้วยวิธีที่กำหนด (เช่น SSO/OIDC) และออก session token ได้สำเร็จ\n2. บังคับ MFA สำหรับ role ที่มีสิทธิ์สูง (admin)\n3. Token หมดอายุและ refresh ได้ และ logout revoke session ทันที", "sx": "ระบบภายใน as a portal administrator, i want to ล็อกอินเข้าระบบหลังบ้านด้วยวิธีการยืนยันตัวตนที่กำหนด, so that เฉพาะเจ้าหน้าที่ที่ได้รับอนุญาตเท่านั้นที่เข้าถึง portal ได้"}, "IDENTITY-04": {"id": "IDENTITY-04", "what": "สร้างฐานข้อมูลของ VCVP Core พร้อม org scoping และ mapping ID", "out": "ระบบเก็บสถานะของตัวเองได้ และข้อมูลข้ามองค์กรกันไม่ได้", "comp": "IAM & Tenant Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "Multi-tenant Context & Data Store", "pri": "High", "pts": 8, "dep": "ADAPTER-01, PLATFORM-04", "sprint": 0, "status": "Backlog", "ws": "IAM & Tenant Service", "phase": "เฟส 0 เตรียมการและติดตั้ง", "scope": "1. ออกแบบ และสร้างฐานข้อมูลของ VCVP Core (issuance/verification/revocation/consent records)\n2. ผูก/แยกข้อมูลตาม organization/tenant (org scoping) ไม่ปนข้ามองค์กร\n3. จับคู่ (mapping) ID และสถานะระหว่าง entity ของเรากับ object ใน engine โดย ID และสถานะที่ client เห็นต้องเป็นของเราเอง (ID ของ engine ไม่หลุดออกนอก adapter)\n4. เก็บสถานะอื่นๆ ที่เกี่ยวข้องกับการทำงาน แต่ที่ engine ไม่มี (เช่น offer pending/claimed, webhook status)", "ac": "1. ทุก record ถูกผูกและ query ตาม tenant ได้ถูกต้อง\n2. ผู้ใช้ต่างองค์กรเข้าถึงข้อมูลข้ามกันไม่ได้\n3. map สถานะกับ engine ได้ตรง (sync ไม่หลุด)\n4. สถานะที่ engine ไม่มี (เช่น offer pending/claimed, webhook status) ถูกเก็บและอ่านกลับได้ถูกต้อง", "sx": "ระบบภายใน as a backend engineer, i want to ให้ vcvp core มีฐานข้อมูลของตัวเองพร้อม org scoping, so that เก็บสถานะ/record ที่ one-core ไม่ได้เก็บ และแยกข้อมูลตามองค์กร"}, "IDENTITY-02": {"id": "IDENTITY-02", "what": "บริหารองค์กร (tenant) และผูก DID/key ของแต่ละองค์กร", "out": "หลายหน่วยงานใช้ระบบเดียวกันได้โดยข้อมูลแยกขาด", "comp": "IAM & Tenant Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "Multi-Tenancy / Organization Management", "pri": "Highest", "pts": 8, "dep": "IDENTITY-01, IDENTITY-04", "sprint": 1, "status": "Backlog", "ws": "IAM & Tenant Service", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. Portal UI บริหารจัดการองค์กร (tenant) สร้าง/แก้ไข โดยทำได้เฉพาะ Super Admin ของแพลตฟอร์ม (บังคับสิทธิ์จริงที่ IDENTITY-03)\n2. ผู้ใช้เข้าถึงได้เฉพาะข้อมูลขององค์กรตัวเอง โดย VCVP Core ตรวจทุก request ยกเว้นข้อมูลที่เผยแพร่สู่สาธารณะโดยเจตนา (did.json, status list, schema/type metadata ที่เผยแพร่แล้ว, trust list) ซึ่งเข้าถึงได้ข้ามองค์กร\n3. ผูก DID และกุญแจลงนามของแต่ละองค์กร โดยรองรับทั้งกรณีที่กุญแจอยู่ในระบบของเรา และกรณีที่องค์กรถือกุญแจไว้เอง (ที่เก็บกุญแจกำหนดได้รายองค์กร ดู KEY-03)", "ac": "1. สร้าง/แก้ไของค์กรได้ และข้อมูลถูก scope ตาม tenant\n2. ทรัพยากร (schema, VC, key) ผูกกับ organization ที่ถูกต้อง", "sx": "ระบบภายใน as a platform operator, i want to บริหารหลายองค์กร (tenant) บน portal เดียว, so that แต่ละหน่วยงาน issuer/verifier มีข้อมูลและสิทธิ์แยกขาดจากกัน"}, "IDENTITY-03": {"id": "IDENTITY-03", "what": "กำหนด role/permission และบังคับสิทธิ์ที่ทุก endpoint", "out": "แต่ละคนทำได้เฉพาะสิ่งที่ตรงกับบทบาทของตน", "comp": "IAM & Tenant Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "Role-Based Access Control (RBAC)", "pri": "Highest", "pts": 8, "dep": "IDENTITY-02", "sprint": 1, "status": "Backlog", "ws": "IAM & Tenant Service", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. RBAC: role/permission model 5 role — Super Admin (ระดับแพลตฟอร์ม), Admin (ระดับองค์กร), Issuer, Verifier และ Auditor\n2. บังคับสิทธิ์ที่ VCVP Core (ทุก endpoint) และ Portal UI ซ่อน/แสดงตาม role\n3. assign role ต่อผู้ใช้ในแต่ละ org โดยผู้ใช้หนึ่งคนถือได้หลาย role\n4. กำหนดขอบเขตข้ามองค์กร: Super Admin เข้าถึงข้ามองค์กรได้ (เช่น สร้าง/แก้ไของค์กรที่ IDENTITY-02 และจัดการทะเบียนหน่วยงานที่ TRUST-01) ส่วน role อื่นทั้งหมดจำกัดอยู่ที่องค์กรตัวเองเท่านั้น และ Auditor เข้าถึง audit log ได้อย่างเดียว เรียกคำสั่งที่เปลี่ยนแปลงข้อมูลไม่ได้", "ac": "1. ผู้ใช้เห็นและทำได้เฉพาะเมนูและการกระทำตาม role\n2. การเรียก API ที่ไม่มีสิทธิ์ return 403\n3. เปลี่ยน role ของผู้ใช้แล้วสิทธิ์อัปเดตทันทีใน session ถัดไป\n4. Super Admin เข้าถึงข้ามองค์กรได้ ส่วน role อื่นเข้าถึงข้ามองค์กรไม่ได้แม้จะรู้ id ของข้อมูล\n5. Auditor เรียกคำสั่งที่เปลี่ยนแปลงข้อมูลไม่ได้ ระบบปฏิเสธพร้อมเหตุผล", "sx": "ระบบภายใน as a portal administrator, i want to กำหนดบทบาทและสิทธิ์ (admin / issuer operator / verifier operator / auditor), so that ควบคุมว่าใครทำอะไรได้บ้างในระบบ"}, "IDENTITY-06": {"id": "IDENTITY-06", "what": "ให้ Wallet ของประชาชนยืนยันตัวตนกับ VCVP Core และผูกกับเครื่อง", "out": "คำขอจากกระเป๋าผูกกับเจ้าของจริง ดึงหรือแก้ข้อมูลของคนอื่นไม่ได้", "comp": "IAM & Tenant Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "Wallet Holder Authentication & Device Binding", "pri": "Highest", "pts": 8, "dep": "WALLET-01, IDENTITY-03, IDENTITY-04", "sprint": 2, "status": "Backlog", "ws": "IAM & Tenant Service", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. ผูกกระเป๋ากับตัวบุคคลครั้งแรก (device binding) ผ่านช่องทางยืนยันตัวตนที่หน่วยงานกำหนด (เช่น OIDC/ThaID) แล้วผูกกับ public key ของผู้ถือที่สร้างจากกุญแจในเครื่อง (WALLET-01) โดยไม่ต้องสร้าง holder DID เพราะการลงนาม VC/VP อ้างอิงกุญแจผ่าน cnf ในตัว VC อยู่แล้ว\n2. หลังผูกแล้ว ทุก request ใช้การพิสูจน์การถือครองกุญแจแบบ challenge-response แทนการล็อกอินซ้ำ โดย VCVP Core ออก challenge และตรวจลายเซ็นกับ public key ที่ผูกไว้\n3. ออก session/token ให้กระเป๋า และให้ VCVP Core ตรวจทุก request ว่าเข้าถึงได้เฉพาะข้อมูลของเจ้าของ token นั้น โดยใช้กลไกเดียวกับ IDENTITY-03\n4. รองรับกรณีอุปกรณ์สูญหายหรือเปลี่ยนเครื่อง: เพิกถอน binding เดิม และผูกเครื่องใหม่ได้\n5. กัน replay ของ challenge (ใช้ได้ครั้งเดียวและหมดอายุ) และจำกัดอัตราการเรียก\n6. บันทึก audit log ของการผูก การเพิกถอน และการยืนยันตัวตนที่ล้มเหลว (AUDIT-01)", "ac": "1. Wallet ที่ยังไม่ผูก เรียก endpoint ฝั่ง Wallet ไม่ได้ (return 401)\n2. Wallet A ดึงหรือแก้ข้อมูลของ Wallet B ไม่ได้ (return 403) ทดสอบครอบทุก endpoint ฝั่ง Wallet ที่เปิดใช้แล้ว ณ เวลานั้น\n3. ผูกเครื่องใหม่และเพิกถอนเครื่องเดิมได้ และเครื่องเดิมใช้งานต่อไม่ได้ทันที\n4. challenge ใช้ซ้ำไม่ได้และหมดอายุตามที่กำหนด\n5. มี audit log ของการผูก เพิกถอน และการยืนยันตัวตนที่ล้มเหลว", "sx": "ระบบภายใน as a backend engineer, i want to ให้ wallet ของประชาชนยืนยันตัวตนกับ vcvp core ได้, so that คำขอที่ส่งจากกระเป๋าถูกผูกกับเจ้าของจริง และไม่มีใครดึงหรือแก้ข้อมูลของคนอื่นได้"}, "IDENTITY-05": {"id": "IDENTITY-05", "what": "สร้าง/แก้ไข/ระงับผู้ใช้ และกำหนด role ต่อองค์กร", "out": "ผู้ดูแลจัดการผู้ใช้และสิทธิ์ได้เองโดยไม่ต้องพึ่ง dev", "comp": "IAM & Tenant Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "User Management (CRUD)", "pri": "Medium", "pts": 5, "dep": "IDENTITY-03", "sprint": 6, "status": "Backlog", "ws": "IAM & Tenant Service", "phase": "เฟส 3 · 3.1 Final test", "scope": "Implement user management: แสดงรายชื่อผู้ใช้พร้อม role/organization, สร้าง/แก้ไข/ระงับผู้ใช้ และ assign role/org ผูกกับ RBAC และบันทึก audit log ของทุกการเปลี่ยนแปลง", "ac": "1. แสดงรายชื่อผู้ใช้พร้อม role/organization\n2. สร้าง/แก้ไข/ระงับผู้ใช้และกำหนด role ได้\n3. การเปลี่ยนแปลงผูกกับ RBAC และบันทึก audit log", "sx": "ระบบภายใน as a portal administrator, i want to สร้าง แก้ไข และกำหนดบทบาทผู้ใช้ในองค์กร, so that บริหารทีมงานและสิทธิ์เข้าถึงได้ครบวงจร"}, "TRUST-01": {"id": "TRUST-01", "what": "เก็บรายชื่อหน่วยงานผู้ออกที่เชื่อถือได้พร้อมสถานะการรับรอง ตั้งค่าผ่าน config", "out": "Wallet ตรวจได้ตั้งแต่วันแรกว่า VC มาจากหน่วยงานที่ได้รับการรับรอง", "comp": "Trust Registry Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "Trusted Issuer List (Core)", "pri": "High", "pts": 3, "dep": "IDENTITY-02", "sprint": 1, "status": "Backlog", "ws": "Trust Registry Service", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. เก็บรายชื่อหน่วยงานผู้ออกเอกสารพร้อม identifier (DID) ชื่อ โลโก้ สถานะการรับรอง และวันหมดอายุ โดยระยะนี้ตั้งค่าผ่าน config ยังไม่ต้องมีหน้าจอ (หน้าจอและ endpoint สาธารณะอยู่ที่ TRUST-03)\n2. เปิด interface ภายในให้ VCVP Core และ Wallet เรียกตรวจได้ว่าหน่วยงานรายหนึ่งอยู่ในรายชื่อและยังไม่หมดอายุการรับรองหรือไม่\n3. ออกแบบโครงสร้างข้อมูลและ interface ให้เปลี่ยนแหล่งที่มาภายหลังได้โดยไม่แก้โค้ดฝั่งที่เรียกใช้ (TRUST-03)", "ac": "1. VCVP Core และ Wallet เรียกตรวจได้ว่าหน่วยงานผู้ออกเอกสารรายหนึ่งอยู่ในรายชื่อหรือไม่\n2. หน่วยงานที่หมดอายุการรับรองแล้วถือว่าไม่ผ่านทันที\n3. Wallet ปฏิเสธ VC จากหน่วยงานที่ไม่อยู่ในรายชื่อ พร้อมแจ้งเหตุผลที่ผู้ใช้เข้าใจได้ (WALLET-07)\n4. เปลี่ยนรายชื่อผ่าน config ได้โดยไม่แก้โค้ด", "sx": "ระบบภายใน as a backend engineer, i want to ให้ระบบมีรายชื่อหน่วยงานผู้ออกเอกสารที่เชื่อถือได้พร้อมสถานะการรับรอง, so that wallet ตรวจได้ตั้งแต่วันแรกว่า vc ที่จะรับเข้ากระเป๋ามาจากหน่วยงานที่ได้รับการรับรอง"}, "TRUST-03": {"id": "TRUST-03", "what": "หน้าจอจัดการทะเบียน เผยแพร่ trust list สาธารณะ และสลับแหล่งที่มาได้", "out": "ระบบปลายทางดึงทะเบียนไปตรวจเองได้ และย้ายไปใช้ทะเบียนของผู้กำกับดูแลได้ในอนาคต", "comp": "Trust Registry Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "Trusted Registry Console & Publication", "pri": "High", "pts": 5, "dep": "TRUST-01, IDENTITY-03, EDGE-03", "sprint": 2, "status": "Backlog", "ws": "Trust Registry Service", "phase": "เฟส 1 ตั้งค่าและฐานระบบ", "scope": "1. หน้าจอสำหรับจัดการทะเบียนหน่วยงานที่เชื่อถือได้ ครอบคลุมทั้งบทบาท issuer และ verifier (เพิ่ม/ถอน และ accreditation status ตาม ETDA) โดยทำได้เฉพาะ Super Admin ของแพลตฟอร์ม (IDENTITY-03)\n2. เผยแพร่ trust list เป็น endpoint สาธารณะบน domain ของเรา (EDGE-03) ให้ระบบปลายทางดึงไปใช้ได้\n3. รองรับแหล่งที่มาของ trust list มากกว่าหนึ่งแหล่ง โดยเลือกแหล่งที่ใช้งานผ่าน config ได้โดยไม่แก้โค้ด และให้ VCVP Core เป็นผู้แปลงข้อมูลจากแหล่งนั้นเป็นโครงสร้างภายในของเรา ไม่ผูกกับรูปแบบของแหล่งใดแหล่งหนึ่ง เฟสแรกใช้ทะเบียนที่เราเผยแพร่เอง และเมื่อผู้กำกับดูแลภายนอกเปิดบริการ ให้สลับไปใช้แหล่งนั้นได้ พร้อมมีขั้นตอนเทียบรายการระหว่างสองแหล่งก่อนสลับ (ตัวเชื่อมกับแหล่งภายนอกจริงต้องรอให้ผู้กำกับดูแลประกาศรูปแบบและเปิดบริการก่อน จึงอยู่นอกขอบเขตเฟสนี้)\n4. ย้ายรายชื่อที่ตั้งค่าไว้ผ่าน config ใน TRUST-01 เข้ามาอยู่ในทะเบียน โดยผลการตรวจของ Wallet ต้องไม่เปลี่ยน", "ac": "1. Super Admin เพิ่ม ถอน และแก้สถานะการรับรองของหน่วยงานได้จากหน้าจอ ทั้งบทบาท issuer และ verifier\n2. บันทึกสถานะการรับรองและวันหมดอายุของแต่ละหน่วยงาน และเมื่อหมดอายุแล้วมีผลทันที\n3. ระบบปลายทางดึง trust list จาก endpoint สาธารณะไปตรวจได้ว่าหน่วยงานรายหนึ่งอยู่ในทะเบียนหรือไม่\n4. สลับแหล่งที่มาของ trust list ผ่าน config ได้โดยไม่แก้โค้ด และอ่านรายการได้ผลถูกต้องเหมือนกันไม่ว่าจะใช้แหล่งใด (ทดสอบด้วยแหล่งจำลองได้)\n5. หลังย้ายจาก config มาเป็นทะเบียนแล้ว ผลการตรวจของ Wallet เหมือนเดิมทุกกรณี", "sx": "ระบบภายใน as a governance administrator, i want to บริหารทะเบียนหน่วยงานที่เชื่อถือได้ผ่านหน้าจอ และเผยแพร่เป็น endpoint สาธารณะ, so that ระบบปลายทางดึงไปตรวจสอบได้เอง และสลับไปใช้ทะเบียนของผู้กำกับดูแลได้ในอนาคต"}, "TRUST-02": {"id": "TRUST-02", "what": "ให้ขั้นตอนตรวจ VP ใช้ trust list คัดกรองทั้ง issuer และ verifier", "out": "ปฏิเสธ VC จากผู้ออกนอกทะเบียน และเปิด session ให้เฉพาะผู้ตรวจที่ได้รับอนุญาต", "comp": "Trust Registry Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "Trusted Verifier Registry & Trust Policy Enforcement", "pri": "High", "pts": 5, "dep": "TRUST-03, VERIFICATION-03, PROTOCOL-02", "sprint": 4, "status": "Backlog", "ws": "Trust Registry Service", "phase": "เฟส 2 · 2.2 VC และ VP ครบวงจร", "scope": "1. ขั้นตอนตรวจ VP ดึง trust list ล่าสุดจาก TRUST-01 มาใช้อัตโนมัติ (VERIFICATION-03) และปฏิเสธ VC ที่ออกโดย issuer ที่ไม่อยู่ในทะเบียนหรือหมดอายุการรับรองแล้ว\n2. verifier ที่ไม่อยู่ในทะเบียนหรือถูกถอนแล้ว เปิด session ขอตรวจไม่ได้ (VERIFIER-02)\n3. Wallet แสดงให้ผู้ถือเห็นว่าผู้ขอข้อมูลรายนี้เป็นใครและได้รับการรับรองหรือไม่ ก่อนกดยินยอม โดยข้อมูลผู้ขอต้องมาจากคำขอตรวจที่ผ่านการตรวจลายเซ็นแล้วเท่านั้น (PROTOCOL-02)", "ac": "1. ขั้นตอนตรวจ VP ดึง trust list ล่าสุดมาใช้ และปฏิเสธ VC จาก issuer ที่ไม่อยู่ในรายการ\n2. verifier ที่ไม่อยู่ในทะเบียนหรือถูกถอนแล้ว เปิด session ขอตรวจไม่ได้\n3. Wallet แสดงให้ผู้ถือเห็นว่าผู้ขอข้อมูลเป็นใครและได้รับการรับรองหรือไม่ ก่อนกดยินยอม\n4. ผลการตรวจถูกต้องเหมือนกันไม่ว่า trust list จะมาจากแหล่งใด (ทดสอบด้วยแหล่งจำลองได้)", "sx": "ระบบภายใน as a verifier administrator, i want to ให้ขั้นตอนตรวจ vp ใช้ trust list คัดกรองทั้ง issuer และ verifier, so that ระบบยอมรับเฉพาะ vc จากหน่วยงานที่ผ่านการรับรอง และเปิด session ให้เฉพาะ verifier ที่อยู่ในทะเบียน"}, "ISSUANCE-01": {"id": "ISSUANCE-01", "what": "บันทึก event การออก/เพิกถอน พร้อมเวลาและผู้กระทำ", "out": "ตรวจย้อนหลังได้ว่าใครออก VC ใบไหนเมื่อไหร่", "comp": "Issuance Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Issuance Audit & Logging", "pri": "Medium", "pts": 5, "dep": "ENGINE-02, REVOCATION-01", "sprint": 3, "status": "Backlog", "ws": "Issuance Service", "phase": "เฟส 2 · 2.1 Issuer core", "scope": "เพิ่ม audit trail แบบ append-only สำหรับ event issue/cancel/revoke/suspend พร้อม timestamp, actor, credential id, เหตุผล (ถ้ามี) (โดยไม่เก็บข้อมูลส่วนบุคคล) เพื่อรองรับ compliance และ PDPA และเปิดให้ค้นหา log ตาม credential id และช่วงเวลาได้ผ่าน API ของ VCVP Core (หน้าจอค้นหาอยู่ที่ AUDIT-01)", "ac": "1. ทุก event การออก/เพิกถอนถูกบันทึกพร้อม timestamp และผู้กระทำ\n2. Log ไม่มีข้อมูลส่วนบุคคล (PII) ในรูปแบบ plain text\n3. ค้นหา log ตาม credential id และช่วงเวลาได้", "sx": "งานหลักของระบบ as an issuer operator, i want to บันทึก audit log ของการออกและเพิกถอน vc ทุกครั้ง, so that ตรวจสอบย้อนหลังได้ตามข้อกำหนดกำกับดูแล"}, "ISSUANCE-02": {"id": "ISSUANCE-02", "what": "ควบคุม flow และสถานะการออก VC ตั้งแต่สร้าง offer จนผู้ถือรับสำเร็จ", "out": "ดำเนินการออก VC ในรูปแบบ QR และติดตามสถานะจนผู้ถือรับสำเร็จ", "comp": "Issuance Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Issuance Workflow Orchestration", "pri": "Highest", "pts": 13, "dep": "IDENTITY-04, PROTOCOL-01", "sprint": 3, "status": "Backlog", "ws": "Issuance Service", "phase": "เฟส 2 · 2.1 Issuer core", "scope": "1. รับคำขอออก VC จาก Portal และเรียก engine ผ่าน interface กลาง สร้าง credential offer (OpenID4VCI)\n2. สร้าง/บันทึก issuance record และ สถานะ (pending/claimed/expired/cancelled)\n3. return QR/deeplink ให้ Portal\n4. sync สถานะ offer จาก engine ผ่าน interface กลาง\n5. รองรับ idempotency (ส่งคำขอซ้ำต้องไม่ได้ VC ซ้ำ) และตั้งงานเบื้องหลังตามรอบเวลา เปลี่ยนสถานะ offer ที่เกินกำหนดแล้วยังไม่มีผู้มารับให้เป็นหมดอายุ เพื่อไม่ให้ QR เดิมถูกนำไปใช้ภายหลัง (one-core มี task INTERACTION_EXPIRATION_CHECK ให้ใช้)\n6. รองรับการยกเลิก offer ที่ยังไม่ถูกรับ โดยเปลี่ยนสถานะเป็นยกเลิกและทำให้ QR/deeplink เดิมใช้ไม่ได้อีก ส่วน offer ที่ถูกรับไปแล้วต้องถูกปฏิเสธพร้อมเหตุผล และให้ไปใช้การเพิกถอน (REVOCATION-01) แทน\nหมายเหตุ: sprint นี้ออก VC ได้ครบ flow แต่ใช้ได้เฉพาะ dev/UAT จนกว่ากุญแจจะอยู่ใน KMS (KEY-03) ดูเงื่อนไขที่ PLATFORM-03", "ac": "1. สร้าง credential offer ผ่าน VCVP Core สำเร็จ และได้ QR/deeplink\n2. ติดตามสถานะ offer (pending เป็น claimed) ได้\n3. sync สถานะจาก engine อัปเดตถูกต้อง\n4. ยกเลิก offer ที่ยังไม่ถูกรับได้ และ QR เดิมใช้ต่อไม่ได้ ส่วน offer ที่ถูกรับแล้วระบบต้องปฏิเสธ\n5. ส่งคำขอออก VC ซ้ำด้วยคีย์ idempotency เดิม ได้ผลลัพธ์เดิมและไม่เกิด VC ใบใหม่ และ offer ที่เกินกำหนดถูกเปลี่ยนเป็นหมดอายุอัตโนมัติจนใช้ QR เดิมต่อไม่ได้", "sx": "งานหลักของระบบ as a backend engineer, i want to ให้ vcvp core orchestrate การออก vc ผ่าน one-core, so that portal สั่งออก vc ได้โดยมี vcvp core จัดการ flow และสถานะ"}, "ISSUANCE-04": {"id": "ISSUANCE-04", "what": "เปิดทางเข้า API ให้ระบบของหน่วยงานภายนอกส่งคำขอออก VC ได้ทั้งรายการเดียวและเป็นชุด", "out": "หน่วยงานออก VC จากระบบทะเบียนของตัวเองได้ ไม่ต้องกดทีละใบจากหน้าจอ", "comp": "Issuance Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Bulk / System-to-System Issuance", "pri": "Medium", "pts": 8, "dep": "ISSUANCE-02, INTEGRATION-01, IDENTITY-03", "sprint": 5, "status": "Backlog", "ws": "Issuance Service", "phase": "เฟส 2 · 2.3 ตรวจผ่าน Trust Registry", "scope": "1. เปิดทางเข้า API ใ
