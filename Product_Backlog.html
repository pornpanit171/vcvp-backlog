ุว่ามี VC อ้างอยู่", "sx": "แอปและหน้าจอผู้ใช้ as an issuer operator, i want to สร้างและจัดการ credential schema/template ผ่าน portal, so that กำหนดโครงสร้างข้อมูลใบรับรองได้เอง"}, "ISSUER-02": {"id": "ISSUER-02", "what": "หน้าจอสั่งออก VC แสดง QR และติดตามสถานะ", "out": "เจ้าหน้าที่ออก VC ให้ประชาชนได้จากหน้าจอ", "comp": "Issuer Portal", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Issuance Workflow & Credential Offer", "pri": "Highest", "pts": 5, "dep": "PROTOCOL-01, ISSUER-01, ISSUANCE-02", "sprint": 4, "status": "Backlog", "ws": "Issuer Portal", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. หน้าจอสำหรับ สร้างคำสั่งออก VC แสดง QR/deeplink และ ติดตามสถานะ offer\n2. เรียก VCVP Core เป็นผู้ orchestrate (ISSUANCE-02)", "ac": "1. สร้าง credential offer ผ่าน VCVP Core และแสดง QR/deeplink ได้\n2. ติดตามสถานะ offer (pending เป็น claimed)\n3. ยกเลิก offer ที่ยังไม่ถูก claim ได้", "sx": "แอปและหน้าจอผู้ใช้ as an issuer operator, i want to สร้างคำสั่งออก vc และ credential offer (qr/deeplink) ให้ผู้ถือ, so that ผู้ใช้รับ vc เข้ากระเป๋าได้ผ่าน openid4vci"}, "ISSUER-03": {"id": "ISSUER-03", "what": "ค้นหา VC และสั่งเพิกถอน/ระงับ/ปลดระงับ", "out": "เจ้าหน้าที่เพิกถอน VC ที่มีปัญหาได้ทันที", "comp": "Issuer Portal", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Revocation Management Console", "pri": "High", "pts": 5, "dep": "REVOCATION-01, ISSUER-02, REVOCATION-02", "sprint": 5, "status": "Backlog", "ws": "Issuer Portal", "phase": "Phase 2 เติมความสามารถ", "scope": "1. หน้าจอสำหรับ ค้นหา VC และ สั่ง revoke/suspend/unsuspend\n2. ดำเนินการผ่าน VCVP Core (REVOCATION-02) และ แสดง audit พร้อมเหตุผล", "ac": "1. ค้นหา VC ตาม subject/credential id/วันที่ออกได้\n2. สั่ง revoke/suspend แล้วสถานะใน status list อัปเดตจริง\n3. บันทึกเหตุผลและข้อมูลผู้ดำเนินการทุกครั้ง (audit)", "sx": "แอปและหน้าจอผู้ใช้ as an issuer operator, i want to ค้นหาและสั่งเพิกถอน/ระงับ vc ผ่านหน้าจอ portal, so that จัดการใบรับรองที่ไม่ถูกต้องหรือหมดสิทธิ์ได้ทันที"}, "ISSUER-04": {"id": "ISSUER-04", "what": "dashboard สถิติการออก/เพิกถอน พร้อมประวัติและ export", "out": "ผู้บริหารเห็นภาพรวมการออก VC และดึงรายงานได้", "comp": "Issuer Portal", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Issuance Dashboard & History", "pri": "Medium", "pts": 5, "dep": "ISSUER-02, ISSUER-03", "sprint": 8, "status": "Backlog", "ws": "Issuer Portal", "phase": "Phase 3 พร้อมเปิดใช้จริง", "scope": "1. หน้า dashboard สถิติการออก เพิกถอน และประวัติ (filter/pagination)\n2. ดึงข้อมูลผ่านทาง VCVP Core และสามารถ export CSV หรือ Excel", "ac": "1. แสดงสถิติการออกและเพิกถอนแยกตามช่วงเวลาและ schema\n2. ค้นหา/กรองประวัติและแบ่งหน้า (pagination) ได้\n3. Export รายงานเป็น CSV/Excel ได้", "sx": "แอปและหน้าจอผู้ใช้ as an issuer manager, i want to ดูสถิติและประวัติการออก vc, so that ติดตามปริมาณงานและตรวจสอบย้อนหลังได้"}, "VERIFIER-01": {"id": "VERIFIER-01", "what": "สร้าง template คำขอตรวจ (เลือก claim / issuer ที่ยอมรับ)", "out": "verifier กำหนดเองได้ว่าจะขอดูข้อมูลอะไรบ้าง", "comp": "Verifier Portal", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Proof Request / Presentation Definition Builder", "pri": "Highest", "pts": 8, "dep": "VERIFICATION-03, IDENTITY-03, SCHEMA-01", "sprint": 4, "status": "Backlog", "ws": "Verifier Portal", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. หน้าจอสำหรับ สร้าง proof request template โดยเลือก claim จากรายการ schema ที่ issuer เผยแพร่ไว้ (SCHEMA-01) และเลือก trusted issuers จาก trust list ที่ระบบมี (VERIFICATION-03)\n2. แปลงเป็น presentation definition + บันทึกผ่าน VCVP Core", "ac": "1. สร้างและบันทึก proof request template และเลือก claim ที่ต้องตรวจได้\n2. ระบุ trusted issuers และ required claim ได้ (เช่น age_over flag)\n3. Template ถูกแปลงเป็น presentation definition ที่ถูกต้องตาม OpenID4VP", "sx": "แอปและหน้าจอผู้ใช้ as a verifier operator, i want to สร้าง proof request template โดยเลือก claim ที่ต้องการตรวจ, so that ออกแบบเงื่อนไขการตรวจสอบได้เองตามกรณีใช้งาน"}, "VERIFIER-02": {"id": "VERIFIER-02", "what": "เปิด session ตรวจ แสดง QR และผลแบบ real-time", "out": "จุดบริการตั้งจุดตรวจแล้วรู้ผลทันทีที่ประชาชนสแกน", "comp": "Verifier Portal", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Verification Session & QR Generation", "pri": "Highest", "pts": 5, "dep": "PROTOCOL-02, VERIFIER-01, VERIFICATION-01", "sprint": 5, "status": "Backlog", "ws": "Verifier Portal", "phase": "Phase 2 เติมความสามารถ", "scope": "1. หน้าจอสำหรับ เปิด verification session และ แสดง QR/deeplink พร้อมทั้ง แสดงผล real-time\n2. เรียก VCVP Core เป็นผู้ orchestrate (VERIFICATION-01)", "ac": "1. เปิด session และแสดง QR ให้ผู้ถือยื่น VP ได้\n2. แสดงผล verified/failed พร้อมเหตุผล\n3. กัน replay (จัดการที่ VCVP Core)\n4. เมื่อองค์กรถูกถอนออกจากทะเบียน หน้าจอแสดงเหตุผลที่เปิด session ไม่ได้", "sx": "แอปและหน้าจอผู้ใช้ as a verifier operator, i want to เปิด verification session และสร้าง qr ให้ผู้ถือยื่น vp, so that ดำเนินการตรวจสอบ ณ จุดบริการได้"}, "VERIFIER-03": {"id": "VERIFIER-03", "what": "ประวัติและสถิติการตรวจสอบ พร้อมตัวกรอง", "out": "ย้อนดูได้ว่าตรวจเมื่อไหร่ ผลเป็นอย่างไร", "comp": "Verifier Portal", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Verification Results & History Dashboard", "pri": "Medium", "pts": 5, "dep": "VERIFIER-02", "sprint": 5, "status": "Backlog", "ws": "Verifier Portal", "phase": "Phase 2 เติมความสามารถ", "scope": "1. หน้าจอสำหรับ ประวัติและสถิติการตรวจสอบ VP (filter/pagination)\n2. ดึงข้อมูลจาก VCVP Core (เก็บข้อมูลเท่าที่จำเป็นตาม PDPA)", "ac": "1. แสดงประวัติการตรวจสอบพร้อมผลและเหตุผล\n2. ไม่จัดเก็บ PII เกินจำเป็น (data minimization)\n3. กรองตามช่วงเวลา/template และ export ได้", "sx": "แอปและหน้าจอผู้ใช้ as a verifier manager, i want to ดูประวัติและสถิติการตรวจสอบ vp, so that ตรวจสอบย้อนหลังและวิเคราะห์การใช้งานได้"}, "PLATFORM-01": {"id": "PLATFORM-01", "what": "วาง pipeline build/test/deploy และ Infrastructure as Code", "out": "ปล่อยของขึ้นระบบได้อัตโนมัติ และสร้าง environment ซ้ำได้", "comp": "Platform & Infrastructure", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "CI/CD Pipeline & Infrastructure as Code", "pri": "High", "pts": 8, "dep": "PLATFORM-02", "sprint": 1, "status": "Backlog", "ws": "Platform & Infrastructure", "phase": "Phase 0 ตั้งฐาน", "scope": "ตั้งค่า CI (build/test/lint/security scan) + CD (deploy staging/prod), containerize (Docker), IaC (Terraform/Helm) และ secret management", "ac": "1. ทุก commit ผ่าน pipeline build+test อัตโนมัติ\n2. Deploy ขึ้น staging อัตโนมัติ และ prod แบบ approval", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a devops engineer, i want to มี ci/cd และ infrastructure as code, so that build/test/deploy ได้อัตโนมัติ ปลอดภัย และทำซ้ำได้"}, "PLATFORM-02": {"id": "PLATFORM-02", "what": "บิลด์และ deploy engine พร้อม health check และ smoke test", "out": "มี engine ที่รันได้จริงบน environment ของเรา", "comp": "Platform & Infrastructure", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "one-core Installation, Deployment & Initialization", "pri": "Highest", "pts": 8, "dep": "None", "sprint": 1, "status": "Backlog", "ws": "Platform & Infrastructure", "phase": "Phase 0 ตั้งฐาน", "scope": "1. Install/Build one-core (engine ของ Procivis) บน environment ที่กำหนด และ version pinning (reproducible build)\n2. จัดการ dependency ของ native module (เช่น crypto/SDK) และ containerize\n3. รัน one-core เป็นบริการ \n4. wiring health check (/health) สำหรับ readiness/liveness เข้ากับ container platform ที่เลือก และ smoke test (health/version) หลัง deploy\n5. verify ว่า one-core boot แล้ว provider โหลดครบ ไม่มี error\nหมายเหตุ: เฟสนี้ติดตั้ง engine ตัวเดียว การติดตั้งและดูแล engine ตัวที่สองอยู่นอกขอบเขตเฟสนี้ แต่โครงสร้างซอฟต์แวร์ต้องรองรับไว้แล้ว (ENGINE-04 / ENGINE-07)", "ac": "1. รัน one-core บน environment ที่กำหนด และผ่าน smoke test (health/version)\n2. ระบุและล็อกเวอร์ชันของ one-core/SDK ได้ชัดเจน (reproducible build)\n3. one-core boot แล้วโหลด provider ครบทุกตัวโดยไม่มี error ใน log\n4. GET /health return 200 และ แสดงสถานะ provider และต่อ readiness/liveness probe กับ orchestrator ได้\n5. มีเอกสารขั้นตอนติดตั้ง/รันที่ทีมทำซ้ำได้", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a devops engineer, i want to ติดตั้งและ deploy one-core (engine ของ procivis) เป็นบริการที่รันได้, so that ทีมมีบริการกลางของระบบ vcvp พร้อมใช้งานบนทุก environment"}, "PLATFORM-03": {"id": "PLATFORM-03", "what": "แยก environment Dev/UAT/PreProd/Prod และกำหนด promotion path", "out": "ทดสอบก่อนขึ้นจริงได้โดยไม่กระทบระบบผลิต", "comp": "Platform & Infrastructure", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Multi-Environment Provisioning (Dev / UAT / PreProd / Prod)", "pri": "High", "pts": 8, "dep": "PLATFORM-02", "sprint": 1, "status": "Backlog", "ws": "Platform & Infrastructure", "phase": "Phase 0 ตั้งฐาน", "scope": "1. สร้าง environment แยกพร้อม network/resource sizing\n2. แยก config/secret ต่อ env\n3. แยกฐานข้อมูลและ DID/host ต่อ env\n4. กำหนด promotion path ระหว่าง environment", "ac": "1. มี environment Dev / UAT / PreProd / Prod แยกข้อมูลและ config ขาดจากกัน\n2. ทรัพยากร (DB, secret, DID/host) ของแต่ละ env แยกขาดจากกัน ไม่ปะปนกัน\n3. มี promotion path ที่ชัดเจนในการเลื่อนงานระหว่าง env", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a platform engineer, i want to จัดเตรียม environment แยก dev / uat / preprod / prod, so that พัฒนา ทดสอบ และใช้งานจริงโดยไม่กระทบกัน"}, "PLATFORM-04": {"id": "PLATFORM-04", "what": "ติดตั้งฐานข้อมูล เปิด encryption-at-rest และรัน migration", "out": "ข้อมูลถูกเก็บอย่างปลอดภัยและอัปเกรดโครงสร้างได้", "comp": "Platform & Infrastructure", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Database Provisioning, Encryption & Migration", "pri": "High", "pts": 8, "dep": "PLATFORM-02", "sprint": 1, "status": "Backlog", "ws": "Platform & Infrastructure", "phase": "Phase 0 ตั้งฐาน", "scope": "1. ติดตั้ง/กำหนดค่า MariaDB/PostgreSQL\n2. เปิด encryption-at-rest\n3. รัน schema migration ของ Core\n4. ตั้ง connection pooling และ baseline backup", "ac": "1. ฐานข้อมูลถูกสร้างและรัน migration ของ Core สำเร็จ\n2. เปิดใช้ encryption-at-rest และจำกัดสิทธิ์การเข้าถึง (least privilege)\n3. ทดสอบ connect จาก Core สำเร็จ และมี baseline backup", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a platform engineer, i want to จัดเตรียมฐานข้อมูลของ one-core พร้อมเข้ารหัสและ migration, so that ข้อมูลระบบถูกจัดเก็บอย่างปลอดภัยและ schema พร้อมใช้งาน"}, "PLATFORM-05": {"id": "PLATFORM-05", "what": "ตั้ง NTP ให้ทุก node และตรวจ clock drift", "out": "เวลาใน log และการตรวจอายุ VC ตรงกันทั้งระบบ", "comp": "Platform & Infrastructure", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Clock Synchronization (NTP) Across Nodes", "pri": "Medium", "pts": 3, "dep": "PLATFORM-03", "sprint": 1, "status": "Backlog", "ws": "Platform & Infrastructure", "phase": "Phase 0 ตั้งฐาน", "scope": "1. ตั้งค่า NTP/time sync ให้ทุก node (one-core, VCVP Core, Portal) อ้างอิงแหล่งเวลาเดียวกัน\n2. ตรวจสอบ clock drift และ alert เมื่อเกิน threshold ที่กำหนด", "ac": "1. ทุก node เวลาตรงกัน (clock drift < threshold ที่กำหนด)\n2. timestamp ใน audit log และการตรวจ validity ของ credential อ้างอิงเวลาที่ sync แล้ว", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a devops/platform engineer, i want to ให้ทุก server/node sync เวลาจากแหล่ง ntp เดียวกัน, so that timestamp ใน log และการตรวจสอบช่วงเวลาของ credential ถูกต้องตรงกัน (iso 27001 clock sync)"}, "PLATFORM-06": {"id": "PLATFORM-06", "what": "บังคับ TLS, rate limit, input validation และ security headers", "out": "ระบบทนต่อการโจมตีพื้นฐานตามเกณฑ์ OWASP", "comp": "Platform & Infrastructure", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Transport & API Security Hardening", "pri": "High", "pts": 5, "dep": "PLATFORM-02", "sprint": 6, "status": "Backlog", "ws": "Platform & Infrastructure", "phase": "Phase 2 เติมความสามารถ", "scope": "Hardening ระดับ platform: enforce TLS 1.2+, rate limiting, input/schema validation, CORS policy, security headers และ secret management ตาม OWASP ASVS", "ac": "1. ทุก endpoint บังคับ HTTPS และปฏิเสธ HTTP\n2. มี rate limiting และตอบ 429 เมื่อเกิน threshold\n3. Input ที่ผิด schema ถูกปฏิเสธพร้อม error message ที่ไม่เปิดเผยข้อมูลภายใน", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a security engineer, i want to บังคับใช้ tls, rate limiting และ input validation ทุก endpoint, so that ป้องกันการโจมตีและข้อมูลรั่วไหล"}, "PLATFORM-07": {"id": "PLATFORM-07", "what": "ออกแบบ HA/failover, backup/restore drill และสำรอง key", "out": "ระบบล่มแล้วกู้คืนได้ตาม RPO/RTO และ key ไม่สูญหาย", "comp": "Platform & Infrastructure", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "High Availability, Backup & Disaster Recovery", "pri": "Medium", "pts": 13, "dep": "PLATFORM-01", "sprint": 8, "status": "Backlog", "ws": "Platform & Infrastructure", "phase": "Phase 3 พร้อมเปิดใช้จริง", "scope": "1. ออกแบบ HA (redundancy, load balancing) และ failover plan\n2. automated DB backup ,  restore drill และ กำหนด RPO/RTO\n3. Key backup & escrow ของ issuer signing key (เช่น Shamir Secret Sharing / KMS backup) และ test recovery กัน key หาย = VC verify ไม่ได้", "ac": "1. ระบบรองรับ node ล่มโดยไม่หยุดบริการ (HA)\n2. มี backup อัตโนมัติ (DB และ key) และทดสอบ restore/recovery สำเร็จ\n3. มีเอกสาร RPO/RTO, runbook กู้คืน และ key escrow procedure", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a platform operator, i want to ให้ระบบมี ha และแผนสำรอง/กู้คืน, so that บริการต่อเนื่องและกู้คืนข้อมูลได้เมื่อเกิดเหตุ"}, "INTEGRATION-01": {"id": "INTEGRATION-01", "what": "ออก/เพิกถอน API key และลงทะเบียน webhook พร้อม retry", "out": "ระบบของหน่วยงานอื่นเชื่อมต่อและรับ event ได้", "comp": "Integration & Notification", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "API Key & Webhook Management", "pri": "Medium", "pts": 8, "dep": "IDENTITY-03", "sprint": 6, "status": "Backlog", "ws": "Integration & Notification", "phase": "Phase 2 เติมความสามารถ", "scope": "1. VCVP Core ออก เพิกถอน API key (scope/role) และ ลงทะเบียน webhook (HMAC และ retry)\n2. หน้าจอสำหรับบริหารจัดการ API key/webhook ของแต่ละองค์กร", "ac": "1. สร้าง/เพิกถอน API key พร้อม scope ที่กำหนดได้\n2. Webhook ยิง event (issued/revoked/verified) พร้อมลายเซ็นตรวจสอบได้\n3. มี retry และ log การส่ง webhook ที่ล้มเหลว", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as an integration engineer, i want to สร้าง api key และตั้งค่า webhook สำหรับระบบภายนอก, so that ระบบขององค์กรเรียกใช้ฟังก์ชัน issue/verify แบบอัตโนมัติได้"}, "INTEGRATION-02": {"id": "INTEGRATION-02", "what": "ส่ง email/in-app ตาม template และ event ที่กำหนด", "out": "ผู้ใช้ได้รับแจ้งเตือนเมื่อมีเหตุการณ์สำคัญ", "comp": "Integration & Notification", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Notification Service (Email / In-app)", "pri": "Low", "pts": 5, "dep": "IDENTITY-01", "sprint": 6, "status": "Backlog", "ws": "Integration & Notification", "phase": "Phase 2 เติมความสามารถ", "scope": "Implement notification service: template-based email/in-app notification, trigger ตาม event, รองรับหลายภาษา และตั้งค่า subscription ต่อ role/user", "ac": "1. ส่งการแจ้งเตือนตาม event ที่กำหนดได้ (email/in-app)\n2. รองรับ template หลายภาษาและตัวแปรแทนค่า\n3. ผู้ใช้ตั้งค่าและปิดการรับแจ้งเตือนรายประเภทได้", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as an operator, i want to ให้ระบบแจ้งเตือนเหตุการณ์สำคัญ (vc ใกล้หมดอายุ, ออก/เพิกถอนสำเร็จ), so that ผู้เกี่ยวข้องรับทราบและดำเนินการได้ทันเวลา"}, "INTEGRATION-03": {"id": "INTEGRATION-03", "what": "ส่ง push ไปยัง wallet ผ่าน FCM/APNs พร้อมจัดการ device token", "out": "ผู้ถือรู้ทันทีเมื่อมี VC ใหม่หรือ VC ถูกเพิกถอน", "comp": "Integration & Notification", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Push Notification Service (Wallet)", "pri": "Medium", "pts": 5, "dep": "WALLET-02, INTEGRATION-02", "sprint": 7, "status": "Backlog", "ws": "Integration & Notification", "phase": "Phase 3 พร้อมเปิดใช้จริง", "scope": "Implement push service (FCM/APNs) สามารถส่ง push ไปยัง wallet สำหรับ event offer/revocation/consent, จัดการ device token และ opt-in/opt-out", "ac": "1. Wallet ลงทะเบียน device token และรับ push ได้\n2. ส่ง push เมื่อมี offer/เพิกถอน/แจ้งเตือน PDPA\n3. ผู้ใช้เปิด/ปิดการรับ push ได้", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a wallet user, i want to รับการแจ้งเตือนแบบ push เมื่อมี credential offer ใหม่หรือ vc ถูกเพิกถอน, so that รับทราบและดำเนินการได้ทันที"}, "INTEGRATION-04": {"id": "INTEGRATION-04", "what": "เก็บ metrics, ตั้ง alert และทำ distributed tracing", "out": "รู้ปัญหาก่อนผู้ใช้แจ้ง และไล่ปัญหาข้าม service ได้", "comp": "Integration & Notification", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Monitoring, Metrics & Analytics", "pri": "Medium", "pts": 5, "dep": "PLATFORM-06, IDENTITY-02", "sprint": 7, "status": "Backlog", "ws": "Integration & Notification", "phase": "Phase 3 พร้อมเปิดใช้จริง", "scope": "1. Observability ครอบ one-core , VCVP Core, Portal (metrics/health)\n2. alerting เมื่อ error rate/latency เกิน threshold\n3. usage analytics แยกตาม organization\n4. distributed tracing ด้วย correlation id ที่ส่งต่อข้ามทุก service เพื่อไล่ปัญหาข้าม service ได้", "ac": "1. มี metrics endpoint และ dashboard แสดงสุขภาพระบบ/throughput\n2. ตั้ง alert เมื่อ error rate/latency เกิน threshold\n3. แสดง usage analytics แยกตาม organization ได้", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a platform operator, i want to มี dashboard เฝ้าระวังสุขภาพระบบและ metrics การใช้งาน, so that ตรวจจับปัญหาและวางแผนขยายระบบได้"}, "TESTING-01": {"id": "TESTING-01", "what": "ทำ conformance test และทดสอบกับ reference wallet/verifier", "out": "ยืนยันได้ว่าทำงานร่วมกับระบบอื่นตามมาตรฐานได้จริง", "comp": "Quality & Compliance Testing", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Interoperability & Conformance Testing", "pri": "Medium", "pts": 8, "dep": "PROTOCOL-01, PROTOCOL-02", "sprint": 7, "status": "Backlog", "ws": "Quality & Compliance Testing", "phase": "Phase 3 พร้อมเปิดใช้จริง", "scope": "จัดทำ conformance test suite ครอบคลุม did methods, credential formats, OpenID4VCI/VP flow, revocation, trust list resolution และ vct type metadata resolution พร้อมทดสอบกับ reference wallet/verifier และอ้างอิงเกณฑ์ ETDA", "ac": "1. ผ่าน conformance test ของ OpenID4VCI และ OpenID4VP\n2. แลก VC/VP กับ wallet/verifier ภายนอกอย่างน้อย 1 รายสำเร็จ\n3. รายงานผลทดสอบ map กับเกณฑ์ ETDA และ W3C ครบถ้วน\n4. ผ่านการทดสอบ resolve trust list และ resolve vct type metadata พร้อมตรวจค่า integrity", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a qa engineer, i want to ทดสอบ interoperability กับ wallet/verifier ภายนอกตามมาตรฐาน openid4vc และ w3c, so that มั่นใจว่าระบบทำงานร่วมกับ ecosystem ได้จริง"}, "TESTING-02": {"id": "TESTING-02", "what": "ทำ pentest, threat modeling และจัดทำ DPIA ตาม PDPA", "out": "ช่องโหว่ถูกแก้ และมีเอกสารประเมินผลกระทบตามกฎหมาย", "comp": "Quality & Compliance Testing", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Security Penetration Test & PDPA DPIA", "pri": "High", "pts": 8, "dep": "PLATFORM-06", "sprint": 8, "status": "Backlog", "ws": "Quality & Compliance Testing", "phase": "Phase 3 พร้อมเปิดใช้จริง", "scope": "ดำเนินการ pentest (OWASP), threat modeling, แก้ช่องโหว่ และจัดทำ DPIA ครอบคลุม data flow ของข้อมูลส่วนบุคคลใน VC/VP", "ac": "1. มีรายงาน pentest และปิดช่องโหว่ระดับ High/Critical ครบ\n2. มีเอกสาร DPIA ระบุความเสี่ยงและมาตรการลดความเสี่ยง\n3. ผ่านการ re-test ยืนยันการแก้ไข", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a security officer, i want to ทำ penetration test และ data protection impact assessment, so that มั่นใจว่าระบบปลอดภัยและเป็นไปตาม pdpa ก่อนขึ้น production"}, "TESTING-03": {"id": "TESTING-03", "what": "กำหนดเป้าโหลด ทดสอบ stress และหาคอขวด", "out": "รู้ว่าระบบรับได้เท่าไหร่ และต้องขยายตรงไหน", "comp": "Quality & Compliance Testing", "group": "โครงสร้างพื้นฐานและงานข้ามระบบ", "color": "#7f77dd", "feature": "Performance & Load Testing", "pri": "Medium", "pts": 5, "dep": "TESTING-01", "sprint": 8, "status": "Backlog", "ws": "Quality & Compliance Testing", "phase": "Phase 3 พร้อมเปิดใช้จริง", "scope": "1. กำหนดเป้าหมายรองรับโหลด (จำนวนการออก VC และตรวจ VP ต่อวินาที, ผู้ใช้พร้อมกัน)\n2. load/stress test ครอบ flow ออก VC และตรวจ VP รวมถึงการดึง status list จากภายนอก\n3. ระบุคอขวด (engine, ฐานข้อมูล, edge) และปรับ sizing/scaling ตามผล", "ac": "1. ระบบรองรับโหลดเป้าหมายโดย latency และ error rate อยู่ในเกณฑ์ที่กำหนด\n2. ระบุคอขวดของระบบได้ชัดเจนพร้อมแผนรองรับการขยาย", "sx": "โครงสร้างพื้นฐานและงานข้ามระบบ as a platform operator, i want to ทดสอบว่าระบบรองรับโหลดตามเป้าหมายได้, so that มั่นใจว่าเปิดใช้งานจริงแล้วไม่ล่มในช่วงที่มีผู้ใช้พร้อมกันจำนวนมาก"}}, "totals": {"comp": 19, "story": 71, "pts": 473}};
let view="svc", sel=null, sp=null, q="", collapsed={phase:{},sprint:{}}, openScope={};
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
const esc=(s)=>(s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tint=(hex,a)=>`rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;
const selStyle=(hex)=>`;border-color:${hex};box-shadow:0 0 0 2px ${tint(hex,.55)},0 2px 9px rgba(0,0,0,.08)`;

document.getElementById('stats').innerHTML =
  `<div class="stat"><b>${D.totals.comp}</b> components</div><div class="stat"><b>${D.totals.story}</b> stories</div>
   <div class="stat"><b>${D.totals.pts}</b> points</div><div class="stat"><b>${D.sprints.length}</b> sprints</div>`;

const chips=document.getElementById('chips');
const spSel=el('<select class="sel" id="spSel"></select>');
spSel.innerHTML='<option value="">ทุก sprint</option>'+D.sprints.map(S=>`<option value="${S.n}">Sprint ${S.n}</option>`).join('');
spSel.onchange=()=>{sp=spSel.value?+spSel.value:null;render()};
chips.appendChild(spSel);
const cl=el('<button class="chip clear">ล้างตัวกรอง</button>');
cl.onclick=()=>{sp=null;q="";document.getElementById('q').value="";render()};chips.appendChild(cl);
document.getElementById('q').oninput=(e)=>{q=e.target.value.trim().toLowerCase();render()};
document.getElementById('tabA').onclick=()=>{view="svc";render()};
document.getElementById('tabB').onclick=()=>{view="road";render()};

const priCls=(p)=>({"Highest":"p-highest","High":"p-high","Medium":"p-medium","Low":"p-low"}[p]||"p-low");
const priB=(s)=>`<span class="b pri ${priCls(s.pri)}">${esc(s.pri)}</span>`;
const liveStatus=(s)=>s.status&&s.status.trim()&&s.status.trim()!=="Backlog";
const scopeBtn=(s)=>`<span class="more" data-sc="${s.id}">${openScope[s.id]?'▾ ซ่อนขอบเขตงาน':'▸ ดูขอบเขตงาน'}</span>`;
const scopeBox=(s)=>openScope[s.id]?`<div class="scope"><b>คำอธิบายขอบเขตงาน (Technical Scope)</b>${esc(s.scope)}`
  +(s.ac?`<div class="acx"><b>เกณฑ์ที่ต้องผ่าน จึงถือว่างานนี้เสร็จ (Acceptance Criteria)</b>${esc(s.ac)}</div>`:'')+`</div>`:'';
function wireScope(root){root.querySelectorAll('.more').forEach(b=>b.onclick=(e)=>{
  e.stopPropagation();const id=b.dataset.sc;openScope[id]=!openScope[id];render();});}
const match=(s)=>!q||((s.id+" "+s.what+" "+s.out+" "+s.feature+" "+s.ws+" "+s.comp+" "+(s.phase||"")).toLowerCase().includes(q)||(s.sx||"").includes(q)||(s.scope||"").toLowerCase().includes(q)||(s.ac||"").toLowerCase().includes(q));
const vis=(s)=>match(s)&&(!sp||s.sprint===sp);

function render(){
  document.getElementById('tabA').classList.toggle('on',view==="svc");
  document.getElementById('tabB').classList.toggle('on',view==="road");
  const ss=document.getElementById('spSel');
  if(ss){ss.value=sp?String(sp):"";ss.classList.toggle('on',!!sp);}
  document.querySelector('.layout').classList.toggle('full',view==="road");
  document.getElementById('hint').innerHTML = view==="svc" ? ""
    : `<div class="note"><b>อ่านยังไง:</b> ไล่จาก Sprint 1 ลงมา ในแต่ละ sprint งาน "ลำดับ 1" เริ่มได้ทันทีที่เปิด sprint นั้น เพราะของที่ต้องทำก่อนเสร็จไปตั้งแต่ sprint ก่อนหน้าแล้ว ส่วนลำดับถัดไปต้องรอลำดับก่อนหน้าเสร็จก่อน</div>`;
  const tot=Object.keys(D.stories).length;
  const shownN=Object.values(D.stories).filter(vis).length;
  const fb=document.getElementById('fbar');
  if(q||sp){
    const parts=[];
    if(sp)parts.push(`Sprint ${sp}`);
    if(q)parts.push(`คำค้น "${esc(q)}"`);
    fb.innerHTML=`<div class="fbar">กำลังกรอง: <b>${parts.join(' + ')}</b>  แสดง <b>${shownN}</b> จาก ${tot} รายการ`
      +`<button class="chip x" id="fclear">ล้างตัวกรอง</button></div>`;
    fb.querySelector('#fclear').onclick=()=>{sp=null;q="";document.getElementById('q').value="";render()};
  } else fb.innerHTML="";
  document.getElementById('main').innerHTML="";
  view==="svc"?renderSvc():renderRoad();
  renderPanel();
}

function renderSvc(){
  const main=document.getElementById('main');
  let shown=0;
  D.groups.forEach(g=>{
    const live=g.comps.filter(c=>c.stories.some(vis));
    if(!live.length) return;
    const z=el(`<div class="zone"><h2 style="background:${g.color}"><span>${esc(g.name)}</span><span>${live.length} components</span></h2><div class="cards"></div></div>`);
    const box=z.querySelector('.cards');
    live.forEach(c=>{
      const hits=c.stories.filter(vis), pts=c.stories.reduce((a,s)=>a+s.pts,0);
      const hpts=hits.reduce((a,s)=>a+s.pts,0);
      const cnt={},ptn={}; c.stories.forEach(s=>{cnt[s.sprint]=(cnt[s.sprint]||0)+1;ptn[s.sprint]=(ptn[s.sprint]||0)+s.pts});
      let tl=""; for(let i=1;i<=8;i++){
        tl+=`<i class="${cnt[i]?'has':''} ${(sp===i&&cnt[i])?'hit':''}" title="Sprint ${i}${cnt[i]?` | ${cnt[i]} stories | ${ptn[i]} pts`:' | ไม่มีงาน'}">${cnt[i]||""}</i>`}
      const meta=(q||sp)?`${hits.length} จาก ${c.stories.length} stories | ${hpts} pts`
                        :`${c.stories.length} stories | ${pts} pts`;
      const card=el(`<div class="card ${sel===c.name?'sel':''}" style="border-left-color:${g.color}${sel===c.name?selStyle(g.color):''}">
        <div class="nm">${esc(c.name)}</div>
        <div class="gl">${esc(c.gloss||"")}</div>
        <div class="mt">${meta}</div>
        <div class="tl">${tl}</div></div>`);
      card.onclick=()=>{sel=(sel===c.name?null:c.name);render()};
      box.appendChild(card); shown++;
    });
    main.appendChild(z);
  });
  if(!shown) main.appendChild(el('<div class="emptybig">ไม่พบ component ที่ตรงกับเงื่อนไข<br>ลองล้างตัวกรอง หรือแก้คำค้นหา</div>'));
}

function renderRoad(){
  const main=document.getElementById('main');
  const ctl=el('<div class="rctl"><span>คลิกที่แถบ Phase หรือ SPRINT เพื่อย่อ/ขยาย</span><span class="fill"></span>'
    +'<button class="chip" id="expAll">ขยายทั้งหมด</button><button class="chip" id="colAll">ย่อทั้งหมด</button></div>');
  main.appendChild(ctl);
  ctl.querySelector('#expAll').onclick=()=>{collapsed={phase:{},sprint:{}};render()};
  ctl.querySelector('#colAll').onclick=()=>{collapsed={phase:{},sprint:{}};D.sprints.forEach(S=>{collapsed.phase[S.phase]=true});render()};
  const vcnt=(S)=>S.waves.reduce((a,w)=>a+w.filter(x=>vis(D.stories[x.id])).length,0);
  const vpts=(S)=>S.waves.reduce((a,w)=>a+w.filter(x=>vis(D.stories[x.id]))
                    .reduce((b,x)=>b+D.stories[x.id].pts,0),0);
  const liveS=D.sprints.filter(S=>vcnt(S)>0);
  if(!liveS.length){
    main.appendChild(el('<div class="emptybig">ไม่พบงานที่ตรงกับเงื่อนไข<br>ลองล้างตัวกรอง หรือแก้คำค้นหา</div>'));
    return;
  }
  let curPhase=null;
  liveS.forEach(S=>{
    if(S.phase!==curPhase){
      curPhase=S.phase;
      const inPh=liveS.filter(x=>x.phase===curPhase);
      const st=inPh.reduce((a,x)=>a+vcnt(x),0), pt=inPh.reduce((a,x)=>a+vpts(x),0);
      const pcol=!q&&!!collapsed.phase[curPhase], key=curPhase;
      const ph=el(`<div class="phase"><span style="font-weight:600;opacity:1;font-size:14px"><i class="cv">${pcol?'▸':'▾'}</i>${esc(curPhase)}</span>`
        +`<span>Sprint ${inPh[0].n}-${inPh[inPh.length-1].n} | ${st} stories | ${pt} points${pcol?' | (ย่อไว้)':''}</span></div>`);
      ph.onclick=()=>{collapsed.phase[key]=!collapsed.phase[key];render()};
      main.appendChild(ph);
    }
    if(!q&&collapsed.phase[S.phase]) return;
    const scol=!q&&!!collapsed.sprint[S.n];
    const liveW=S.waves.map((w,i)=>({i:i,rows:w.filter(x=>vis(D.stories[x.id]))})).filter(o=>o.rows.length);
    const blk=el(`<div class="sprint">
      <div class="sh"><b><i class="cv">${scol?'▸':'▾'}</i>SPRINT ${S.n}</b><span>${vcnt(S)} stories | ${vpts(S)} points | แบ่งเป็น ${liveW.length} ลำดับ</span></div>
      <div class="goal"><b>เป้าหมายของ SPRINT นี้</b>${esc(S.goal)}</div></div>`);
    blk.querySelector('.sh').onclick=()=>{collapsed.sprint[S.n]=!collapsed.sprint[S.n];render()};
    if(!scol){
      liveW.forEach(o=>{
        const i=o.i, w=o.rows;
        const wp=w.reduce((a,x)=>a+D.stories[x.id].pts,0);
        const wv=el(`<div class="wave"><div class="wh"><span>ลำดับ ${i+1} ${i===0?'(เริ่มได้ทันทีที่เปิด sprint นี้)':'(รอลำดับ '+i+' เสร็จก่อน)'}</span><span>${w.length} งาน | ${wp} pts</span></div></div>`);
        w.forEach(x=>{
          const s=D.stories[x.id];
          const row=el(`<div class="wrow">
            <div class="wleft"><span class="sid" data-tag="[${esc(s.comp)}] ${s.id}">${s.id}</span></div>
            <div class="wbody">
              <div>${esc(s.what)}<span class="svc" style="background:${s.color}">${esc(s.comp)}</span></div>
              <div class="o">${esc(s.out)}</div>
              ${x.blockers.length?`<div class="blk">ต้องทำ ${x.blockers.join(', ')} ใน sprint เดียวกันก่อน</div>`:''}
              <div class="f">${priB(s)} ${s.pts} pts${liveStatus(s)?" | "+esc(s.status):""} ${scopeBtn(s)}</div>
              ${scopeBox(s)}
            </div></div>`);
          row.querySelector('.sid').onclick=()=>{sel=s.comp;view="svc";render();window.scrollTo({top:0,behavior:'smooth'})};
          wireScope(row);
          wv.appendChild(row);
        });
        blk.appendChild(wv);
      });
    }
    main.appendChild(blk);
  });
}

function renderPanel(){
  const p=document.getElementById('panel');
  let g=null,c=null;
  D.groups.forEach(gg=>gg.comps.forEach(cc=>{if(cc.name===sel){g=gg;c=cc}}));
  if(!c){p.innerHTML='<div class="empty">'+(view==="svc"?'เลือก component จากด้านซ้ายเพื่อดูรายละเอียด':'คลิกที่รหัส story เพื่อดูรายละเอียดของ component นั้น')+'</div>';return}
  const pts=c.stories.reduce((a,s)=>a+s.pts,0);
  let h=`<div class="ph" style="border-left-color:${g.color}"><h3>${esc(c.name)}</h3><div class="gl">${esc(c.gloss||"")}</div>
      <div class="zn">${c.stories.length} stories | ${pts} pts</div></div>
    <div class="out"><b>Output</b>${esc(c.output)}</div>`;
  const all=c.stories.slice().sort((a,b)=>a.sprint-b.sprint||a.id.localeCompare(b.id));
  const list=all.filter(vis);
  if(!list.length) h+=`<div class="empty">ไม่มี story ใน component นี้ที่ตรงกับตัวกรอง</div>`;
  else if(list.length<all.length) h+=`<div class="fnote">แสดง ${list.length} จาก ${all.length} รายการ ตามตัวกรองที่เลือก</div>`;
  list.forEach(s=>{
    h+=`<div class="st">
      <div class="r1"><span class="b sp">Sprint ${s.sprint}</span>
        <span class="sid" data-tag="[${esc(c.name)}] ${s.id}">${s.id}</span>
        ${priB(s)}<span class="b pt">${s.pts} pts</span>
        ${liveStatus(s)?`<span class="b pt">${esc(s.status)}</span>`:""}${scopeBtn(s)}</div>
      <div class="w">${esc(s.what)}</div><div class="o">${esc(s.out)}</div>
      <div class="f">${esc(s.feature)}${s.dep&&s.dep.toLowerCase()!=='none'?' | ต้องทำก่อน: '+esc(s.dep):''}</div>${scopeBox(s)}</div>`;
  });
  h+=`<div class="toast" id="toast"></div>`;
  p.innerHTML=h;
  p.querySelectorAll('.sid').forEach(b=>b.onclick=()=>copyTag(b));
  wireScope(p);
}
function copyTag(b){
  navigator.clipboard.writeText(b.dataset.tag).then(()=>{
    let t=document.getElementById('toast');
    if(t){t.textContent='คัดลอกแล้ว: '+b.dataset.tag;t.style.display='block';setTimeout(()=>t.style.display='none',1600)}})}
render();
</script></body></html>
