<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Tahoma,"Sarabun",sans-serif;background:#f7f7f5;color:#26251f;font-size:14px;line-height:1.65}
.wrap{max-width:1500px;margin:0 auto;padding:20px}

.note{margin-top:12px;background:#fce4d6;border-left:3px solid #d85a30;padding:9px 13px;border-radius:0 6px 6px 0;font-size:12.5px;color:#843c0c}
.legend{margin-top:8px;background:#fff;border:1px solid #e3e1d9;border-radius:7px;padding:8px 12px;font-size:12px;color:#5f5e5a;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.legend .lg{display:flex;gap:2px}
.legend .lg i{width:15px;height:15px;border-radius:2px;background:#f0efe9;font-style:normal;font-size:9.5px;color:#a09e95;display:flex;align-items:center;justify-content:center}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 6px}

.chips{display:flex;gap:4px;flex-wrap:wrap}

.chip.on{background:#1f4e78;color:#fff;border-color:#1f4e78}
.chip.clear{color:#a09e95}
.fbar{margin-top:10px;background:#eef3f8;border:1px solid #cfe0ef;border-radius:8px;padding:8px 13px;font-size:12.5px;color:#1f4e78;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fbar .x{margin-left:auto}
.emptybig{background:#fff;border:1px dashed #d8d6cd;border-radius:9px;padding:44px 20px;text-align:center;color:#a09e95;font-size:13.5px;line-height:2}
.fnote{padding:7px 15px;background:#f7f7f5;border-bottom:1px solid #eeece5;font-size:11.5px;color:#77756d}
.sel{padding:8px 12px;border:1px solid #d8d6cd;border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:#26251f;cursor:pointer}
.sel:focus{outline:2px solid #9dc3e6;outline-offset:-1px}
.sel.on{background:#1f4e78;color:#fff;border-color:#1f4e78}
.layout{display:grid;grid-template-columns:1fr 440px;gap:18px;margin-top:14px;align-items:start}
@media(max-width:1080px){.layout{grid-template-columns:1fr}}
.layout.full{grid-template-columns:1fr}
.layout.full .panel{display:none}
.zone{margin-bottom:16px}
.zone h2{font-size:13px;font-weight:600;color:#fff;padding:6px 12px;border-radius:7px 7px 0 0;display:flex;justify-content:space-between;gap:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:9px;padding:10px;background:#fff;border:1px solid #e3e1d9;border-top:none;border-radius:0 0 7px 7px}
.card{border:1px solid #e3e1d9;border-radius:8px;padding:10px 11px;cursor:pointer;background:#fff;transition:.12s;border-left-width:3px}

.card.sel .nm{font-weight:700}
.card.dim{opacity:.28}
.card .nm{font-weight:600;font-size:13px;line-height:1.35}
.card .mt{color:#77756d;font-size:11.5px;margin-top:3px}
.tl{display:flex;gap:2px;margin-top:8px}

.rctl{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:12px;color:#77756d;flex-wrap:wrap}

.gl{color:#77756d;font-size:11.5px;font-weight:400;margin-top:1px}

.sprint.dim{opacity:.35}
.sprint .sh{background:#1f4e78;color:#fff;padding:8px 14px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sprint .sh b{font-size:15px}
.sprint .sh span{font-size:12px;opacity:.85}
.goal{background:#fff8e1;border-bottom:1px solid #f0e4bd;padding:9px 14px;font-size:13px;color:#7a5c10}
.goal b{font-size:11px;color:#a08a3a;display:block;font-weight:600}
.wave{border-top:1px solid #eeece5}
.wh{background:#f3f2ec;padding:5px 14px;font-size:11.5px;color:#5f5e5a;font-weight:600;display:flex;justify-content:space-between}
.wrow{display:flex;gap:10px;padding:9px 14px;border-top:1px solid #f4f3ee;align-items:flex-start}

.wleft{flex:0 0 auto}
.wbody{flex:1;min-width:0}
.svc{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:10px;color:#fff;margin-left:6px;vertical-align:1px}
.blk{font-size:11px;color:#c05621;margin-top:2px}
.panel{background:#fff;border:1px solid #e3e1d9;border-radius:9px;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}
.panel .ph{padding:13px 15px;border-bottom:1px solid #eeece5;border-left:4px solid #ccc}
.panel h3{font-size:16px;font-weight:600}
.panel .zn{font-size:11.5px;color:#77756d;margin-top:1px}
.out{margin:11px 15px;background:#eaf3de;border:1px solid #c0dd97;border-radius:7px;padding:9px 12px;font-size:12.5px;color:#4a5c1f}
.out b{display:block;font-size:11px;color:#4f7020;margin-bottom:2px;font-weight:600}
.st{border-top:1px solid #eeece5;padding:11px 15px}
.st.dimr{opacity:.3}
.st .r1,.wrow .r1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sid{font-weight:600;font-size:12.5px;color:#1f4e78;cursor:pointer;border:1px dashed #bdd7ee;border-radius:5px;padding:1px 6px;background:#f4f9fd;white-space:nowrap}
.sid:hover{background:#1f4e78;color:#fff}
.b{font-size:10.5px;border-radius:4px;padding:1px 6px;border:1px solid}
.b.sp{background:#eef3f8;border-color:#d5e3ef;color:#1f4e78}
.b.pt{background:#f3f2ec;border-color:#e3e1d9;color:#5f5e5a}
.b.pri{font-weight:600}
.b.p-highest{background:#fceaea;border-color:#eeb4b4;color:#a32d2d}
.b.p-high{background:#fdf1e4;border-color:#f2cda2;color:#8a4a10}
.b.p-medium{background:#eef5e6;border-color:#c6dfae;color:#3b6d11}
.b.p-low{background:#f1efe8;border-color:#d3d1c7;color:#5f5e5a}
.w{margin-top:5px;font-size:12.5px}
.o{margin-top:3px;font-size:12.5px;color:#3a6b2f;padding-left:11px;border-left:2px solid #cfe3c4}
.f{margin-top:4px;font-size:11px;color:#a09e95}
.more{font-size:11px;color:#1f4e78;cursor:pointer;border:1px solid #d5e3ef;background:#f4f9fd;border-radius:4px;padding:1px 7px;user-select:none}
.more:hover{background:#1f4e78;color:#fff}
.scope{margin-top:7px;background:#f7f7f5;border:1px solid #e3e1d9;border-left:3px solid #9dc3e6;border-radius:0 6px 6px 0;padding:8px 11px;font-size:12px;white-space:pre-line;color:#3d3c37;line-height:1.7}

.empty{padding:34px 18px;text-align:center;color:#a09e95;font-size:13px}
.toast{position:sticky;bottom:14px;margin:0 15px 14px;background:#1d9e75;color:#fff;padding:7px 12px;border-radius:7px;font-size:12.5px;display:none}
footer{margin-top:22px;color:#a09e95;font-size:11.5px;text-align:center}

<script>
const D = {"groups": [{"name": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "comps": [{"name": "Engine Layer (interface, adapter, one-core)", "gloss": "engine + adapter ที่ต่อกับ one-core", "output": "มี engine VC/VP ที่ใช้งานได้จริง และเปลี่ยนหรือเพิ่ม engine เจ้าอื่นได้ภายหลังโดยไม่กระทบระบบส่วนอื่น", "stories": [{"id": "ENGINE-01", "what": "ตั้งค่า provider ที่เปิดใช้ และย้าย secret/KEK ไปเก็บใน KMS", "out": "เปิด-ปิดความสามารถของ engine ได้ผ่าน config โดยไม่ต้องแก้โค้ด", "comp": "Engine Layer (interface, adapter, one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "one-core Configuration & Secrets Management", "pri": "Highest", "pts": 8, "dep": "PLATFORM-02, PLATFORM-04", "sprint": 1, "status": "Backlog", "ws": "Engine Layer (interface, adapter, one-core)", "phase": "Phase 0 ตั้งฐาน", "scope": "1. ตรวจสอบและตั้งค่า provider instances ที่เปิดใช้ในระบบ ผ่าน config YAML ของ one-core ให้ครบทุกหมวด (did, format, revocation, keyAlgorithm, keyStorage, issuanceProtocol/verificationProtocol, transport, trustManagement, task) โดย transport, trustManagement และ task กำหนดจบใน story นี้ พร้อมตั้งตัวเรียก task ตามรอบเวลา (one-core เปิดเส้น /api/task/v1/run ให้ แต่ไม่มีตัวจับเวลาในตัว) ส่วนหมวดอื่นดูรายละเอียดใน story ที่เกี่ยวข้อง\n2. ย้าย KEK/encryption key ของ INTERNAL key storage และ DB credential เก็บใน KMS/secrets manager, inject ตอน runtime, rotate KEK ได้ (ต้องวางแผน re-encrypt key ใน DB)\n3. ใช้ key storage แบบ KMS ที่ต้องพัฒนาเพิ่มเอง (AWS/GCP ใน KEY-03) เพื่อให้ private key ไม่ออกนอก KMS\nหมายเหตุ: one-core มี Azure Key Vault ในตัวแต่เราไม่ใช้\nPKCS#11 ยังเป็น stub คือยังไม่มีการพัฒนา ต้องพัฒนาเพิ่ม\n4. แยกค่า config ต่อ environment (Dev/UAT/PreProd/Prod)\n5. ทดสอบ/verify ตัว one-core จะมี fail-fast เมื่อ config ผิดตอน startup (ความสามารถในตัว one-core) และ VCVP Core/ops เรียก /api/config/v1 ตรวจว่า provider ที่ active ตรงที่คาดหวัง", "ac": "1. เปิด/ปิด provider instance (DID/format/revocation/keyStorage/protocol/task) ผ่าน config YAML โดยไม่แก้โค้ด\n2. KEK/encryption key ของ key storage และ DB credential ไม่อยู่ใน repo/config และดึงจาก KMS/vault ตอน runtime\n3. รองรับการ rotate KEK โดยกุญแจ/ข้อมูลเดิมยังถอดได้ และจำกัดสิทธิ์+audit การเข้าถึง KEK\n4. ใส่ config ผิดแล้ว one-core ไม่ start (fail-fast) และเรียก /api/config/v1 ได้รายการ provider ที่ active ตรงกับที่ตั้งค่า\n5. task ที่เปิดใช้ถูกเรียกตามรอบเวลาที่กำหนดจริง และตรวจสอบได้ว่ารันสำเร็จหรือล้มเหลว", "sx": "engine และ adapter as a platform engineer, i want to บริหาร configuration และ secret ของ one-core แบบรวมศูนย์ต่อ environment, so that เปิด/ปิด provider และจัดการคีย์ลับได้ปลอดภัยและยืดหยุ่น"}, {"id": "ENGINE-02", "what": "เปิดใช้ formatter SD-JWT", "out": "ออก VC แบบ SD-JWT ที่ปกปิดข้อมูลบางส่วนได้", "comp": "Engine Layer (interface, adapter, one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Credential Formatter Provider (SD-JWT)", "pri": "Highest", "pts": 5, "dep": "KEY-01, EDGE-03", "sprint": 2, "status": "Backlog", "ws": "Engine Layer (interface, adapter, one-core)", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. ตั้งค่า formatter ใน one-core ผ่าน config โดยเปิด SD-JWT และปิดตัวที่ไม่ได้ใช้\n2. integrate การออก VC ให้เรียกผ่าน VCVP Core\n3. ทดสอบออก VC (SD-JWT) และ verify proof ได้\n4. กำหนดรูปแบบ vct ของใบรับรองแต่ละประเภทให้เป็น URL บน domain ของเราเอง และเผยแพร่ SD-JWT VC Type Metadata ที่ URL นั้น พร้อม vct#integrity เพื่อให้ผู้ตรวจยืนยันได้ว่า metadata ไม่ถูกแก้ภายหลัง", "ac": "1. ออก VC SD-JWT ที่มี disclosure array ครบ\n2. ออก VC SD-JWT ผ่าน API ของ VCVP Core ได้ โดย client ไม่เรียก one-core โดยตรง\n3. resolve vct ของ VC ที่ออก แล้วได้ type metadata ที่ตรงกับค่า integrity ที่ฝังอยู่ใน VC", "sx": "engine และ adapter as an issuer developer, i want to ใช้ credential formatter provider ที่รองรับ sd-jwt, so that ออก vc รูปแบบ sd-jwt ที่บรรจุ claim ตามที่ issuer กำหนด (schema) และรองรับ selective disclosure"}, {"id": "ENGINE-03", "what": "เปิดใช้อัลกอริทึม EdDSA / ECDSA / ML-DSA", "out": "เลือกอัลกอริทึมลงนามได้ตามงาน รวมถึงแบบรองรับยุคควอนตัม", "comp": "Engine Layer (interface, adapter, one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Key Algorithm Provider", "pri": "Highest", "pts": 5, "dep": "PLATFORM-02", "sprint": 2, "status": "Backlog", "ws": "Engine Layer (interface, adapter, one-core)", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. ตั้งค่า key algorithm ใน one-core ผ่าน config โดยเปิด EdDSA/ECDSA/ML-DSA และปิดตัวที่ไม่ได้ใช้\n2. เลือกอัลกอริทึมต่อ use case ได้โดยไม่แก้โค้ด\n3. ทดสอบ sign/verify", "ac": "1. sign/verify สำเร็จครบทุกอัลกอริทึมผ่าน one-core\n2. เลือกอัลกอริทึมผ่าน config ได้", "sx": "engine และ adapter as a security engineer, i want to ให้ key algorithm provider รองรับ eddsa, ecdsa และ ml-dsa (post-quantum), so that ระบบเลือกใช้อัลกอริทึมได้ยืดหยุ่นและรองรับยุคหลังควอนตัม"}, {"id": "ENGINE-04", "what": "กำหนด interface กลาง และสร้าง adapter ตัวแรกครอบ one-core", "out": "Portal และ Wallet เรียกงานผ่านช่องทางเดียว และเปลี่ยน engine ภายหลังได้", "comp": "Engine Layer (interface, adapter, one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Credential Engine Interface & Adapter (Integration Layer)", "pri": "Highest", "pts": 8, "dep": "PLATFORM-02", "sprint": 2, "status": "Backlog", "ws": "Engine Layer (interface, adapter, one-core)", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. สร้าง VCVP Core service เป็น API base เดียวสำหรับ Portal และ Wallet (ไม่มี client ใดเรียก API ของ engine โดยตรง)\n2. กำหนด interface กลางสำหรับเรียกใช้ engine โดยตั้งชื่อคำสั่งตามงานที่ระบบทำจริง (issue/verify/revoke/sign/resolve/schema/status) ไม่อิงศัพท์เฉพาะของ engine ตัวใดตัวหนึ่ง\n3. implement adapter ตัวแรกสำหรับ one-core: แปลง request/response, จัดการ auth, retry/timeout และแปลง error ให้สื่อความหมาย\n4. กำหนดให้ชื่อ/โครงสร้างเฉพาะของ engine ต้องไม่รั่วออกนอก adapter (โดเมนและ API ที่เปิดให้ client ต้องเป็น ma ที่มี VC อ้างอยู่ ระบบต้องปฏิเสธพร้อมเหตุผล", "ac": "1. สร้าง/แก้ไข/เผยแพร่ schema และเลือก format ได้\n2. Schema กำหนด claim/format (SD-JWT) ถูกต้องและ validate ได้\n3. แก้ schema สร้างเวอร์ชันใหม่โดยไม่กระทบ VC ที่ออกไปแล้ว\n4. ลบ schema ที่มี VC อ้างอยู่ไม่ได้ ระบบปฏิเสธพร้อมเหตุผลที่ระบุว่ามี VC อ้างอยู่", "sx": "แอปและหน้าจอผู้ใช้ as an issuer operator, i want to สร้างและจัดการ credential schema/template ผ่าน portal, so that กำหนดโครงสร้างข้อมูลใบรับรองได้เอง"}, {"id": "ISSUER-02", "what": "หน้าจอสั่งออก VC แสดง QR และติดตามสถานะ", "out": "เจ้าหน้าที่ออก VC ให้ประชาชนได้จากหน้าจอ", "comp": "Issuer Portal", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Issuance Workflow & Credential Offer", "pri": "Highest", "pts": 5, "dep": "PROTOCOL-01, ISSUER-01, ISSUANCE-02", "sprint": 4, "status": "Backlog", "ws": "Issuer Portal", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. หน้าจอสำหรับ สร้างคำสั่งออก VC แสดง QR/deeplink และ ติดตามสถานะ offer\n2. เรียก VCVP Core เป็นผู้ orchestrate (ISSUANCE-02)", "ac": "1. สร้าง credential offer ผ่าน VCVP Core และแสดง QR/deeplink ได้\n2. ติดตามสถานะ offer (pending เป็น claimed)\n3. ยกเลิก offer ที่ยังไม่ถูก claim ได้", "sx": "แอปและหน้าจอผู้ใช้ as an issuer operator, i want to สร้างคำสั่งออก vc และ credential offer (qr/deeplink) ให้ผู้ถือ, so that ผู้ใช้รับ vc เข้ากระเป๋าได้ผ่าน openid4vci"}, {"id": "ISSUER-03", "what": "ค้นหา VC และสั่งเพิกถอน/ระงับ/ปลดระงับ", "out": "เจ้าหน้าที่เพิกถอน VC ที่มีปัญหาได้ทันที", "comp": "Issuer Portal", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Revocation Management Console", "pri": "High", "pts": 5, "dep": "REVOCATION-01, ISSUER-02, REVOCATION-02", "sprint": 5, "status": "Backlog", "ws": "Issuer Portal", "phase": "Phase 2 เติมความสามารถ", "scope": "1. หน้าจอสำหรับ ค้นหา VC และ สั่ง revoke/suspend/unsuspend\n2. ดำเนินการผ่าน VCVP Core (REVOCATION-02) และ แสดง audit พร้อมเหตุผล", "ac": "1. ค้นหา VC ตาม subject/credential id/วันที่ออกได้\n2. สั่ง revoke/suspend แ ่า provider ที่เปิดใช้ และย้าย secret/KEK ไปเก็บใน KMS", "out": "เปิด-ปิดความสามารถของ engine ได้ผ่าน config โดยไม่ต้องแก้โค้ด", "comp": "Engine Layer (interface, adapter, one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "one-core Configuration & Secrets Management", "pri": "Highest", "pts": 8, "dep": "PLATFORM-02, PLATFORM-04", "sprint": 1, "status": "Backlog", "ws": "Engine Layer (interface, adapter, one-core)", "phase": "Phase 0 ตั้งฐาน", "scope": "1. ตรวจสอบและตั้งค่า provider instances ที่เปิดใช้ในระบบ ผ่าน config YAML ของ one-core ให้ครบทุกหมวด (did, format, revocation, keyAlgorithm, keyStorage, issuanceProtocol/verificationProtocol, transport, trustManagement, task) โดย transport, trustManagement และ task กำหนดจบใน story นี้ พร้อมตั้งตัวเรียก task ตามรอบเวลา (one-core เปิดเส้น /api/task/v1/run ให้ แต่ไม่มีตัวจับเวลาในตัว) ส่วนหมวดอื่นดูรายละเอียดใน story ที่เกี่ยวข้อง\n2. ย้าย KEK/encryption key ของ INTERNAL key storage และ DB credential เก็บใน KMS/secrets manager, inject ตอน runtime, rotate KEK ได้ (ต้องวางแผน re-encrypt key ใน DB)\n3. ใช้ key storage แบบ KMS ที่ต้องพัฒนาเพิ่มเอง (AWS/GCP ใน KEY-03) เพื่อให้ private key ไม่ออกนอก KMS\nหมายเหตุ: one-core มี Azure Key Vault ในตัวแต่เราไม่ใช้\nPKCS#11 ยังเป็น stub คือยังไม่มีการพัฒนา ต้องพัฒนาเพิ่ม\n4. แยกค่า config ต่อ environment (Dev/UAT/PreProd/Prod)\n5. ทดสอบ/verify ตัว one-core จะมี fail-fast เมื่อ config ผิดตอน startup (ความสามารถในตัว one-core) และ VCVP Core/ops เรียก /api/config/v1 ตรวจว่า provider ที่ active ตรงที่คาดหวัง", "ac": "1. เปิด/ปิด provider instance (DID/format/revocation/keyStorage/protocol/task) ผ่าน config YAML โดยไม่แก้โค้ด\n2. KEK/encryption key ของ key storage และ DB credential ไม่อยู่ใน repo/config และดึงจาก KMS/vault ตอน runtime\n3. รองรับการ rotate KEK โดยกุญแจ/ข้อมูลเดิมยังถอดได้ และจำกัดสิทธิ์+audit การเข้าถึง KEK\n4. ใส่ config ผิดแล้ว one-core ไม่ start (fail-fast) และเรียก /api/config/v1 ได้รายการ provider ที่ active ตรงกับที่ตั้งค่า\n5. task ที่เปิดใช้ถูกเรียกตามรอบเวลาที่กำหนดจริง และตรวจสอบได้ว่ารันสำเร็จหรือล้มเหลว", "sx": "engine และ adapter as a platform engineer, i want to บริหาร configuration และ secret ของ one-core แบบรวมศูนย์ต่อ environment, so that เปิด/ปิด provider และจัดการคีย์ลับได้ปลอดภัยและยืดหยุ่น"}, "ENGINE-02": {"id": "ENGINE-02", "what": "เปิดใช้ formatter SD-JWT", "out": "ออก VC แบบ SD-JWT ที่ปกปิดข้อมูลบางส่วนได้", "comp": "Engine Layer (interface, adapter, one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Credential Formatter Provider (SD-JWT)", "pri": "Highest", "pts": 5, "dep": "KEY-01, EDGE-03", "sprint": 2, "status": "Backlog", "ws": "Engine Layer (interface, adapter, one-core)", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. ตั้งค่า formatter ใน one-core ผ่าน config โดยเปิด SD-JWT และปิดตัวที่ไม่ได้ใช้\n2. integrate การออก VC ให้เรียกผ่าน VCVP Core\n3. ทดสอบออก VC (SD-JWT) และ verify proof ได้\n4. กำหนดรูปแบบ vct ของใบรับรองแต่ละประเภทให้เป็น URL บน domain ของเราเอง และเผยแพร่ SD-JWT VC Type Metadata ที่ URL นั้น พร้อม vct#integrity เพื่อให้ผู้ตรวจยืนยันได้ว่า metadata ไม่ถูกแก้ภายหลัง", "ac": "1. ออก VC SD-JWT ที่มี disclosure array ครบ\n2. ออก VC SD-JWT ผ่าน API ของ VCVP Core ได้ โดย client ไม่เรียก one-core โดยตรง\n3. resolve vct ของ VC ที่ออก แล้วได้ type metadata ที่ตรงกับค่า integrity ที่ฝังอยู่ใน VC", "sx": "engine และ adapter as an issuer developer, i want to ใช้ credential formatter provider ที่รองรับ sd-jwt, so that ออก vc รูปแบบ sd-jwt ที่บรรจุ claim ตามที่ issuer กำหนด (schema) และรองรับ selective disclosure"}, "ENGINE-03": {"id": "ENGINE-03", "what": "เปิดใช้อัลกอริทึม EdDSA / ECDSA / ML-DSA", "out": "เลือกอัลกอริทึมลงนามได้ตามงาน รวมถึงแบบรองรับยุคควอนตัม", "comp": "Engine Layer (interface, adapter, one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Key Algorithm Provider", "pri": "Highest", "pts": 5, "dep": "PLATFORM-02", "sprint": 2, "status": "Backlog", "ws": "Engine Layer (interface, adapter, one-core)", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. ตั้งค่า key algorithm ใน one-core ผ่าน config โดยเปิด EdDSA/ECDSA/ML-DSA และปิดตัวที่ไม่ได้ใช้\n2. เลือกอัลกอริทึมต่อ use case ได้โดยไม่แก้โค้ด\n3. ทดสอบ sign/verify", "ac": "1. sign/verify สำเร็จครบทุกอัลกอริทึมผ่าน one-core\n2. เลือกอัลกอริทึมผ่าน config ได้", "sx": "engine และ adapter as a security engineer, i want to ให้ key algorithm provider รองรับ eddsa, ecdsa และ ml-dsa (post-quantum), so that ระบบเลือกใช้อัลกอริทึมได้ยืดหยุ่นและรองรับยุคหลังควอนตัม"}, "ENGINE-04": {"id": "ENGINE-04", "what": "กำหนด interface กลาง และสร้าง adapter ตัวแรกครอบ one-core", "out": "Portal และ Wallet เรียกงานผ่านช่องทางเดียว และเปลี่ยน engine ภายหลังได้", "comp": "Engine Layer (interface, adapter, one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Credential Engine Interface & Adapter (Integration Layer)", "pri": "Highest", "pts": 8, "dep": "PLATFORM-02", "sprint": 2, "status": "Backlog", "ws": "Engine Layer (interface, adapter, one-core)", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. สร้าง VCVP Core service เป็น API base เดียวสำหรับ Portal และ Wallet (ไม่มี client ใดเรียก API ของ engine โดยตรง)\n2. กำหนด interface กลางสำหรับเรียกใช้ engine โดยตั้งชื่อคำสั่งตามงานที่ระบบทำจริง (issue/verify/revoke/sign/resolve/schema/status) ไม่อิงศัพท์เฉพาะของ engine ตัวใดตัวหนึ่ง\n3. implement adapter ตัวแรกสำหรับ one-core: แปลง request/response, จัดการ auth, retry/timeout และแปลง error ให้สื่อความหมาย\n4. กำหนดให้ชื่อ/โครงสร้างเฉพาะของ engine ต้องไม่รั่วออกนอก adapter (โดเมนและ API ที่เปิดให้ client ต้องเป็นกลาง)\n5. ออกแบบให้รองรับ engine มากกว่าหนึ่งตัวตั้งแต่ต้น แม้เฟสนี้จะติดตั้งใช้งานจริงเพียงตัวเดียว (one-core) เพื่อไม่ให้ต้องรื้อโครงสร้างเมื่อเพิ่ม engine ภายหลัง (การรองรับหลาย engine จริงอยู่ที่ ENGINE-07)\n6. เพิ่ม architecture test เข้า CI ที่ fail อัตโนมัติเมื่อโค้ดชั้นโดเมนอ้างถึงโครงสร้างของ engine หรือ adapter โดยตรง\n7. รองรับ adapter 2 แบบ คือ adapter ที่ครอบ engine ที่เราติดตั้งเอง และ adapter แบบอ่านอย่างเดียวที่ครอบ endpoint มาตรฐานของหน่วยงานภายนอก โดย adapter ไม่จำเป็นต้อง implement ครบทุกคำสั่ง", "ac": "1. Portal และ Wallet เรียกใช้ความสามารถได้ครบ flow ผ่าน VCVP Core และไม่มี client ใดเรียก API ของ engine โดยตรง\n2. โค้ดชั้นโดเมนไม่มีการอ้างถึงชื่อ/โครงสร้างเฉพาะของ engine ตัวใดตัวหนึ่ง (ทดสอบกับ adapter ของ one-core ซึ่งเป็น adapter ตัวเดียวใน sprint นี้)\n3. จัดการ error/timeout จาก engine และ return error ที่สื่อความหมาย\n4. architecture test ทำงานใน CI และ fail จริงเมื่อทดลองใส่การอ้างถึง engine เข้าไปในชั้นโดเมน", "sx": "engine และ adapter as a backend engineer, i want to ให้ vcvp core เรียกใช้งาน engine ผ่าน interface กลาง โดยมี adapter เป็นตัวแปลง, so that เพิ่มหรือเปลี่ยน engine ในอนาคตได้โดยไม่กระทบโดเมนและ client"}, "ENGINE-05": {"id": "ENGINE-05", "what": "ใช้ตัวตรวจลายเซ็นของ engine และ resolve DID ของ issuer", "out": "ตรวจได้ว่า VC ออกโดย issuer ตัวจริงและไม่ถูกแก้ไข", "comp": "Engine Layer (interface, adapter, one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Crypto Provider (Signature Verification)", "pri": "Highest", "pts": 5, "dep": "KEY-01, ENGINE-03", "sprint": 3, "status": "Backlog", "ws": "Engine Layer (interface, adapter, one-core)", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. พัฒนาคำสั่ง verify ใน adapter โดยส่งงานตรวจลายเซ็นให้ one-core ทำ ไม่เขียน crypto เอง ครอบคลุมอัลกอริทึมที่เปิดไว้ใน ENGINE-03 (EdDSA/ECDSA/ML-DSA)\n2. resolve DID ของ issuer เพื่อดึง public key\n3. เปิด verify/resolve เป็น API ของ VCVP Core ให้ Portal และ Wallet เรียกใช้ได้", "ac": "1. return สถานะผลการตรวจสอบ ทั้งกรณีที่ผ่านและไม่ผ่าน\n2. return รายละเอียดผลการ verify ครบทุกอัลกอริทึมที่ใช้ออก\n3. ดึง public key จาก DID ของ issuer อัตโนมัติ", "sx": "engine และ adapter as a verifier developer, i want to ตรวจสอบลายเซ็นดิจิทัลและความถูกต้องของ vc/vp ผ่าน crypto provider, so that มั่นใจได้ว่าใบรับรองออกโดย issuer จริงและไม่ถูกแก้ไข"}, "ENGINE-06": {"id": "ENGINE-06", "what": "fork one-core และวาง process sync upstream", "out": "รักษา patch ของเราไว้ได้ ขณะที่ยัง sync upstream release ใหม่ได้ต่อเนื่อง โดยไม่เกิด drift", "comp": "Engine Layer (interface, adapter, one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "one-core Fork Setup & Upstream Maintenance", "pri": "High", "pts": 8, "dep": "PLATFORM-02", "sprint": 5, "status": "Backlog", "ws": "Engine Layer (interface, adapter, one-core)", "phase": "Phase 2 เติมความสามารถ", "scope": "1. Fork repo one-core (Apache 2.0) และ ตั้ง CI/CD ของ fork + legal check (NOTICE/trademark/patent)\n2. Pin upstream version และ automated upstream-sync test\n3. เก็บการแก้เป็น patch queue แบบ rebase บน upstream (ไม่ merge ปน) เพื่อนับ patch และแก้ conflict ทีละตัวได้\n4. คุม drift ด้วยทะเบียน patch (เจ้าของ/เหตุผล/เงื่อนไขการลบ) และเพดานจำนวน patch โดยประเมินรายกรณีว่า patch ไหนควรส่ง PR กลับ upstream", "ac": "1. มี fork repo และ CI ที่ build/test ผ่าน\n2. sync upstream แล้ว patch ของเรายังอยู่ และ test ผ่าน\n3. มี runbook sync upstream และทะเบียน patch ที่ระบุไฟล์ที่แก้ (Apache 2.0 #4b)", "sx": "engine และ adapter as a devops/backend engineer, i want to ตั้งและดูแล fork ของ one-core, so that แก้ one-core ได้และ sync กับ upstream ระยะยาวโดยไม่พัง"}, "ENGINE-07": {"id": "ENGINE-07", "what": "ให้ adapter ประกาศความสามารถ และเลือก engine ตามหน่วยงาน", "out": "ต่อ engine หลายเจ้าพร้อมกันได้ และปฏิเสธงานที่ engine ไม่รองรับพร้อมเหตุผล", "comp": "Engine Layer (interface, adapter, one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Engine Capability & Routing (Multi-engine)", "pri": "High", "pts": 8, "dep": "ENGINE-04, IDENTITY-04", "sprint": 5, "status": "Backlog", "ws": "Engine Layer (interface, adapter, one-core)", "phase": "Phase 2 เติมความสามารถ", "scope": "1. เพิ่มคำสั่ง capabilities ใน interface กลาง ให้แต่ละ adapter return ความสามารถของ engine ตัวเองให้ VCVP Core (format, algorithm, วิธีเพิกถอน, เวอร์ชันโปรโตคอลที่รองรับ)\n2. ตรวจความสามารถก่อนสั่งงาน และปฏิเสธพร้อมเหตุผลที่ชัดเจนเมื่อ engine ไม่รองรับ\n3. routing: เลือก engine ตามหน่วยงาน/ประเภท credential จาก engine profile ขององค์กร\n4. รองรับการเปิดใช้ engine หลายตัวพร้อมกันในระบบเดียว\n5. สร้าง adapter จำลอง (stub) ที่ไม่ต่อกับ engine จริง โดยประกาศ capabilities ต่างจาก adapter ของ one-core เพื่อใช้พิสูจน์การทำงานแบบหลาย engine และใช้ในการทดสอบอัตโนมัติ", "ac": "1. เพิ่ม adapter ตัวใหม่เข้าระบบได้โดยไม่ต้องแก้โค้ดในชั้นโดเมน\n2. สั่งงานที่ engine ไม่รองรับ ระบบปฏิเสธพร้อมเหตุผลชัดเจน ไม่ล้มแบบไม่ทราบสาเหตุ\n3. ตั้งค่าให้หน่วยงานคนละแห่งใช้ adapter คนละตัว (one-core และ adapter จำลอง) แล้วทำงานพร้อมกันได้ถูกต้อง โดยแต่ละหน่วยงานได้ผลจาก engine ของตัวเอง", "sx": "engine และ adapter as a backend engineer, i want to ให้ระบบรู้ความสามารถของแต่ละ engine และเลือก engine ตามหน่วยงานได้, so that รองรับการต่อกับ engine หลายตัวพร้อมกันโดยไม่พังแบบไม่ทราบสาเหตุ"}, "ENGINE-08": {"id": "ENGINE-08", "what": "เปิดใช้ formatter mdoc ตาม ISO 18013-5", "out": "ออก mDL ที่ใช้ร่วมกับระบบสากลได้", "comp": "Engine Layer (interface, adapter, one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "mDoc / ISO 18013-5 (mDL) Format Support", "pri": "High", "pts": 5, "dep": "ENGINE-02, ENGINE-03", "sprint": 6, "status": "Backlog", "ws": "Engine Layer (interface, adapter, one-core)", "phase": "Phase 2 เติมความสามารถ", "scope": "1. เปิดใช้ formatter mso_mdoc (ISO/IEC 18013-5) ใน one-core\n2. เปิดการออก mDoc เป็น API ของ VCVP Core โดย client ไม่เรียก one-core โดยตรง\n3. ทดสอบออก mDoc (MSO ลงนาม) และนำเสนอผ่าน mdoc-OpenID4VP", "ac": "1. ออก VC mDoc (mso_mdoc) ที่มี MSO ลงนามถูกต้อง\n2. verify mDoc และ data elements ได้\n3. นำเสนอ mDoc ผ่าน OpenID4VP ได้", "sx": "engine และ adapter as an issuer developer, i want to ออกใบรับรองรูปแบบ mdoc (iso/iec 18013-5) นอกเหนือจาก sd-jwt, so that รองรับใบขับขี่ดิจิทัล (mdl) และ use case ตามมาตรฐาน iso/etda"}, "ENGINE-09": {"id": "ENGINE-09", "what": "จัดการ certificate chain ของ mDoc (IACA / Document Signer)", "out": "mDoc ที่ออกถูกตรวจสอบได้จริงโดย verifier ภายนอก", "comp": "Engine Layer (interface, adapter, one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Document Signer Certificate (mDoc / ISO 18013-5)", "pri": "Medium", "pts": 8, "dep": "ENGINE-08", "sprint": 6, "status": "Backlog", "ws": "Engine Layer (interface, adapter, one-core)", "phase": "Phase 2 เติมความสามารถ", "scope": "1. จัดการ certificate chain สำหรับ mDoc (IACA / Document Signer) ตาม ISO/IEC 18013-5\n2. ผูก certificate กับกุญแจขององค์กร และต่ออายุก่อนหมดอายุ\n3. เผยแพร่/แลกเปลี่ยน trust anchor ให้ verifier ใช้ตรวจสอบได้\n4. กำหนดวิธีเพิกถอน mDoc ซึ่งใช้กลไกคนละแบบกับ SD-JWT (ISO 18013-5 อิง certificate ไม่ใช่ Bitstring Status List) โดยเผยแพร่รายการเพิกถอน certificate ให้ verifier ตรวจได้", "ac": "1. mDoc ที่ออกมี certificate chain ที่ verifier ตรวจสอบผ่าน\n2. certificate ใกล้หมดอายุมีการแจ้งเตือนและต่ออายุได้ โดย mDoc ที่ออกไปแล้วยังตรวจได้\n3. เพิกถอน Document Signer certificate แล้ว verifier ภายนอกตรวจ mDoc ที่ออกด้วย certificate นั้นได้ผลเป็นไม่ผ่าน", "sx": "engine และ adapter as a security engineer, i want to จัดการ certificate chain สำหรับ mdoc ตาม iso 18013-5, so that verifier ตรวจสอบ mdoc ที่เราออกได้จริงตามมาตรฐาน"}, "ENGINE-10": {"id": "ENGINE-10", "what": "หา gap แล้วปรับ engine ตามข้อกำหนดกฎหมายไทย/ETDA", "out": "engine ทำงานตรงข้อกำหนด ETDA พร้อมเอกสารอ้างอิงสำหรับการตรวจสอบ", "comp": "Engine Layer (interface, adapter, one-core)", "group": "Engine และ Adapter (แกนกลางที่ต่อกับ one-core)", "color": "#6b7280", "feature": "Thai Law / ETDA Compliance Adaptation", "pri": "High", "pts": 13, "dep": "PLATFORM-02, ENGINE-06", "sprint": 7, "status": "Backlog", "ws": "Engine Layer (interface, adapter, one-core)", "phase": "Phase 3 พร้อมเปิดใช้จริง", "scope": "1. รวบรวมข้อกำหนดตามกฎหมายไทย/ETDA ที่กระทบ one-core (เช่น อัลกอริทึม/crypto ที่รับรอง, credential profile, trust framework, data residency)\n2. วิเคราะห์ gap ระหว่าง one-core ปัจจุบันกับข้อกำหนด\n3. implement/ปรับแต่ง one-core ตาม gap (การจัดการ fork ดู ENGINE-06)\n4. จัดทำเอกสาร mapping ความสอดคล้องสำหรับ audit (หมายเหตุ: ต้องแตกเป็น sub-task เมื่อข้อกำหนดชัด)", "ac": "1. มีรายการข้อกำหนด ETDA/กฎหมายไทยที่กระทบ และ gap analysis\n2. one-core ปรับให้รองรับข้อกำหนดที่ระบุครบ\n3. มีเอกสาร mapping ความสอดคล้องสำหรับยื่น/ตรวจรับ", "sx": "engine และ adapter as a compliance/backend engineer, i want to ปรับแต่ง/เพิ่มความสามารถใน one-core ให้สอดคล้องกฎหมายไทย (etda/pdpa), so that ระบบผ่านเกณฑ์กำกับดูแลของไทยก่อนใช้งานจริง"}, "EDGE-01": {"id": "EDGE-01", "what": "เผยแพร่ did.json บน domain ของเรา และติดตั้ง/ต่ออายุใบรับรอง TLS", "out": "การเชื่อมต่อจากภายนอกสามารถดึง DID document ของเราได้ผ่าน HTTPS", "comp": "Public Edge & Resolver", "group": "ด่านหน้าสาธารณะ (รับจาก wallet และคนภายนอก)", "color": "#d85a30", "feature": "did:web Hosting & TLS Certificate Setup", "pri": "Medium", "pts": 5, "dep": "PLATFORM-03", "sprint": 1, "status": "Backlog", "ws": "Public Edge & Resolver", "phase": "Phase 0 ตั้งฐาน", "scope": "1. ตั้งค่า web hosting/reverse proxy สำหรับ /.well-known/did.json\n2. ออก/ต่ออายุใบรับรอง TLS (เช่น Let's Encrypt)\n3. บังคับ HTTPS (ปฏิเสธ HTTP)\n4. จัดการ domain ต่อ environment", "ac": "1. เข้าถึง /.well-known/did.json ผ่าน HTTPS ได้และ resolve สำเร็จ\n2. ใบรับรอง TLS ถูกต้องและตั้ง auto-renew\n3. บังคับ HTTPS (ปฏิเสธ HTTP) สำหรับ endpoint ที่ host ของ DID", "sx": "ด่านหน้าสาธารณะ as a platform engineer, i want to host did.json ผ่าน https พร้อมใบรับรอง tls, so that did:web ขององค์กร resolve ได้และน่าเชื่อถือ"}, "EDGE-02": {"id": "EDGE-02", "what": "ตั้ง cache ของ DID document และ status list พร้อม TTL", "out": "ตรวจ VC ได้เร็วขึ้นและไม่ยิงซ้ำไปต้นทางทุกครั้ง", "comp": "Public Edge & Resolver", "group": "ด่านหน้าสาธารณะ (รับจาก wallet และคนภายนอก)", "color": "#d85a30", "feature": "DID Document & Status List Caching", "pri": "Medium", "pts": 5, "dep": "KEY-01", "sprint": 1, "status": "Backlog", "ws": "Public Edge & Resolver", "phase": "Phase 0 ตั้งฐาน", "scope": "1. ตั้งค่า caching ของ DID Document, status list และ vct / type metadata (one-core internal และ ชั้น VCVP Core)\n2. กำหนด TTL และ invalidation policy ตามประเภทข้อมูล\n3. รองรับ purge cache ราย entry", "ac": "1. การ resolve DID ครั้งที่ 2 ภายใน TTL อ่านจาก cache โดยไม่ยิง network\n2. เมื่อ TTL หมดอายุ ระบบ refresh ค่าใหม่อัตโนมัติ\n3. สามารถสั่ง purge cache ราย entry ได้ผ่าน admin API", "sx": "ด่านหน้าสาธารณะ as a platform engineer, i want to ให้ระบบ cache ผลการ resolve did document และ status list, so that ลดภาระ network และทำงานต่อได้แม้ปลายทางช้า/ล่ม"}, "EDGE-03": {"id": "EDGE-03", "what": "ตั้ง edge ให้ทุก endpoint สาธารณะอยู่บน domain ของเราเอง", "out": "เปลี่ยน engine ข้างหลังได้โดย QR ที่ออกไปแล้วยังใช้ได้", "comp": "Public Edge & Resolver", "group": "ด่านหน้าสาธารณะ (รับจาก wallet และคนภายนอก)", "color": "#d85a30", "feature": "Public Endpoint Gateway & Domain Ownership", "pri": "High", "pts": 5, "dep": "PLATFORM-03, EDGE-01", "sprint": 2, "status": "Backlog", "ws": "Public Edge & Resolver", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. ตั้ง edge/reverse proxy ให้ endpoint สาธารณะทั้งหมด (SSI protocol, status list, did.json, issuer metadata, vct / type metadata, credential schema, trust list) อยู่บน domain ของเรา\n2. เส้นทางภายในชี้ไป engine/บริการที่รับผิดชอบ โดยเปลี่ยนปลายทางได้โดย URL ภายนอกไม่เปลี่ยน\n3. แยกทางเข้า: endpoint สาธารณะกับ management API ไม่ใช้ทางเข้าเดียวกัน\n4. กำหนด cache policy และ rate limit ที่ชั้น edge", "ac": "1. wallet และ verifier ภายนอกเห็นเฉพาะ domain ของเรา ไม่เห็น host ของ engine\n2. เปลี่ยน backend ปลายทางได้โดย URL สาธารณะไม่เปลี่ยน\n3. management API เข้าถึงจากอินเทอร์เน็ตสาธารณะไม่ได้", "sx": "ด่านหน้าสาธารณะ as a platform architect, i want to ให้ endpoint สาธารณะทั้งหมดอยู่บน domain ของเราเอง, so that เปลี่ยน engine ข้างหลังได้โดย qr และการตั้งค่าที่ประกาศออกไปแล้วยังใช้ได้"}, "PROTOCOL-01": {"id": "PROTOCOL-01", "what": "เปิด flow ออก VC ตามมาตรฐาน OpenID4VCI", "out": "wallet มาตรฐานทั่วไปรับ VC จากระบบเราได้", "comp": "SSI Protocol Service", "group": "ด่านหน้าสาธารณะ (รับจาก wallet และคนภายนอก)", "color": "#d85a30", "feature": "OpenID4VCI (Credential Issuance)", "pri": "Highest", "pts": 5, "dep": "ENGINE-02, WALLET-01, EDGE-03", "sprint": 4, "status": "Backlog", "ws": "SSI Protocol Service", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. ตั้งค่า issuanceProtocol ใน one-core ผ่าน config โดยเปิดเวอร์ชัน OpenID4VCI ที่ตกลงกับ wallet ปลายทาง (รองรับ pre-authorized & authorization code) และปิดเวอร์ชันที่ไม่ได้ใช้\n2. integrate การออก VC ให้ทำผ่าน VCVP Core (ISSUANCE-02)\n3. ทดสอบ flow รับ VC เข้ากระเป๋า และ proof of possession\n4. endpoint และ metadata ที่ wallet มองเห็น ต้องอยู่บน domain ของเราเอง (ดู EDGE-03) เพื่อไม่ผูกกับ engine", "ac": "1. Wallet รับ VC ผ่าน flow OpenID4VCI ได้สำเร็จ\n2. รองรับทั้ง pre-authorized และ authorization code flow\n3. ตรวจ proof of possession ก่อนออก VC", "sx": "ด่านหน้าสาธารณะ as an integration engineer, i want to เปิดช่องทาง openid4vci สำหรับการรับมอบ vc, so that wallet รับ vc จาก issuer ได้ตามมาตรฐานสากล"}, "PROTOCOL-02": {"id": "PROTOCOL-02", "what": "เปิด flow ยื่น/ตรวจ VP ตาม OpenID4VP พร้อมกัน replay", "out": "wallet ยื่น VP ให้ verifier ได้อย่างปลอดภัย", "comp": "SSI Protocol Service", "group": "ด่านหน้าสาธารณะ (รับจาก wallet และคนภายนอก)", "color": "#d85a30", "feature": "OpenID4VP (Credential Presentation)", "pri": "Highest", "pts": 5, "dep": "WALLET-03, ENGINE-05, EDGE-03", "sprint": 4, "status": "Backlog", "ws": "SSI Protocol Service", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. ตั้งค่า verificationProtocol ใน one-core ผ่าน config โดยเปิดเวอร์ชัน OpenID4VP ที่ตกลงกับ wallet ปลายทาง และปิดเวอร์ชันที่ไม่ได้ใช้ (one-core มีให้เลือกหลายเวอร์ชัน การเลือกเป็นตัวกำหนดว่า wallet เจ้าไหนใช้งานกับเราได้)\n2. integrate การยื่น/ตรวจ VP ให้ทำผ่าน VCVP Core (VERIFICATION-01)\n3. ทดสอบ flow ยื่น VP และ กัน replay (nonce/audience)\n4. endpoint และ metadata ที่ wallet มองเห็น ต้องอยู่บน domain ของเราเอง (ดู EDGE-03) เพื่อไม่ผูกกับ engine", "ac": "1. Verifier ส่ง request และรับ VP กลับได้สำเร็จ\n2. ตรวจ nonce/audience กัน replay\n3. รองรับ VP ที่ผ่าน selective disclosure", "sx": "ด่านหน้าสาธารณะ as an integration engineer, i want to เปิดช่องทาง openid4vp สำหรับการยื่นตรวจ vp, so that verifier ขอและรับ vp จาก wallet ได้ตามมาตรฐานสากล"}, "IDENTITY-01": {"id": "IDENTITY-01", "what": "ล็อกอินด้วย SSO/MFA พร้อมจัดการ session และ token", "out": "เฉพาะเจ้าหน้าที่ที่ได้รับอนุญาตเข้า Portal ได้", "comp": "IAM & Tenant Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "Admin Authentication & SSO", "pri": "Highest", "pts": 8, "dep": "PLATFORM-02", "sprint": 2, "status": "Backlog", "ws": "IAM & Tenant Service", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. Portal authentication: รองรับวิธียืนยันตัวตนที่กำหนด เช่น SSO (OIDC/SAML) + MFA พร้อม session/token (JWT+refresh)\n2. ออก/ตรวจ session ร่วมกับ VCVP Core", "ac": "1. ล็อกอินด้วยวิธีที่กำหนด (เช่น SSO/OIDC) และออก session token ได้สำเร็จ\n2. บังคับ MFA สำหรับ role ที่มีสิทธิ์สูง (admin)\n3. Token หมดอายุและ refresh ได้ และ logout revoke session ทันที", "sx": "ระบบภายใน as a portal administrator, i want to ล็อกอินเข้าระบบหลังบ้านด้วยวิธีการยืนยันตัวตนที่กำหนด, so that เฉพาะเจ้าหน้าที่ที่ได้รับอนุญาตเท่านั้นที่เข้าถึง portal ได้"}, "IDENTITY-02": {"id": "IDENTITY-02", "what": "บริหารองค์กร (tenant) และผูก DID/key ของแต่ละองค์กร", "out": "หลายหน่วยงานใช้ระบบเดียวกันได้โดยข้อมูลแยกขาด", "comp": "IAM & Tenant Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "Multi-Tenancy / Organization Management", "pri": "Highest", "pts": 8, "dep": "IDENTITY-01, IDENTITY-04", "sprint": 2, "status": "Backlog", "ws": "IAM & Tenant Service", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. Portal UI บริหารจัดการองค์กร (tenant) สร้าง/แก้ไข\n2. ผู้ใช้เข้าถึงได้เฉพาะข้อมูลขององค์กรตัวเอง โดย VCVP Core ตรวจทุก request ยกเว้นข้อมูลที่เผยแพร่สู่สาธารณะโดยเจตนา (did.json, status list, schema/type metadata ที่เผยแพร่แล้ว, trust list) ซึ่งเข้าถึงได้ข้ามองค์กร\n3. ผูก DID/Key ของแต่ละองค์กร", "ac": "1. สร้าง/แก้ไของค์กรได้ และข้อมูลถูก scope ตาม tenant\n2. ทรัพยากร (schema, VC, key) ผูกกับ organization ที่ถูกต้อง", "sx": "ระบบภายใน as a platform operator, i want to บริหารหลายองค์กร (tenant) บน portal เดียว, so that แต่ละหน่วยงาน issuer/verifier มีข้อมูลและสิทธิ์แยกขาดจากกัน"}, "IDENTITY-03": {"id": "IDENTITY-03", "what": "กำหนด role/permission และบังคับสิทธิ์ที่ทุก endpoint", "out": "แต่ละคนทำได้เฉพาะสิ่งที่ตรงกับบทบาทของตน", "comp": "IAM & Tenant Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "Role-Based Access Control (RBAC)", "pri": "Highest", "pts": 8, "dep": "IDENTITY-02", "sprint": 2, "status": "Backlog", "ws": "IAM & Tenant Service", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. RBAC: role/permission model (Admin/Issuer/Verifier/Auditor)\n2. บังคับสิทธิ์ที่ VCVP Core (ทุก endpoint) และ Portal UI ซ่อน/แสดงตาม role\n3. assign role ต่อผู้ใช้ในแต่ละ org", "ac": "1. ผู้ใช้เห็นและทำได้เฉพาะเมนูและการกระทำตาม role\n2. การเรียก API ที่ไม่มีสิทธิ์ return 403\n3. เปลี่ยน role ของผู้ใช้แล้วสิทธิ์อัปเดตทันทีใน session ถัดไป", "sx": "ระบบภายใน as a portal administrator, i want to กำหนดบทบาทและสิทธิ์ (admin / issuer operator / verifier operator / auditor), so that ควบคุมว่าใครทำอะไรได้บ้างในระบบ"}, "IDENTITY-04": {"id": "IDENTITY-04", "what": "สร้างฐานข้อมูลของ VCVP Core พร้อม org scoping และ mapping ID", "out": "ระบบเก็บสถานะของตัวเองได้ และข้อมูลข้ามองค์กรกันไม่ได้", "comp": "IAM & Tenant Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "Multi-tenant Context & Data Store", "pri": "High", "pts": 8, "dep": "ENGINE-04, PLATFORM-04", "sprint": 2, "status": "Backlog", "ws": "IAM & Tenant Service", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. ออกแบบ และสร้างฐานข้อมูลของ VCVP Core (issuance/verification/revocation/consent records)\n2. ผูก/แยกข้อมูลตาม organization/tenant (org scoping) ไม่ปนข้ามองค์กร\n3. จับคู่ (mapping) ID และสถานะระหว่าง entity ของเรากับ object ใน engine โดย ID และสถานะที่ client เห็นต้องเป็นของเราเอง (ID ของ engine ไม่หลุดออกนอก adapter)\n4. เก็บสถานะอื่นๆ ที่เกี่ยวข้องกับการทำงาน แต่ที่ engine ไม่มี (เช่น offer pending/claimed, webhook status)", "ac": "1. ทุก record ถูกผูกและ query ตาม tenant ได้ถูกต้อง\n2. ผู้ใช้ต่างองค์กรเข้าถึงข้อมูลข้ามกันไม่ได้\n3. map สถานะกับ engine ได้ตรง (sync ไม่หลุด)", "sx": "ระบบภายใน as a backend engineer, i want to ให้ vcvp core มีฐานข้อมูลของตัวเองพร้อม org scoping, so that เก็บสถานะ/record ที่ one-core ไม่ได้เก็บ และแยกข้อมูลตามองค์กร"}, "IDENTITY-05": {"id": "IDENTITY-05", "what": "สร้าง/แก้ไข/ระงับผู้ใช้ และกำหนด role ต่อองค์กร", "out": "ผู้ดูแลจัดการผู้ใช้และสิทธิ์ได้เองโดยไม่ต้องพึ่ง dev", "comp": "IAM & Tenant Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "User Management (CRUD)", "pri": "Medium", "pts": 5, "dep": "IDENTITY-03", "sprint": 3, "status": "Backlog", "ws": "IAM & Tenant Service", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "Implement user management: แสดงรายชื่อผู้ใช้พร้อม role/organization, สร้าง/แก้ไข/ระงับผู้ใช้ และ assign role/org ผูกกับ RBAC", "ac": "1. แสดงรายชื่อผู้ใช้พร้อม role/organization\n2. สร้าง/แก้ไข/ระงับผู้ใช้และกำหนด role ได้\n3. การเปลี่ยนแปลงผูกกับ RBAC และบันทึก audit log", "sx": "ระบบภายใน as a portal administrator, i want to สร้าง แก้ไข และกำหนดบทบาทผู้ใช้ในองค์กร, so that บริหารทีมงานและสิทธิ์เข้าถึงได้ครบวงจร"}, "IDENTITY-06": {"id": "IDENTITY-06", "what": "ให้ Wallet ของประชาชนยืนยันตัวตนกับ VCVP Core และผูกกับเครื่อง", "out": "คำขอจากกระเป๋าผูกกับเจ้าของจริง ดึงหรือแก้ข้อมูลของคนอื่นไม่ได้", "comp": "IAM & Tenant Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "Wallet Holder Authentication & Device Binding", "pri": "Highest", "pts": 8, "dep": "WALLET-01, IDENTITY-03, IDENTITY-04", "sprint": 4, "status": "Backlog", "ws": "IAM & Tenant Service", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. ผูกกระเป๋ากับตัวบุคคลครั้งแรก (device binding) ผ่านช่องทางยืนยันตัวตนที่หน่วยงานกำหนด (เช่น OIDC/ThaID) แล้วผูกกับ DID ของผู้ถือ (holder DID) ที่สร้างจากกุญแจในเครื่อง (WALLET-01)\n2. หลังผูกแล้ว ทุก request ใช้การพิสูจน์การถือครองกุญแจแบบ challenge-response แทนการล็อกอินซ้ำ โดย VCVP Core ออก challenge และตรวจลายเซ็นกับ DID ที่ผูกไว้\n3. ออก session/token ให้กระเป๋า และให้ VCVP Core ตรวจทุก request ว่าเข้าถึงได้เฉพาะข้อมูลของเจ้าของ token นั้น โดยใช้กลไกเดียวกับ IDENTITY-03\n4. รองรับกรณีอุปกรณ์สูญหายหรือเปลี่ยนเครื่อง: เพิกถอน binding เดิม และผูกเครื่องใหม่ได้\n5. กัน replay ของ challenge (ใช้ได้ครั้งเดียวและหมดอายุ) และจำกัดอัตราการเรียก\n6. บันทึก audit log ของการผูก การเพิกถอน และการยืนยันตัวตนที่ล้มเหลว (AUDIT-01)", "ac": "1. Wallet ที่ยังไม่ผูก เรียก endpoint ฝั่ง Wallet ไม่ได้ (return 401)\n2. Wallet A ดึงหรือแก้ข้อมูลของ Wallet B ไม่ได้ (return 403) ทดสอบครอบทุก endpoint ฝั่ง Wallet ที่เปิดใช้แล้ว ณ เวลานั้น\n3. ผูกเครื่องใหม่และเพิกถอนเครื่องเดิมได้ และเครื่องเดิมใช้งานต่อไม่ได้ทันที\n4. challenge ใช้ซ้ำไม่ได้และหมดอายุตามที่กำหนด\n5. มี audit log ของการผูก เพิกถอน และการยืนยันตัวตนที่ล้มเหลว", "sx": "ระบบภายใน as a backend engineer, i want to ให้ wallet ของประชาชนยืนยันตัวตนกับ vcvp core ได้, so that คำขอที่ส่งจากกระเป๋าถูกผูกกับเจ้าของจริง และไม่มีใครดึงหรือแก้ข้อมูลของคนอื่นได้"}, "TRUST-01": {"id": "TRUST-01", "what": "จัดการทะเบียนหน่วยงานที่เชื่อถือได้ ทั้ง issuer และ verifier และเผยแพร่ trust list", "out": "ตรวจสอบได้ว่า VC มาจากหน่วยงานที่ได้รับการรับรองจริง และผู้ขอข้อมูลเป็นผู้ที่ได้รับอนุญาต", "comp": "Trust Registry Service", "group": "ระบบภายใน (ตัวตน สิทธิ์ และ trust)", "color": "#5f5e5a", "feature": "Trusted Issuer & Verifier Registry Management", "pri": "High", "pts": 13, "dep": "VERIFICATION-03, IDENTITY-02", "sprint": 5, "status": "Backlog", "ws": "Trust Registry Service", "phase": "Phase 2 เติมความสามารถ", "scope": "1. หน้าจอสำหรับ จัดการทะเบียนหน่วยงานที่เชื่อถือได้ ครอบคลุมทั้งบทบาท issuer และ verifier (เพิ่ม/ถอน และ accreditation status ตาม ETDA)\n2. เก็บข้อมูลของแต่ละหน่วยงาน ได้แก่ ชื่อ identifier (DID) เว็บไซต์ โลโก้ สถานะการรับรอง และวันหมดอายุ โดยชื่อและโลโก้ใช้แสดงให้ผู้ใช้เห็น ส่วน identifier ใช้เป็นตัวชี้ให้ระบบไปดึง schema และ metadata ของหน่วยงานนั้นต่อได้\n3. เผยแพร่ trust list เป็น endpoint สาธารณะบน domain ของเรา (EDGE-03) และให้ขั้นตอนตรวจ VP ดึงไปใช้อัตโนมัติ (VERIFICATION-03)\n4. รองรับทั้งการเป็นผู้เผยแพร่ trust list เอง และการรับ trust list จากผู้กำกับดูแลภายนอก", "ac": "1. เพิ่ม/ถอนหน่วยงานออกจาก trust list ได้ทั้งบทบาท issuer และ verifier และเผยแพร่ได้\n2. ขั้นตอนตรวจ VP ดึง trust list ล่าสุดมาใช้ และปฏิเสธ VC จาก issuer ที่ไม่อยู่ในรายการ\n3. บันทึกสถานะการรับรองและวันหมดอายุของแต่ละหน่วยงาน และเมื่อหมดอายุแล้วมีผลทันที\n4. Wallet แสดงให้ผู้ถือเห็นได้ว่าผู้ขอข้อมูลรายนี้เป็นใครและได้รับการรับรองหรือไม่ ก่อนกดยินยอม\n5. verifier ที่ไม่อยู่ในทะเบียนหรือถูกถอนแล้ว เปิด session ขอตรวจไม่ได้", "sx": "ระบบภายใน as a governance administrator, i want to บริหาร trust list ของ issuer ที่เชื่อถือได้, so that verifier ยอมรับเฉพาะ vc จากผู้ออกที่ผ่านการรับรอง (สอดคล้อง etda)"}, "ISSUANCE-01": {"id": "ISSUANCE-01", "what": "บันทึก event การออก/เพิกถอน พร้อมเวลาและผู้กระทำ", "out": "ตรวจย้อนหลังได้ว่าใครออก VC ใบไหนเมื่อไหร่", "comp": "Issuance Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Issuance Audit & Logging", "pri": "Medium", "pts": 5, "dep": "ENGINE-02, REVOCATION-01", "sprint": 3, "status": "Backlog", "ws": "Issuance Service", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "เพิ่ม audit trail แบบ append-only สำหรับ event issue/revoke/suspend พร้อม timestamp, actor, credential id (โดยไม่เก็บข้อมูลส่วนบุคคล) เพื่อรองรับ compliance และ PDPA", "ac": "1. ทุก event การออก/เพิกถอนถูกบันทึกพร้อม timestamp และผู้กระทำ\n2. Log ไม่มีข้อมูลส่วนบุคคล (PII) ในรูปแบบ plain text\n3. ค้นหา log ตาม credential id และช่วงเวลาได้", "sx": "งานหลักของระบบ as an issuer administrator, i want to บันทึก audit log ของการออกและเพิกถอน vc ทุกครั้ง, so that ตรวจสอบย้อนหลังได้ตามข้อกำหนดกำกับดูแล"}, "ISSUANCE-02": {"id": "ISSUANCE-02", "what": "ควบคุม flow และสถานะการออก VC ตั้งแต่สร้าง offer จนผู้ถือรับสำเร็จ", "out": "ดำเนินการออก VC ในรูปแบบ QR และติดตามสถานะจนผู้ถือรับสำเร็จ", "comp": "Issuance Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Issuance Workflow Orchestration", "pri": "Highest", "pts": 13, "dep": "IDENTITY-04, PROTOCOL-01", "sprint": 4, "status": "Backlog", "ws": "Issuance Service", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. รับคำขอออก VC จาก Portal และเรียก engine ผ่าน interface กลาง สร้าง credential offer (OpenID4VCI)\n2. สร้าง/บันทึก issuance record และ สถานะ (pending/claimed/expired)\n3. return QR/deeplink ให้ Portal\n4. sync สถานะ offer จาก engine ผ่าน interface กลาง\n5. รองรับ idempotency (ยิงคำขอซ้ำต้องไม่ได้ VC ซ้ำ) และตั้งงานเบื้องหลังตามรอบเวลา เปลี่ยนสถานะ offer ที่เกินกำหนดแล้วยังไม่มีผู้มารับให้เป็นหมดอายุ เพื่อไม่ให้ QR เดิมถูกนำไปใช้ภายหลัง (one-core มี task INTERACTION_EXPIRATION_CHECK ให้ใช้)", "ac": "1. สร้าง credential offer ผ่าน VCVP Core สำเร็จ และได้ QR/deeplink\n2. ติดตามสถานะ offer (pending เป็น claimed) ได้\n3. sync สถานะจาก engine อัปเดตถูกต้อง", "sx": "งานหลักของระบบ as a backend engineer, i want to ให้ vcvp core orchestrate การออก vc ผ่าน one-core, so that portal สั่งออก vc ได้โดยมี vcvp core จัดการ flow และสถานะ"}, "ISSUANCE-03": {"id": "ISSUANCE-03", "what": "รับคำขอแบบ self-service แล้วผูกคำขอกับ VC ที่ออกให้", "out": "ประชาชนยื่นขอเองแล้วได้ offer กลับโดยไม่ต้องติดต่อเจ้าหน้าที่", "comp": "Issuance Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Credential Request & Linking Workflow", "pri": "Medium", "pts": 5, "dep": "ISSUANCE-02, IDENTITY-06", "sprint": 5, "status": "Backlog", "ws": "Issuance Service", "phase": "Phase 2 เติมความสามารถ", "scope": "1. รับคำขอ self-service (เลขบัตร ปชช./เลขใบอนุญาต) จาก Wallet\n2. ตรวจ/ส่งต่อให้ Issuer และสร้าง credential offer ผ่าน flow ออก VC\n3. link คำขอกับ credentialId เมื่อออกสำเร็จ และแสดงสถานะ", "ac": "1. รับคำขอ self-service และสร้าง offer ตอบกลับได้\n2. เชื่อมคำขอกับ credentialId ถูกต้อง\n3. แสดงสถานะคำขอย้อนหลังได้", "sx": "งานหลักของระบบ as a backend engineer, i want to ให้ vcvp core รองรับคำขอรับ vc แบบ self-service และเชื่อมโยงคำขอ, so that ผู้ถือเริ่มขอรับ vc เองได้และระบบเชื่อมกับการออกจริง"}, "VERIFICATION-01": {"id": "VERIFICATION-01", "what": "คุม session การตรวจ VP และรวบรวมผลจากทุกชั้น", "out": "เปิดจุดตรวจแล้วได้ผลผ่าน/ไม่ผ่านทันทีพร้อมเหตุผล", "comp": "Verification Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Verification Workflow Orchestration", "pri": "Highest", "pts": 13, "dep": "IDENTITY-04, PROTOCOL-02", "sprint": 4, "status": "Backlog", "ws": "Verification Service", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. รับ proof request ผ่านทางเข้าเดียวกัน ไม่ว่าจะมาจาก Verifier Portal ของเราหรือจากระบบภายนอกที่เรียกผ่าน API แล้วเรียก engine ผ่าน interface กลาง (OpenID4VP) เปิด verification session (sprint นี้เปิดใช้ช่องทาง Portal ก่อน ส่วนการออก API key ให้ระบบภายนอกอยู่ที่ INTEGRATION-01)\n2. สร้าง QR/deeplink และจัดการ nonce/audience\n3. รับ vp_token/ผล verify จาก engine แล้วบันทึก verification record\n4. return ผล verified/failed แบบ real-time\n5. ก่อนเปิด verification session ตรวจว่าผู้ขอตรวจอยู่ในทะเบียน verifier ที่ได้รับการรับรองและยังไม่ถูกถอน ถ้าไม่ผ่านให้ปฏิเสธพร้อมเหตุผล (ใน sprint นี้ใช้รายชื่อจาก config ก่อน ส่วนหน้าจอบริหารจัดการอยู่ที่ TRUST-01)", "ac": "1. เปิด verification session ผ่าน VCVP Core และได้ QR/deeplink\n2. รับผล verified/failed พร้อมเหตุผล และบันทึกประวัติ\n3. กัน replay ผ่าน nonce/audience\n4. ผู้ขอตรวจที่ไม่อยู่ในทะเบียนหรือถูกถอนแล้ว เปิด session ไม่ได้ และได้รับเหตุผลที่ระบุสาเหตุชัดเจน\n5. เปิด session ด้วยข้อมูลชุดเดียวกันจากคนละช่องทาง ได้ผลลัพธ์และ QR ที่ใช้งานได้เหมือนกัน", "sx": "งานหลักของระบบ as a backend engineer, i want to ให้ vcvp core orchestrate การตรวจ vp ผ่าน one-core, so that ผู้ขอตรวจที่ได้รับอนุญาต เปิด session ตรวจสอบได้โดยมี vcvp core จัดการ flow และผลลัพธ์"}, "VERIFICATION-02": {"id": "VERIFICATION-02", "what": "ตรวจสถานะเพิกถอนจาก status list พร้อม policy เมื่อดึงไม่ได้", "out": "VC ที่ถูกเพิกถอนถูกปฏิเสธทันทีตอนตรวจ", "comp": "Verification Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Revocation Status Check", "pri": "High", "pts": 8, "dep": "REVOCATION-01, ENGINE-05", "sprint": 4, "status": "Backlog", "ws": "Verification Service", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. ใช้ engine ผ่าน interface กลาง ตรวจสถานะ revocation จาก Bitstring Status List อัตโนมัติ\n2. เรียกผ่าน VCVP Core ตอน verify VP\n3. แยกผล revoked/suspended/active และ cache\n4. กำหนด policy เมื่อดึง status list ไม่ได้ (fail-closed หรือ fail-open) และแจ้งเหตุผลให้ผู้ตรวจทราบ\n5. กำหนดมาตรการสำหรับการดึง status list จาก domain ภายนอกที่เราไม่ได้เป็นเจ้าของ: timeout, จำกัดขนาดข้อมูลที่รับ, ตรวจ certificate ของปลายทาง และกันการยิงเข้าเครือข่ายภายใน (SSRF) ด้วยกฎที่กำหนด", "ac": "1. VC ที่ถูก revoke ในรายการ status list ถูกปฏิเสธ\n2. VC ที่ยัง active ผ่านการตรวจสอบ\n3. แยกผลลัพธ์ระหว่างสถานะ revoked, suspended และ active ได้\n4. VC ที่ status list ชี้ไปยังที่อยู่ภายในเครือข่ายหรือปลายทางที่ไม่อนุญาต ถูกปฏิเสธและบันทึกไว้", "sx": "งานหลักของระบบ as a verifier developer, i want to ตรวจสอบสถานะของ vc กรณี vc ถูกเพิกถอน จาก bitstring status list ของ issuer อัตโนมัติ, so that ปฏิเสธ vc ที่ถูกเพิกถอนได้"}, "VERIFICATION-03": {"id": "VERIFICATION-03", "what": "ตรวจ holder binding, ช่วงเวลา และบังคับ trust policy", "out": "ผ่านเฉพาะหลักฐานที่ถูกต้องครบทุกเงื่อนไขที่กำหนดไว้", "comp": "Verification Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "VP Validation & Trust Policy", "pri": "Medium", "pts": 5, "dep": "ENGINE-05, VERIFICATION-02", "sprint": 4, "status": "Backlog", "ws": "Verification Service", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. ใช้ engine ผ่าน interface กลาง ตรวจ VP (ลายเซ็น/holder binding/ช่วงเวลา validFrom-validUntil)\n2. บังคับ trust policy (trusted issuers / required claims) ในชั้น VCVP Core\n3. เปิดการตั้งค่า trust policy เป็น API ของ VCVP Core ให้ Verifier Portal เรียกใช้ได้ (VERIFIER-01)\n4. ใน sprint นี้ใช้ trust list จาก config ก่อน ส่วนหน้าจอบริหารจัดการอยู่ที่ TRUST-01", "ac": "1. ปฏิเสธ VP จาก issuer นอก trust list\n2. ปฏิเสธ VP ที่ขาด required claim ตาม policy\n3. ตรวจ holder binding ยืนยันผู้ยื่นเป็นเจ้าของ VC", "sx": "งานหลักของระบบ as a verifier administrator, i want to กำหนดนโยบายความน่าเชื่อถือ (trusted issuers / required claims), so that ยอมรับเฉพาะ vp ที่ตรงตามเงื่อนไขทางธุรกิจ"}, "REVOCATION-01": {"id": "REVOCATION-01", "what": "เปิดใช้ Bitstring Status List และบริหาร index/หลาย list", "out": "VC ทุกใบมีสถานะที่ตรวจสอบได้จากภายนอก", "comp": "Revocation Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Revocation Provider (W3C Bitstring Status List)", "pri": "High", "pts": 5, "dep": "ENGINE-02", "sprint": 2, "status": "Backlog", "ws": "Revocation Service", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. ตั้งค่า revocation ใน one-core โดยเปิด W3C Bitstring Status List และปิดตัวที่ไม่ได้ใช้\n2. orchestrate revoke/suspend ผ่าน VCVP Core (REVOCATION-02)\n3. เผยแพร่ status list และ ทดสอบสถานะ\n4. จัดสรร index และบริหารหลาย status list โดยกำหนดขนาดของแต่ละ list ให้ใหญ่พอที่ index ของใบใดใบหนึ่งจะไม่ถูกใช้ระบุตัวตนได้ ไม่ใช่กำหนดจากขนาดไฟล์อย่างเดียว พร้อมรับประกันว่า publish สำเร็จจริง", "ac": "1. ออก VC ใหม่แล้ว VC มีข้อมูลสถานะฝังอยู่ (ชี้ไปยัง status list และตำแหน่งของใบนั้น) และ verifier สามารถตรวจสถานะของ VC ใบนั้นได้\n2. สั่งเพิกถอน (revoke) VC ใบหนึ่ง แล้ว verifier ตรวจ VC ใบนั้นได้ผลเป็น \"ถูกเพิกถอน\" ส่วน VC ใบอื่นยังตรวจได้ผล \"ใช้งานได้\" ตามปกติ\n3. สั่งระงับ (suspend) แล้ว verifier ได้ผล \"ถูกระงับ\" และถ้าปลดระงับ (un-suspend) แล้ว verifier ได้ผลกลับมา \"ใช้งานได้\"\n4. ขนาดของ status list แต่ละชุดเป็นไปตามค่าที่กำหนดไว้ และตรวจสอบได้", "sx": "งานหลักของระบบ as an issuer administrator, i want to สั่งระงับ/เพิกถอนใบรับรองผ่าน revocation provider ตาม w3c bitstring status list v1.0, so that vc ที่ถูกเพิกถอนถูกตรวจจับได้ทันที"}, "REVOCATION-02": {"id": "REVOCATION-02", "what": "orchestrate การเพิกถอน/ระงับ/ปลดระงับ พร้อมบันทึกเหตุผล", "out": "สั่งเพิกถอนแล้วมีผลจริงต่อการตรวจสอบทันที", "comp": "Revocation Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Revocation Workflow", "pri": "High", "pts": 8, "dep": "ISSUANCE-02, REVOCATION-01", "sprint": 5, "status": "Backlog", "ws": "Revocation Service", "phase": "Phase 2 เติมความสามารถ", "scope": "1. orchestrate revoke/suspend/unsuspend ผ่าน interface กลางของ engine (Bitstring Status List)\n2. sync สถานะ revocation กับ engine และบันทึก audit พร้อมเหตุผล", "ac": "1. revoke ผ่าน VCVP Core แล้ว engine อัปเดต status list จริง\n2. บันทึกเหตุผลและข้อมูลผู้ดำเนินการทุกครั้ง", "sx": "งานหลักของระบบ as a backend engineer, i want to ให้ vcvp core จัดการ workflow การเพิกถอน, so that สั่ง revoke/suspend ผ่าน one-core ได้อย่างเป็นระบบ"}, "SCHEMA-01": {"id": "SCHEMA-01", "what": "sync credential schema และรองรับ versioning", "out": "Portal สร้าง template จาก schema ที่ตรงกัน โดยไม่กระทบ VC ที่ออกไปแล้ว", "comp": "Schema Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Schema Sync", "pri": "Medium", "pts": 5, "dep": "ENGINE-04, IDENTITY-02", "sprint": 3, "status": "Backlog", "ws": "Schema Service", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. sync credential schema และ type metadata (vct) ผ่าน interface กลาง (ENGINE-04) แล้วรวมเป็นทะเบียน schema ของระบบ\n2. ออกแบบทะเบียนให้รับ schema จาก adapter ได้หลายตัวโดยไม่ต้องแก้โครงสร้าง เพื่อรองรับหน่วยงานภายนอกในอนาคต (เฟสนี้ยังไม่เชื่อมจริง)\n3. ผูกสายเวอร์ชันของ schema ว่าเวอร์ชันใดเป็นใบประเภทเดียวกัน (engine เก็บแต่ละเวอร์ชันเป็นคนละก้อน ไม่ได้เก็บความสัมพันธ์นี้ให้)\n4. schema ที่เผยแพร่แล้วต้องเห็นได้ข้ามองค์กร เพื่อให้ verifier ต่างหน่วยงานสร้าง proof request ได้ (ข้อยกเว้นของ IDENTITY-02)\n5. ให้ Portal เลือก/ใช้ schema ตอนสร้าง template (รองรับ versioning)", "ac": "1. ดึง schema ผ่าน interface กลางได้ และ Portal เลือกใช้ได้\n2. schema versioning: แก้ schema ใหม่ไม่กระทบ VC ที่ออกไปแล้ว และดูได้ว่าเวอร์ชันใดเป็นใบประเภทเดียวกัน\n3. verifier ขององค์กรอื่นเห็นและเลือกใช้ schema ที่เผยแพร่แล้วได้\n4. โค้ดของ Schema Service ไม่มีการอ้างถึงชื่อ/โครงสร้างเฉพาะของ engine ตัวใดตัวหนึ่ง (ตรวจได้จาก review)", "sx": "งานหลักของระบบ as a backend engineer, i want to ให้ vcvp core sync schema จาก one-core, so that portal ใช้ schema ที่สอดคล้องกันในการสร้าง credential template"}, "CONSENT-01": {"id": "CONSENT-01", "what": "หน้าจอฝั่ง verifier สำหรับรับและตอบรับคำขอถอน", "out": "ผู้รับข้อมูลตอบรับและหยุดใช้ข้อมูลตามคำขอได้", "comp": "Consent Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Consent Withdrawal Management", "pri": "Medium", "pts": 5, "dep": "WALLET-07, VERIFIER-02, INTEGRATION-01", "sprint": 6, "status": "Backlog", "ws": "Consent Service", "phase": "Phase 2 เติมความสามารถ", "scope": "1. หน้าจอ ฝั่ง verifier สำหรับ ดูรายการคำขอถอนความยินยอมที่เข้ามา \n2. ดำเนินการ acknowledge ในการ หยุดหรือลบการใช้ข้อมูลตามคำขอ และอัปเดตสถานะกลับ\n3. การรับคำขอและส่ง webhook จัดการที่ VCVP Core (CONSENT-02)", "ac": "1. verifier เห็นรายการคำขอถอนพร้อมรายละเอียด\n2. ดำเนินการ acknowledge ในการ หยุดใช้ข้อมูลตามคำขอ และอัปเดตสถานะได้\n3. สถานะ sync กับ VCVP Core (CONSENT-02)", "sx": "งานหลักของระบบ as a verifier operator, i want to รับและจัดการคำขอถอนความยินยอมจากผู้ถือ, so that ปฏิบัติตามสิทธิ์ pdpa และหยุดใช้ข้อมูลตามที่ผู้ใช้ร้องขอ"}, "CONSENT-02": {"id": "CONSENT-02", "what": "รับคำขอถอนความยินยอมและแจ้งผู้รับข้อมูลผ่าน webhook", "out": "คำขอถอนถูกส่งถึงผู้รับข้อมูลและติดตามสถานะได้", "comp": "Consent Service", "group": "งานหลักของระบบ (ออก ตรวจ เพิกถอน VC)", "color": "#1d9e75", "feature": "Consent Withdrawal Orchestration & Webhook", "pri": "Medium", "pts": 5, "dep": "VERIFICATION-01", "sprint": 6, "status": "Backlog", "ws": "Consent Service", "phase": "Phase 2 เติมความสามารถ", "scope": "1. รับคำขอถอนความยินยอมจาก Wallet และ บันทึกอ้างอิง presentation\n2. แจ้ง verifier ปลายทางผ่าน webhook (HMAC) และ retry\n3. track สถานะการดำเนินการ", "ac": "1. รับคำขอถอนและบันทึกได้\n2. ส่ง webhook พร้อมลายเซ็น และ retry เมื่อล้มเหลว\n3. แสดงข้อมูลสถานะและติดตามสถานะการแจ้งได้", "sx": "งานหลักของระบบ as a backend engineer, i want to ให้ vcvp core รับและจัดการคำขอถอนความยินยอม, so that ปฏิบัติตาม pdpa และแจ้ง verifier ได้อัตโนมัติ"}, "KEY-01": {"id": "KEY-01", "what": "เปิดใช้ did:key / did:web / did:jwk และตั้ง resolver", "out": "สร้างและ resolve DID ขององค์กรได้", "comp": "Key & DID Service", "group": "พื้นที่หวงห้าม (key และ audit log)", "color": "#ba7517", "feature": "DID Method Provider", "pri": "Highest", "pts": 5, "dep": "PLATFORM-02, EDGE-01, ENGINE-01", "sprint": 1, "status": "Backlog", "ws": "Key & DID Service", "phase": "Phase 0 ตั้งฐาน", "scope": "1. ตั้งค่า DID method ใน one-core ผ่าน config (ENGINE-01) โดยเปิด did:key/web/jwk และปิดตัวที่ไม่ได้ใช้\n2. ตั้งค่า DID resolver และผูกกับ did:web hosting (EDGE-01)\n3. integrate ให้เรียก/ใช้งานผ่าน PostMan\n4. ทดสอบสร้างและ resolve DID ครบทุก method ที่เปิดใช้", "ac": "1. สร้าง DID ครบ 3 method ผ่าน one-core และ resolve ได้ถูกต้อง\n2. did:web ดึงจาก /.well-known/did.json สำเร็จ\n3. ทดสอบผ่าน Postman (dev) และสร้าง/resolve DID ผ่าน API ของ VCVP Core ได้ (integration)", "sx": "พื้นที่หวงห้าม as a system architect, i want to เปิดใช้งาน did method provider สำหรับ did:key, did:web และ did:jwk, so that ระบบสร้างและ resolve did ได้ตามบริบทการใช้งานที่แตกต่างกัน"}, "KEY-02": {"id": "KEY-02", "what": "ใช้ key reference แทนการดึง raw key ออกมาใช้", "out": "ลงนาม VC ได้โดยไม่ต้องดึง key ออกจากที่เก็บ", "comp": "Key & DID Service", "group": "พื้นที่หวงห้าม (key และ audit log)", "color": "#ba7517", "feature": "Key Storage Provider (Issuer)", "pri": "High", "pts": 5, "dep": "ENGINE-03", "sprint": 2, "status": "Backlog", "ws": "Key & DID Service", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. ตั้งค่า key storage ใน one-core ผ่าน config โดยเปิด INTERNAL (encrypted DB) สำหรับ dev/POC และ production ใช้ KMS ที่พัฒนาเพิ่ม (AWS/GCP ดู KEY-03) และปิดตัวที่ไม่ได้ใช้\n2. ใช้ key reference แทน raw key (private key ไม่ออกนอก storage)\n3. เปิดการใช้งาน key ผ่าน key reference เป็น API ของ VCVP Core (การ rotate key ดู KEY-04)", "ac": "1. private key เข้ารหัส at-rest (INTERNAL) หรืออยู่ใน KMS โดยไม่ออกนอก และไม่ถูก log\n2. ลงนาม VC อ้างอิงผ่าน key reference ไม่ดึง raw key ออกนอกระบบ\n3. สลับ key storage backend ผ่าน config ได้โดยไม่แก้โค้ด", "sx": "พื้นที่หวงห้าม as a security engineer, i want to จัดเก็บกุญแจของผู้ออกใบรับรองอย่างปลอดภัยผ่าน key storage provider, so that private key ไม่รั่วไหลและรองรับการ rotate"}, "KEY-03": {"id": "KEY-03", "what": "พัฒนา provider เก็บ key ใน KMS/HSM", "out": "key ของหน่วยงานไม่ออกนอก KMS ตลอดอายุการใช้งาน", "comp": "Key & DID Service", "group": "พื้นที่หวงห้าม (key และ audit log)", "color": "#ba7517", "feature": "Custom KMS Key Storage Provider (AWS / GCP)", "pri": "High", "pts": 13, "dep": "PLATFORM-02, KEY-02, ENGINE-06", "sprint": 7, "status": "Backlog", "ws": "Key & DID Service", "phase": "Phase 3 พร้อมเปิดใช้จริง", "scope": "1. ศึกษา keyStorage provider interface ของ one-core (มี INTERNAL/Azure Key Vault/Secure Enclave และ pkcs11 ยังเป็น stub ยังไม่มี AWS/GCP)\n2. เลือกแนวทาง \n A) INTERNAL+KEK จาก AWS/GCP Secret Manager (ENGINE-01)\n B) Fork เขียน provider ใหม่ตาม azure_vault pattern \n C) complete PKCS#11 stub + libkmsp11(GCP)/libcloudhsm_pkcs11\n D) AWS CloudHSM+PKCS#11 (FIPS 140-2 L3, government-grade)\n3. implement provider ที่เลือกใน one-core (Rust) โดย generate/sign ผ่าน KMS/HSM โดย private key ไม่ออกนอก KMS/HSM\n4. เพิ่ม config เปิดใช้ (ENGINE-01)  ทดสอบ (การจัดการ fork ดู ENGINE-06)", "ac": "1. one-core รองรับ keyStorage แบบ KMS (AWS หรือ GCP) และเลือกผ่าน config ได้\n2. generate/sign ผ่าน KMS สำเร็จโดย private key ไม่ออกนอก KMS\n3. issue/verify VC ด้วยกุญแจจาก KMS ได้แบบ end-to-end\n\nหมายเหตุ: AC ทั้งหมดวัดที่เป้าหมาย key-in-KMS (แนวทาง B/C/D) แนวทาง A เป็น Pilot fallback (= ENGINE-01) ยังไม่เข้าเกณฑ์เหล่านี้\n\nกรณีเลือกแนวทาง A (Pilot): ตาม ENGINE-01 (KEK ใน Secret Manager, ไม่ hardcode, rotate ได้) + issue/verify VC บน INTERNAL ได้แบบ end-to-end", "sx": "พื้นที่หวงห้าม as a backend/rust engineer, i want to พัฒนา keystorage provider ใหม่ใน one-core ให้เชื่อมต่อ aws kms หรือ google cloud kms, so that เก็บ/ใช้กุญแจบน kms ระดับ production แทน internal (encrypted db) ที่ใช้ใน poc"}, "KEY-04": {"id": "KEY-04", "what": "rotate key และเก็บ key เก่าไว้สำหรับ verify เท่านั้น", "out": "เปลี่ยน key ได้โดย VC ที่ออกไปแล้วยังตรวจผ่าน", "comp": "Key & DID Service", "group": "พื้นที่หวงห้าม (key และ audit log)", "color": "#ba7517", "feature": "Key Rotation & DID Lifecycle Management", "pri": "Medium", "pts": 8, "dep": "KEY-01, KEY-02", "sprint": 8, "status": "Backlog", "ws": "Key & DID Service", "phase": "Phase 3 พร้อมเปิดใช้จริง", "scope": "1. implement กระบวนการ rotate signing key เอง สร้าง key ใหม่ + เก็บ key เก่าไว้ verify-only ใน DID document + วางแผน re-issue VC\n2. ใช้ did:webvh prerotation ระดับ DID และ อัปเดต/deactivate DID\n3. orchestrate ผ่าน VCVP Core และรักษา key versioning ให้ VC เดิมยัง verify ได้\n4. บันทึกประวัติการ rotate/อัปเดต DID\nหมายเหตุ: one-core ไม่มีกระบวนการ rotate key ในตัว งานนี้จึงต้องพัฒนาเพิ่มทั้งหมด ถ้าเปลี่ยนไปใช้ engine ที่มีให้แล้ว ขอบเขตงานนี้จะเปลี่ยน", "ac": "1. rotate signing key แล้วเก็บ key เก่าเป็น verify-only ใน DID document เพื่อให้ VC เก่ายัง verify ผ่าน, VC ใหม่ใช้ key ใหม่\n2. ปิดใช้งาน (deactivate) กุญแจเก่า/DID ได้ และรองรับ did:webvh prerotation\n3. มีประวัติของการ rotate และอัปเดต DID", "sx": "พื้นที่หวงห้าม as a security engineer, i want to หมุนเวียนกุญแจและอัปเดต/ปิดใช้งาน did ตามวงจรชีวิต, so that ลดความเสี่ยงกุญแจรั่วไหลและคงความน่าเชื่อถือระยะยาว"}, "AUDIT-01": {"id": "AUDIT-01", "what": "รวม audit log ที่ VCVP Core พร้อมหน้าค้นหาและ export", "out": "ค้นหาและออกรายงาน compliance ได้จากที่เดียว", "comp": "Audit & Compliance Service", "group": "พื้นที่หวงห้าม (key และ audit log)", "color": "#ba7517", "feature": "Audit Log & Compliance Reporting", "pri": "High", "pts": 8, "dep": "ISSUANCE-01, IDENTITY-03", "sprint": 6, "status": "Backlog", "ws": "Audit & Compliance Service", "phase": "Phase 2 เติมความสามารถ", "scope": "1. รวม audit log แบบ append-only ที่ชั้น VCVP Core ครอบคลุม key/sign operation events (issue/sign/revoke/verify) ที่ engine ไม่ได้ log เอง และ event อื่นจาก VCVP Core\n2. หน้าจอสำหรับค้นหา/กรอง และ export รายงาน compliance (PDPA/ETDA)", "ac": "1. ทุก action สำคัญรวมถึงการ sign/ใช้กุญแจ ถูกบันทึกและแก้ไขย้อนหลังไม่ได้ (immutable)\n2. ค้นหา log ตาม actor/tenant/ประเภท/ช่วงเวลาได้\n3. Export รายงาน compliance ตามรูปแบบที่กำหนด", "sx": "พื้นที่หวงห้าม as an auditor, i want to เข้าถึง audit log แบบ append-only และออกรายงาน compliance, so that ตรวจสอบการดำเนินงานตาม pdpa/etda ได้"}, "AUDIT-02": {"id": "AUDIT-02", "what": "ทำ hash-chain, WORM, จำกัดสิทธิ์เข้าถึง และ retention ของ log", "out": "log ใช้เป็นหลักฐานได้จริง เพราะแก้ย้อนหลังแล้วตรวจจับได้", "comp": "Audit & Compliance Service", "group": "พื้นที่หวงห้าม (key และ audit log)", "color": "#ba7517", "feature": "Audit Log Security & Retention (ISO 27001)", "pri": "High", "pts": 5, "dep": "AUDIT-01", "sprint": 7, "status": "Backlog", "ws": "Audit & Compliance Service", "phase": "Phase 3 พร้อมเปิดใช้จริง", "scope": "1. Hash-chain ของ log entry (แต่ละรายการผูก hash ของรายการก่อนหน้า) เพื่อ tamper-evidence ตรวจจับการแก้ไขได้\n2. จัดเก็บแบบ WORM / append-only (เขียนครั้งเดียว แก้/ลบไม่ได้)\n3. จำกัดการเข้าถึง audit log เฉพาะ role ที่ได้รับสิทธิ์ (เช่น Auditor) ผ่าน RBAC และบันทึกการเข้าถึง log เอง\n4. Retention policy: เก็บ log ตามระยะที่กำหนด (ETDA/PDPA) + archive/purge อัตโนมัติเมื่อครบกำหนด", "ac": "1. แก้ไข/ลบ log entry แล้วตรวจจับได้ (hash-chain เสีย) และเขียนทับ/แก้ไม่ได้ (WORM)\n2. เฉพาะ role ที่ได้รับสิทธิ์เข้าถึง audit log ได้ และการเข้าถึงถูกบันทึก\n3. log ถูกเก็บครบตาม retention ที่กำหนด และ archive/purge เมื่อครบกำหนด", "sx": "พื้นที่หวงห้าม as a security/compliance officer, i want to ให้ audit log ปลอดภัยและเชื่อถือได้ตาม iso 27001 (กันแก้ไข จำกัดการเข้าถึง เก็บตามกำหนด), so that ใช้เป็นหลักฐานและสามารถตรวจสอบย้อนหลังได้จริง"}, "AUDIT-03": {"id": "AUDIT-03", "what": "กำหนด retention ของข้อมูลธุรกิจ และรองรับสิทธิเจ้าของข้อมูล", "out": "ข้อมูลส่วนบุคคลถูกลบตามกำหนด และตอบคำขอใช้สิทธิได้", "comp": "Audit & Compliance Service", "group": "พื้นที่หวงห้าม (key และ audit log)", "color": "#ba7517", "feature": "Data Retention & Data Subject Rights (PDPA)", "pri": "High", "pts": 5, "dep": "IDENTITY-04, CONSENT-01, WALLET-06", "sprint": 7, "status": "Backlog", "ws": "Audit & Compliance Service", "phase": "Phase 3 พร้อมเปิดใช้จริง", "scope": "1. กำหนด retention ของข้อมูลธุรกิจ (issuance/verification record, claim ที่ถูกเปิดเผย) แยกตามประเภทข้อมูล\n2. ลบหรือทำให้ไม่ระบุตัวตน (anonymize) อัตโนมัติเมื่อครบกำหนด\n3. รองรับสิทธิเจ้าของข้อมูล: ขอเข้าถึง ขอสำเนา และขอลบ ตาม PDPA\n4. เก็บ claim เท่าที่จำเป็นตามที่ประกาศไว้ใน proof request (data minimization)\n5. กำหนดนโยบายของประวัติการเปิดเผยข้อมูลของผู้ถือที่เก็บไว้ที่ส่วนกลาง (WALLET-06) ว่าเก็บนานเท่าไร ใครในองค์กรเข้าถึงได้ และผู้ถือขอลบได้แค่ไหน", "ac": "1. ข้อมูลที่ครบกำหนดถูกลบ/anonymize อัตโนมัติและตรวจสอบได้\n2. ตอบคำขอใช้สิทธิของเจ้าของข้อมูลได้ภายในเวลาที่กำหนด\n3. ไม่มีการเก็บ claim เกินกว่าที่ประกาศไว้ใน proof request\n4. ประวัติการเปิดเผยข้อมูลของผู้ถือมีนโยบาย retention และการจำกัดสิทธิ์เข้าถึงที่บันทึกไว้ และบังคับใช้ได้จริง", "sx": "พื้นที่หวงห้าม as a data protection officer, i want to ให้ข้อมูลส่วนบุคคลในระบบถูกเก็บเท่าที่จำเป็นและใช้สิทธิได้ตาม pdpa, so that ระบบเป็นไปตามกฎหมายคุ้มครองข้อมูลส่วนบุคคล"}, "WALLET-01": {"id": "WALLET-01", "what": "เก็บ key ในพื้นที่ปลอดภัยของอุปกรณ์ (secure enclave/keystore)", "out": "key ของผู้ถืออยู่ในเครื่องอย่างปลอดภัย ดึงออกไม่ได้", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Key Storage Provider (Wallet / Encrypted DB)", "pri": "Highest", "pts": 8, "dep": "ENGINE-03, KEY-01", "sprint": 3, "status": "Backlog", "ws": "Wallet App", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. เก็บ private key ใน secure hardware ของอุปกรณ์ (iOS Secure Enclave / Android Keystore) และเก็บ VC ใน encrypted DB บนอุปกรณ์\n2. เข้ารหัสด้วยกุญแจที่ผูกกับ device unlock\n3. ประเมินและเลือกวิธี implement ความสามารถฝั่งอุปกรณ์ (key storage, SD-JWT, OpenID4VCI/VP client, DID) ระหว่างใช้ SDK ของ engine กับใช้ library มาตรฐานแบบ open-source โดยผลลัพธ์ต้องผ่าน conformance เดียวกันไม่ว่าเลือกทางไหน\n4. เกณฑ์ที่ต้องใช้ประเมิน: มาตรฐานที่รองรับครบไหม (SD-JWT, เวอร์ชัน OpenID4VCI/VP ที่ตรงกับ PROTOCOL-01/02, status list, DID method ตาม KEY-01), รองรับ mDoc/ISO 18013-5 ในอนาคตไหม (ENGINE-08), รองรับทั้ง iOS และ Android ไหม, ใบอนุญาตและข้อผูกพัน, ภาระดูแลระยะยาวและการแก้ช่องโหว่, ต้นทุนการเปลี่ยนถ้าต้องเปลี่ยนภายหลัง, รองรับการแยกกุญแจของผู้ถือต่อผู้ตรวจแต่ละราย (เช่น ออก VC เป็นชุดหลายใบ ใบละกุญแจ) เพื่อกันการเชื่อมโยงตัวตนข้ามผู้ตรวจ ได้แค่ไหน (ประเด็นนี้ยังไม่ฟันธงว่าจะทำ ให้ประเมินไว้เพื่อใช้ตัดสินใจ)\n5. เรียกใช้ความสามารถฝั่งอุปกรณ์ผ่าน interface ของเราเอง (wallet adapter) เพื่อให้เปลี่ยนวิธี implement ภายหลังได้โดยไม่ต้องรื้อทั้งแอป\n6. บันทึกผลการเลือกพร้อมเหตุผลและเงื่อนไขที่จะต้องกลับมาทบทวน เป็นเอกสารการตัดสินใจเชิงสถาปัตยกรรม (ADR)", "ac": "1. VC และ key ถูกเข้ารหัสขณะจัดเก็บ และถอดได้เมื่อปลดล็อกเท่านั้น\n2. ข้อมูลไม่สามารถอ่านได้หากเข้าถึงไฟล์ฐานข้อมูลโดยตรง\n3. ผ่านการทดสอบบนอุปกรณ์จริง (Android Keystore/iOS Keychain)\n4. มีเอกสารเปรียบเทียบทางเลือกและผลการตัดสินใจ (ADR) ที่ระบุเกณฑ์และเหตุผลครบ\n5. โค้ด UI และ business logic ของ Wallet ไม่เรียก API ของ library ภายนอกโดยตรง เรียกผ่าน wallet adapter เท่านั้น (ตรวจได้จาก review/test)", "sx": "แอปและหน้าจอผู้ใช้ as a wallet user, i want to ให้ private key และ vc ถูกจัดเก็บอย่างปลอดภัยในกระเป๋าดิจิทัล, so that ข้อมูลของฉันปลอดภัยแม้อุปกรณ์สูญหาย"}, "WALLET-02": {"id": "WALLET-02", "what": "สร้าง/กู้คืน wallet และล็อกด้วย PIN หรือ biometric", "out": "เปิดใช้ wallet ได้เอง และคนอื่นเปิดดูไม่ได้", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Wallet Onboarding, PIN & Biometric Lock", "pri": "High", "pts": 5, "dep": "WALLET-01", "sprint": 3, "status": "Backlog", "ws": "Wallet App", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. Wallet onboarding: สร้าง/กู้คืนกระเป๋า, ตั้ง PIN หรือ เปิด biometric (Face/Touch)\n2. การเข้าถึง wallet ต้องยืนยันด้วย PIN หรือ biometric ที่ตั้งไว้ในแอปทุกครั้งก่อนเข้าถึง VC/กุญแจ และแอป re-lock เองเมื่อปิดหรือพักไว้เกินเวลาที่กำหนด (เป็นการล็อกระดับแอปของเราเอง ไม่ขึ้นกับการล็อกหน้าจอของมือถือ)", "ac": "1. ตั้ง PIN และเปิดใช้ biometric ได้ในขั้นตอน onboarding\n2. แอปล็อกอัตโนมัติและต้องปลดล็อกก่อนเข้าถึง VC\n3. ป้องกัน brute-force PIN (จำกัดจำนวนครั้ง/หน่วงเวลา)", "sx": "แอปและหน้าจอผู้ใช้ as a wallet user, i want to ตั้งค่าเริ่มต้นกระเป๋าและล็อกด้วย pin/ไบโอเมตริก, so that เฉพาะฉันเท่านั้นที่เปิดใช้กระเป๋าและเข้าถึง vc ได้"}, "WALLET-03": {"id": "WALLET-03", "what": "หน้าจอเลือก claim ที่จะเปิดเผยตามที่ verifier ร้องขอ", "out": "ผู้ถือเปิดเผยเฉพาะข้อมูลที่จำเป็นเท่านั้น", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Selective Disclosure (SD-JWT)", "pri": "High", "pts": 5, "dep": "ENGINE-02, ENGINE-03, WALLET-01, EDGE-03", "sprint": 3, "status": "Backlog", "ws": "Wallet App", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. ใช้ selective disclosure ของ SD-JWT บน wallet ผ่าน wallet adapter (WALLET-01)\n2. UI ให้ผู้ใช้เลือก claim ที่จะเปิดเผยตาม presentation definition\n3. ยื่น VP ไปที่ endpoint OpenID4VP บน domain ของเรา (PROTOCOL-02 / EDGE-03)", "ac": "1. ผู้ใช้สามารถเลือกเปิดเผยเฉพาะ claim ที่ต้องการก่อนยื่น VP ได้\n2. Verifier ตรวจ VP (SD-JWT) ผ่านโดยไม่เห็น claim ที่ไม่เปิดเผย\n3. ตรวจสอบ claim payload ต้องมีเฉพาะ รายการที่เลือกแชร์เท่านั้น", "sx": "แอปและหน้าจอผู้ใช้ as a wallet user, i want to เลือกเปิดเผยเฉพาะข้อมูลบางส่วนใน vc, so that ปกป้องความเป็นส่วนตัวตามหลัก data minimization และ pdpa"}, "WALLET-04": {"id": "WALLET-04", "what": "ดู/เพิ่ม/ลบ VC พร้อมแสดงสถานะและแจ้งเตือน", "out": "ผู้ถือเห็น VC ทั้งหมด และรู้ว่าใบไหนหมดอายุหรือถูกเพิกถอน", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Credential Management UI/API", "pri": "Medium", "pts": 5, "dep": "WALLET-01", "sprint": 3, "status": "Backlog", "ws": "Wallet App", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. สามารถ เพิ่ม ลบ ดูรายการและรายละเอียด VC ในกระเป๋า\n2. แสดงสถานะ (active/revoked/expired) โดยตรวจการเพิกถอนจาก status list ที่ระบุอยู่ในตัว VC ใบนั้น (อาจอยู่คนละ domain ตามแต่ละ issuer) และตรวจวันหมดอายุจากตัว VC ในเครื่อง ทั้งสองทางไม่ต้องยืนยันตัวตน\n3. แจ้งเตือนเมื่อ VC ใกล้หมดอายุ/ถูกเพิกถอน", "ac": "1. แสดงรายการ VC พร้อมสถานะปัจจุบันได้ถูกต้อง\n2. ลบ VC ออกจากกระเป๋าได้และข้อมูลถูกลบจริงจาก storage\n3. แจ้งเตือนเมื่อ VC ใกล้หมดอายุหรือถูกเพิกถอน", "sx": "แอปและหน้าจอผู้ใช้ as a wallet user, i want to ดู เพิ่ม ลบ และตรวจสอบสถานะ vc ในกระเป๋า, so that จัดการใบรับรองของตัวเองได้สะดวก"}, "WALLET-05": {"id": "WALLET-05", "what": "ยื่นคำขอรับ VC ด้วยตนเองจากในแอป", "out": "ขอ VC ได้จากในแอปโดยไม่ต้องเดินทางไปหน่วยงาน", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Self-Service Credential Request", "pri": "Medium", "pts": 5, "dep": "PROTOCOL-01, IDENTITY-06, ISSUANCE-03", "sprint": 5, "status": "Backlog", "ws": "Wallet App", "phase": "Phase 2 เติมความสามารถ", "scope": "1. สามารถส่งคำขอรับ VC แบบ self-service (เลขบัตร ปชช./เลขใบอนุญาต) ผ่าน VCVP Core (ISSUANCE-03)\n2. แสดงสถานะคำขอและ offer ที่ได้รับกลับ", "ac": "1. ผู้ใช้กรอกข้อมูลระบุตัวตนและส่งคำขอรับ VC ได้\n2. ระบบเชื่อมคำขอกับ credential id เมื่อออก offer สำเร็จ\n3. แสดงสถานะคำขอและ offer ที่ได้รับกลับ", "sx": "แอปและหน้าจอผู้ใช้ as a wallet user, i want to ขอรับใบรับรองด้วยตนเองโดยกรอกข้อมูลระบุตัวตน, so that เริ่มกระบวนการรับ vc ได้โดยไม่ต้องรอลิงก์จากผู้ออก"}, "WALLET-06": {"id": "WALLET-06", "what": "แสดง timeline การรับ/ยื่น/ถูกเพิกถอนของแต่ละใบ", "out": "ผู้ถือย้อนดูได้ว่าเคยให้ข้อมูลกับใครไปบ้าง", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Activity & Disclosure History", "pri": "Low", "pts": 5, "dep": "WALLET-04, IDENTITY-06", "sprint": 5, "status": "Backlog", "ws": "Wallet App", "phase": "Phase 2 เติมความสามารถ", "scope": "1. แสดงประวัติกิจกรรม/การเปิดเผยข้อมูล โดยดึงข้อมูลผ่านทาง VCVP Core\n2. timeline เหตุการณ์ของแต่ละ VC (RECEIVED/PRESENTED/REVOKED)\n3. กรอง/ดูรายละเอียดย้อนหลังได้", "ac": "1. แสดงประวัติการเปิดเผยข้อมูล (disclosure) แยกตามสถานะ\n2. แสดง timeline เหตุการณ์ของแต่ละ VC\n3. กรอง/ดูรายละเอียดรายการย้อนหลังได้", "sx": "แอปและหน้าจอผู้ใช้ as a wallet user, i want to ดูประวัติกิจกรรมและการเปิดเผยข้อมูลของฉัน, so that ตรวจสอบย้อนหลังได้ว่าเคยยื่นข้อมูลอะไรให้ใคร"}, "WALLET-07": {"id": "WALLET-07", "what": "ช่องทางถอนความยินยอมของข้อมูลที่เคยยื่นไป", "out": "ผู้ถือขอให้หยุดใช้ข้อมูลที่เคยให้ไปได้", "comp": "Wallet App", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Consent Withdrawal (Right to Erasure)", "pri": "High", "pts": 5, "dep": "WALLET-06, PROTOCOL-02, CONSENT-02, IDENTITY-06", "sprint": 6, "status": "Backlog", "ws": "Wallet App", "phase": "Phase 2 เติมความสามารถ", "scope": "1. มีช่องทางให้สามารถส่งคำขอถอนความยินยอมของ VP ที่เคยยื่น\n2. แสดงประวัติการถอนและสถานะ\n3. ส่งคำขอผ่าน VCVP Core (CONSENT-02) เพื่อแจ้ง verifier และฝั่ง verifier ดำเนินการที่ CONSENT-01", "ac": "1. ผู้ใช้ส่งคำขอถอนความยินยอมของ VP ที่เคยยื่นได้ และเห็นประวัติ/สถานะ\n2. คำขอถูกส่งต่อให้ VCVP Core (CONSENT-02) เพื่อแจ้ง verifier\n3. ฝั่ง verifier รับและดำเนินการคำขอที่ CONSENT-01 (ตรวจผลฝั่งนั้น)", "sx": "แอปและหน้าจอผู้ใช้ as a wallet user, i want to ถอนความยินยอมการเปิดเผยข้อมูลหลังยื่น vp ไปแล้ว, so that ใช้สิทธิ์ตาม pdpa ในการให้ผู้ตรวจสอบลบ/หยุดใช้ข้อมูลของฉัน"}, "PORTAL-01": {"id": "PORTAL-01", "what": "wizard ตั้งค่า DID และ key ขององค์กร พร้อมตรวจความพร้อม", "out": "หน่วยงานใหม่พร้อมออก/ตรวจ VC ได้ด้วยตัวเอง", "comp": "Portal (ส่วนกลาง)", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Organization DID & Key Setup", "pri": "High", "pts": 8, "dep": "KEY-01, KEY-02, IDENTITY-02", "sprint": 3, "status": "Backlog", "ws": "Portal (ส่วนกลาง)", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. Portal UI onboarding wizard ตั้งค่า DID/key ขององค์กร\n2. เรียก VCVP Core เพื่อ สร้าง DID (did:web/key) + generate/import key\n3. เผยแพร่และตรวจ did.json + แสดงสถานะความพร้อม", "ac": "1. สร้าง DID องค์กรและกุญแจผ่าน Portal ได้สำเร็จ\n2. สำหรับ did:web ระบบช่วยเผยแพร่และตรวจ did.json ที่ปลายทาง\n3. แสดงสถานะความพร้อม (DID ready / key ready) ของแต่ละองค์กร", "sx": "แอปและหน้าจอผู้ใช้ as an issuer operator, i want to ตั้งค่า did และกุญแจขององค์กรผ่านขั้นตอน onboarding ใน portal, so that องค์กรพร้อมออกและตรวจ vc ได้โดยไม่ต้องแก้ config เอง"}, "PORTAL-02": {"id": "PORTAL-02", "what": "จัดการ entity ฝั่ง issuer/verifier และผูก DID/key", "out": "จัดการหน่วยงานย่อยที่ทำหน้าที่ออกหรือตรวจได้", "comp": "Portal (ส่วนกลาง)", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Issuer & Verifier Entity Management", "pri": "High", "pts": 5, "dep": "IDENTITY-02, PORTAL-01", "sprint": 3, "status": "Backlog", "ws": "Portal (ส่วนกลาง)", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. Portal UI CRUD issuer/verifier entity และ ผูก DID/Key\n2. scope ตามองค์กร ผ่าน VCVP Core", "ac": "1. สร้าง/แก้ไข/ดู issuer และ verifier entity พร้อมผูก DID/Key\n2. Entity ถูก scope ตาม organization ที่ถูกต้อง\n3. เลือก entity ไปใช้ในสาย issuance/verification ได้", "sx": "แอปและหน้าจอผู้ใช้ as a portal administrator, i want to สร้างและจัดการ entity ของ issuer และ verifier พร้อมผูก did และ key, so that กำหนดผู้ออกและผู้ตรวจในแต่ละองค์กรได้"}, "PORTAL-03": {"id": "PORTAL-03", "what": "รองรับภาษาไทย/อังกฤษ และมาตรฐานการเข้าถึง WCAG 2.1 AA", "out": "ใช้งานได้ทั้งสองภาษา รวมถึงผู้พิการ", "comp": "Portal (ส่วนกลาง)", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Localization & Accessibility (i18n / WCAG)", "pri": "Low", "pts": 5, "dep": "IDENTITY-01", "sprint": 7, "status": "Backlog", "ws": "Portal (ส่วนกลาง)", "phase": "Phase 3 พร้อมเปิดใช้จริง", "scope": "Implement i18n (ไทย/อังกฤษ) ทั้ง UI และ notification template, รองรับ WCAG 2.1 AA (keyboard navigation, contrast, screen reader) และ locale ของวันที่/ตัวเลข", "ac": "1. สลับภาษาไทย/อังกฤษได้ทั้งระบบ\n2. ผ่านการตรวจ accessibility WCAG 2.1 AA เบื้องต้น\n3. รูปแบบวันที่/ตัวเลขแสดงตาม locale", "sx": "แอปและหน้าจอผู้ใช้ as a portal user, i want to ใช้งาน portal ได้ทั้งภาษาไทย/อังกฤษ และเข้าถึงได้ตามมาตรฐาน, so that ผู้ใช้หลากหลายกลุ่มใช้งานได้สะดวกและทั่วถึง"}, "ISSUER-01": {"id": "ISSUER-01", "what": "สร้าง/แก้ไข/เผยแพร่ schema และ template ของ VC", "out": "เจ้าหน้าที่กำหนดหน้าตาของ VC ได้เองโดยไม่ต้องพึ่ง dev", "comp": "Issuer Portal", "group": "แอปและหน้าจอผู้ใช้", "color": "#378add", "feature": "Credential Schema & Template Management", "pri": "Highest", "pts": 5, "dep": "ENGINE-02, IDENTITY-03, SCHEMA-01", "sprint": 3, "status": "Backlog", "ws": "Issuer Portal", "phase": "Phase 1 ต่อให้ติดครบวงจร", "scope": "1. หน้าจอสำหรับ สร้าง/แก้ไข/เผยแพร่ credential schema/template โดยแยกสถานะร่างกับสถานะเผยแพร่ออกจากกัน และการเผยแพร่หมายถึงทำให้ schema และ type metadata เข้าถึงได้จาก URL สาธารณะบน domain ของเรา และเห็นได้ข้ามองค์กร\n2. เรียกผ่าน VCVP Core (schema sync = SCHEMA-01)\n3. เลือก format/revocationMethod โดยอ้างอิง config instance ที่เปิดใช้ใน one-core (ดู ENGINE-01) และ versioning\n4. การแก้ schema ที่เผยแพร่แล้วต้องออกเป็นเวอร์ชันใหม่เสมอ ไม่ทับของเดิม และผูกอยู่ในสายเวอร์ชันเดียวกัน (SCHEMA-01) ส่วนร่างที่ยังไม่เผยแพร่แก้ทับได้\n5. ห้ามลบ schema ที่มี VC อ้างอยู่ ระบบต้องปฏิเสธพร้อมเหตุผล", "ac": "1. สร้าง/แก้ไข/เผยแพร่ schema และเลือก format ได้\n2. Schema กำหนด claim/format (SD-JWT) ถูกต้องและ validate ได้\n3. แก้ schema สร้างเวอร์ชันใหม่โดยไม่กระทบ VC ที่ออกไปแล้ว\n4. ลบ schema ที่มี VC อ้างอยู่ไม่ได้ ระบบปฏิเสธพร้อมเหตุผลที่ระบ
